<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 PJT 정보 공유 관리 시스템</title>
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' }, brand: { blue: '#3b82f6', cyan: '#06b6d4', red: '#ef4444' } } }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* 입력 폼 최적화 */
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        
        .clickable-tile { cursor: pointer; transition: all 0.2s ease; }
        .clickable-tile:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-2px); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* 🔥 PDF 출력 완벽 최적화 (잘림 방지) 🔥 */
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            #main-wrapper, #sidebar, header, .no-print, button, .fa-search-plus, .fa-times { display: none !important; }
            body, html { height: auto !important; overflow: visible !important; background: white !important; color: black !important; }
            #sync-area { display: block !important; height: auto !important; overflow: visible !important; }
            .glass-panel, section, .clickable-tile { 
                page-break-inside: avoid !important; border: 1px solid #ddd !important; background: white !important; color: black !important; margin-bottom: 1.5rem !important; box-shadow: none !important;
            }
            input, textarea, select { background: transparent !important; border: none !important; color: black !important; appearance: none; font-weight: bold; }
            .text-white, .text-slate-200, .text-slate-300 { color: black !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" data-current-pjt="">

    <div id="main-wrapper" class="flex h-screen w-full overflow-hidden">
        
        <!-- 1. 사이드바 -->
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 hidden md:flex flex-col shrink-0 z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <i class="fas fa-bolt text-brand-blue text-xl mr-3"></i>
                <span class="font-extrabold text-[15px] tracking-wide text-white">전력솔루션영업부문</span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto relative">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Main Menu</div>
                
                <!-- 스마트 검색창 (사이드바 필터 + 엔터 시 딥스캔) -->
                <div class="mb-4 relative no-print group">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs transition-colors group-focus-within:text-brand-cyan"></i>
                    <input type="text" id="pjtSearch" oninput="filterSidebar(this.value)" onkeydown="if(event.key==='Enter') executeSmartSearch(this.value)" placeholder="PJT, 상태, 담당자 검색 ⏎" class="w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:border-brand-cyan outline-none" title="입력 시 즉시 필터링, 엔터 시 전체 검색 팝업">
                </div>

                <nav class="space-y-1">
                    <button onclick="togglePjtMenu()" class="w-full flex justify-between items-center px-3 py-2.5 bg-brand-blue/10 text-brand-blue rounded-lg font-bold transition-colors">
                        <div class="flex items-center"><i class="fas fa-chart-pie w-5 mr-2"></i> PJT 대시보드</div>
                        <i id="pjtChevron" class="fas fa-chevron-down text-xs transition-transform duration-200 transform rotate-180"></i>
                    </button>
                    <div id="pjtSubMenu" class="pl-9 pr-2 py-2 space-y-3">
                        <div id="loadingSidebar" class="text-slate-500 text-xs py-4 text-center"><i class="fas fa-spinner fa-spin"></i> DB 연결 중...</div>
                    </div>
                </nav>
            </div>
        </aside>

        <!-- 2. 메인 컨텐츠 영역 -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-4 lg:px-6 shrink-0 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-slate-300 hover:text-white mr-4" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="font-bold text-lg text-white hidden sm:block">PJT 정보 공유 관리 시스템</h1>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div id="lastModifiedTime" class="hidden sm:flex items-center text-[11px] font-medium text-slate-400 mr-2 tracking-wide no-print">
                        <i class="far fa-clock mr-1.5"></i><span id="lastModText">최종 수정: -</span>
                    </div>

                    <button id="saveBtn" onclick="saveDataToCloud()" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white text-[13px] px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg transition-all hover:-translate-y-0.5 border border-green-500" title="단축키: Ctrl + S">
                        <i class="fas fa-save"></i> <span>저장</span>
                    </button>
                    <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white text-[13px] px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg transition-all hover:-translate-y-0.5 border border-slate-500">
                        <i class="fas fa-print"></i> <span>출력</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-850 relative">
                <div class="max-w-7xl mx-auto">
                    <div id="sync-area" class="transition-opacity duration-300 opacity-30">
                        <!-- 프로젝트 데이터가 로드되는 영역 -->
                    </div> 
                </div>
            </div>
        </main>
    </div>

    <!-- 3. 모달 레이어 (스마트 검색 결과) -->
    <div id="smartSearchModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center backdrop-blur-sm opacity-0 transition-all duration-300" onclick="closeSmartSearchModal()">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-11/12 max-w-3xl shadow-2xl transform scale-95 relative flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <button onclick="closeSmartSearchModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 rounded-full w-8 h-8 flex items-center justify-center z-10"><i class="fas fa-times"></i></button>
            <div class="flex items-center gap-3 mb-4 border-b border-slate-700 pb-4 shrink-0">
                <div class="w-10 h-10 rounded-full bg-brand-cyan/20 flex items-center justify-center"><i class="fas fa-search text-brand-cyan text-xl"></i></div>
                <h3 class="text-xl font-bold text-white">스마트 검색 결과</h3>
                <span id="searchQueryBadge" class="ml-2 bg-slate-700/50 text-brand-cyan text-xs px-3 py-1 rounded-full font-bold"></span>
            </div>
            <div id="smartSearchResultContent" class="overflow-y-auto pr-2 space-y-6 flex-1 pb-4">
                <!-- 결과 동적 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 상세정보 팝업 모달 -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm opacity-0 transition-all duration-300" onclick="closeModal()">
        <div id="modalInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 md:p-8 w-11/12 max-w-2xl shadow-2xl transform scale-95 transition-all duration-300 relative" onclick="event.stopPropagation()">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 rounded-full w-8 h-8 flex items-center justify-center"><i class="fas fa-times"></i></button>
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-4">
                <div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center"><i class="fas fa-info-circle text-brand-blue text-xl"></i></div>
                <h3 id="modalTitle" class="text-2xl font-bold text-white">상세 정보</h3>
            </div>
            <div id="modalContent" class="text-slate-200 text-sm leading-relaxed overflow-y-auto max-h-[60vh] pr-2"></div>
            <div class="mt-8 text-right"><button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg font-bold transition-colors">닫기</button></div>
        </div>
    </div>

    <!-- 핵심 로직 스크립트 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        
        // 🔒 보안 알고리즘: API 키 유출 방지를 위한 역순 배치
        const _SECRET_KEY_ = "c6hQxtkc0VG9nBMNUlDWa4x1IWSYcJAYsazIA"; 
        const _DEPT_PW_ = "gaon"; // 부서 공용 암호

        let appDB = {};
        let updateTimes = {}; 
        const parser = new DOMParser();

        // 1. 초기 로드 및 환경 설정
        window.onload = async function() {
            const syncArea = document.getElementById('sync-area');
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span class="hidden sm:inline">DB 연결 중...</span>';

            try {
                const response = await fetch(WEB_APP_URL + "?t=" + Date.now());
                const data = await response.json();
                if (data && !data.error) {
                    appDB = data;
                    if (appDB['_UPDATED_TIMES_']) updateTimes = JSON.parse(appDB['_UPDATED_TIMES_']);
                }
            } catch (e) { console.warn("DB 연결 실패 - 로컬 모드 시작"); }

            renderSidebar();
            const first = document.querySelector('.pjt-link');
            if (first) first.click(); else loadProject('신규 프로젝트', null);

            syncArea.style.opacity = '1';
            btn.innerHTML = '<i class="fas fa-save"></i> <span class="hidden sm:inline">저장</span>';
        };

        // 2. 부서 공용 AI 조언 로직 (암호화 해제 포함)
        window.getAIAdvice = async function(btn) {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            const riskArea = btn.closest('section').querySelectorAll('textarea')[0];
            const targetArea = btn.closest('section').querySelectorAll('textarea')[1];
            const riskText = riskArea.value.trim();

            if (!riskText) { alert("현재 막혀있는 '이슈(Risk)'를 먼저 입력해 주세요!"); return; }

            // 팀원 공유 암호 확인
            let key = localStorage.getItem('_team_ai_key_');
            if (!key) {
                const inputPw = prompt("부서 공용 비밀번호를 입력해 주세요 (최초 1회):");
                if (inputPw === _DEPT_PW_) {
                    key = _SECRET_KEY_.split('').reverse().join('');
                    localStorage.setItem('_team_ai_key_', key);
                } else {
                    alert("비밀번호가 올바르지 않습니다."); return;
                }
            }

            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 분석 중..';
            btn.disabled = true;

            try {
                // 부하 방지를 위해 DB 키값만 요약 전달
                const dbNames = Object.keys(appDB).filter(k => !k.startsWith('_')).join(', ');
                const payload = {
                    contents: [{ parts: [{ text: `넌 전력 산업 영업 전략 전문가야. 프로젝트 '${currentPjt}'의 현안 '${riskText}'에 대해, 관련 부서 협업이나 대리점망 활용 등 구체적인 돌파 전략을 1~2문장으로 제안해줘. (참고 DB 목록: ${dbNames})` }] }]
                };

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error("API 통신 실패");
                const resData = await response.json();
                const advice = resData.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (advice) {
                    targetArea.value = advice.trim();
                    targetArea.style.height = 'auto';
                    targetArea.style.height = targetArea.scrollHeight + 'px';
                    commitCurrentState();
                }
            } catch (e) {
                alert("AI 연결 오류가 발생했습니다. 암호가 만료되었을 수 있으니 다시 시도해 주세요.");
                localStorage.removeItem('_team_ai_key_');
            } finally {
                btn.innerHTML = originalBtn;
                btn.disabled = false;
            }
        };

        // 3. 스마트 검색 및 필터링 최적화
        window.filterSidebar = function(query) {
            query = query.toLowerCase().trim();
            document.querySelectorAll('.pjt-item-wrap').forEach(item => {
                const name = item.querySelector('.pjt-link').innerText.toLowerCase();
                const content = appDB[item.querySelector('.pjt-link').innerText] || "";
                const statusMatch = content.match(/<option[^>]*selected[^>]*>([^<]+)<\/option>/i);
                const status = statusMatch ? statusMatch[1].toLowerCase() : "";
                item.style.display = (name.includes(query) || status.includes(query)) ? 'flex' : 'none';
            });
        };

        window.executeSmartSearch = function(query) {
            query = query.trim().toLowerCase();
            if (!query) return;
            commitCurrentState();
            
            const modal = document.getElementById('smartSearchModal');
            const contentArea = document.getElementById('smartSearchResultContent');
            document.getElementById('searchQueryBadge').innerText = `'${query}'`;
            contentArea.innerHTML = '<div class="text-center py-8 opacity-50"><i class="fas fa-circle-notch fa-spin mr-2"></i>전체 DB 스캔 중...</div>';
            
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);

            let html = '';
            for (let pjtName in appDB) {
                if (pjtName.startsWith('_')) continue;
                const doc = parser.parseFromString(appDB[pjtName], 'text/html');
                const text = doc.body.innerText.toLowerCase();
                if (pjtName.toLowerCase().includes(query) || text.includes(query)) {
                    html += `
                        <div onclick="goToProject('${pjtName.replace(/'/g, "\\'")}')" class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 hover:border-brand-blue cursor-pointer transition-all group flex justify-between items-center">
                            <div><div class="text-lg font-bold text-white group-hover:text-brand-blue">${pjtName}</div><div class="text-xs text-slate-500">관련 담당자 또는 키워드 매칭됨</div></div>
                            <i class="fas fa-chevron-right text-slate-600 group-hover:text-brand-blue"></i>
                        </div>`;
                }
            }
            contentArea.innerHTML = html || '<div class="text-center py-10 opacity-40 italic">검색 결과가 없습니다.</div>';
        };

        window.goToProject = function(name) {
            closeSmartSearchModal();
            const links = document.querySelectorAll('.pjt-link');
            for (let link of links) { if (link.innerText === name) { link.click(); return; } }
            loadProject(name, null);
        };

        // 4. 시스템 제어 유틸리티
        function commitCurrentState() {
            const current = document.body.getAttribute('data-current-pjt');
            if (!current || current === 'DELETED') return;
            const area = document.getElementById('sync-area');
            area.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            area.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            area.querySelectorAll('select').forEach(el => {
                Array.from(el.options).forEach(opt => {
                    if (opt.value === el.value) opt.setAttribute('selected', 'selected');
                    else opt.removeAttribute('selected');
                });
            });
            appDB[current] = area.innerHTML;
        }

        async function saveDataToCloud() {
            const btn = document.getElementById('saveBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 저장 중..';
            commitCurrentState();
            
            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            updateTimes[document.body.getAttribute('data-current-pjt')] = timeStr;
            appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);

            try {
                await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(appDB) 
                });
                btn.innerHTML = '<i class="fas fa-check text-green-400"></i> 저장완료';
                btn.classList.replace('border-green-500', 'border-green-400');
            } catch (e) { alert("저장 중 오류가 발생했습니다."); }
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.replace('border-green-400', 'border-green-500');
            }, 2000);
        }

        function loadProject(name, el) {
            commitCurrentState();
            document.querySelectorAll('.pjt-link').forEach(l => {
                l.classList.replace('text-white', 'text-slate-400');
                l.classList.remove('font-semibold');
                l.className = l.className.replace('before:bg-brand-blue', 'before:bg-slate-600');
            });
            if (el) {
                el.classList.replace('text-slate-400', 'text-white');
                el.classList.add('font-semibold');
                el.className = el.className.replace('before:bg-slate-600', 'before:bg-brand-blue');
            }

            const area = document.getElementById('sync-area');
            area.style.opacity = '0.2';
            setTimeout(() => {
                document.body.setAttribute('data-current-pjt', name);
                document.getElementById('lastModText').innerText = `최종 수정: ${updateTimes[name] || '-'}`;
                if (appDB[name]) {
                    area.innerHTML = appDB[name];
                } else {
                    area.innerHTML = getNewPjtTemplate(name);
                }
                area.style.opacity = '1';
                document.querySelectorAll('textarea').forEach(ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; });
            }, 200);
        }

        function getNewPjtTemplate(name) {
            return `
                <div class="mb-8">
                    <select id="statusSelect" onchange="updateStatusColor(this)" class="w-48 text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-full px-2 py-1"><option value="진행 중">진행 중</option><option value="완료">완료</option><option value="이슈 발생">이슈 발생</option></select>
                    <input type="text" id="pjtTitle" value="${name}" class="text-3xl md:text-4xl font-extrabold text-white bg-transparent border-none w-full mt-4 h-12 px-0">
                    <div class="flex items-center text-brand-cyan mt-2"><i class="fas fa-bullseye mr-2"></i>Target: <input type="text" placeholder="벤더 등록 목표 입력.." class="text-slate-300 bg-transparent border-none w-full"></div>
                </div>
                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    <section class="glass-panel rounded-2xl p-5 shadow-2xl">
                        <h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2"><i class="fas fa-image text-brand-blue"></i> 현장 개요</h2>
                        <div class="w-full h-48 bg-slate-800 rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center cursor-pointer" onclick="document.getElementById('imageUpload').click()"><i class="fas fa-camera text-3xl mb-2"></i><span class="text-xs">사진 첨부</span><input type="file" id="imageUpload" class="hidden" onchange="previewFile(event)"></div>
                    </section>
                    <section class="xl:col-span-2 glass-panel rounded-2xl p-5 shadow-2xl relative">
                        <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold text-white"><i class="fas fa-users text-brand-cyan mr-2"></i>의사결정권자</h2><button onclick="addStakeholderTile()" class="text-xs bg-brand-cyan/20 px-3 py-1 rounded">추가</button></div>
                        <div id="stakeholder-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </section>
                    <section class="xl:col-span-3 bg-brand-red/10 border border-brand-red/50 rounded-xl p-5">
                        <h3 class="text-sm font-bold text-brand-red mb-4 flex items-center justify-between"><span>🚨 이슈 & 전략</span> <button onclick="getAIAdvice(this)" class="text-[10px] bg-brand-cyan/20 px-2 py-1 rounded border border-brand-cyan/50 shadow-lg"><i class="fas fa-magic"></i> AI 조언</button></h3>
                        <div class="space-y-4">
                            <textarea rows="2" class="text-sm text-white w-full bg-slate-900/50 p-3 rounded" placeholder="현재 막혀있는 이슈를 입력하세요.."></textarea>
                            <textarea rows="2" class="text-sm text-brand-cyan w-full bg-black/40 p-3 rounded border border-brand-cyan/20" placeholder="AI 조언 또는 돌파 전략.."></textarea>
                        </div>
                    </section>
                </div>`;
        }

        function renderSidebar() {
            const container = document.getElementById('pjtSubMenu');
            let order = [];
            try { order = JSON.parse(appDB['_CONFIG_ORDER_'] || '[]'); } catch(e) { order = Object.keys(appDB).filter(k => !k.startsWith('_')); }
            if(order.length === 0) order = ['삼성전자 평택 5공장', 'SK하이닉스 용인 클러스터'];

            let html = '';
            order.forEach(name => {
                const safeName = name.replace(/'/g, "\\'");
                html += `<div class="flex justify-between items-center group pjt-item-wrap">
                    <a href="#" onclick="loadProject('${safeName}', this); event.preventDefault();" class="pjt-link block text-sm text-slate-400 hover:text-white transition-colors relative before:content-[''] before:absolute before:-left-4 before:top-1.5 before:w-2 before:h-2 before:bg-slate-600 before:rounded-full w-full truncate pr-2">${name}</a>
                </div>`;
            });
            container.innerHTML = html + `<a href="#" onclick="addNewProject()" class="block text-xs text-brand-cyan mt-4 pt-3 border-t border-slate-700/50 hover:text-white transition-colors"><i class="fas fa-plus mr-1"></i> 신규 PJT 추가</a>`;
        }

        function addNewProject() {
            const pjtName = prompt("새로운 프로젝트 이름을 입력하세요:");
            if (pjtName) {
                appDB[pjtName] = "";
                let order = [];
                try { order = JSON.parse(appDB['_CONFIG_ORDER_'] || '[]'); } catch(e) {}
                order.push(pjtName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                renderSidebar();
                saveDataToCloud();
            }
        }

        function previewFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev) {
                const container = e.target.parentElement;
                container.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover rounded-xl shadow-lg">`;
            };
            reader.readAsDataURL(file);
        }

        function updateStatusColor(sel) {
            sel.className = "w-48 text-xs font-bold rounded-full px-2 py-1 cursor-pointer outline-none";
            if (sel.value.includes("완료")) sel.classList.add("bg-green-500/20", "text-green-400", "border-green-500/50");
            else if (sel.value.includes("진행")) sel.classList.add("bg-yellow-500/20", "text-yellow-400", "border-yellow-500/50");
            else sel.classList.add("bg-brand-red/20", "text-brand-red", "border-brand-red/50");
        }

        function togglePjtMenu() {
            document.getElementById('pjtSubMenu').classList.toggle('hidden');
            document.getElementById('pjtChevron').classList.toggle('rotate-180');
        }

        function closeSmartSearchModal() {
            document.getElementById('smartSearchModal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('smartSearchModal').classList.add('hidden'), 300);
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('detailModal').classList.add('hidden'), 300);
        }
        
        function addStakeholderTile() {
            const div = document.createElement('div');
            div.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 relative group';
            div.innerHTML = `<button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block"><i class="fas fa-times"></i></button><input type="text" placeholder="구분" class="text-xs font-bold text-brand-blue bg-transparent border-none p-0 w-full mb-2"><input type="text" placeholder="업체/성함" class="text-lg font-bold text-white bg-transparent border-none p-0 w-full mb-2"><textarea placeholder="성향 Insight" class="text-xs text-slate-400 bg-transparent border-none p-0 w-full" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>`;
            document.getElementById('stakeholder-container').appendChild(div);
        }
    </script>
</body>
</html>
