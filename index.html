<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 PJT 정보 공유 관리 시스템</title>
    
    <meta property="og:title" content="📊 주요 PJT 정보 공유 관리 시스템">
    <meta property="og:description" content="전력솔루션영업부문 핵심 PJT 실시간 현황 및 의사결정권자 매핑 시스템입니다.">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' }, brand: { blue: '#3b82f6', cyan: '#06b6d4', red: '#ef4444' } } }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        
        ::-webkit-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        ::-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-ms-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        
        .clickable-tile { cursor: pointer; transition: all 0.2s ease; }
        .clickable-tile:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-2px); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* 🔥 PDF 인쇄용 최적화 렌더링 🔥 */
        @media print {
            @page { size: A4 portrait; margin: 10mm 15mm; }
            #main-wrapper, #sidebar, #detailModal, #trashModal, #imageModal, #undoToast, #smartSearchModal { display: none !important; }
            #print-area { display: block !important; }
            body, html { 
                background: white !important; 
                color: black !important; 
                height: auto !important; 
                width: 100% !important;
                overflow: visible !important; 
                -webkit-print-color-adjust: exact !important; 
                print-color-adjust: exact !important;
            }
            a[href]:after { content: none !important; }
        }

        .stakeholder-tile { cursor: grab; }
        .stakeholder-tile:active { cursor: grabbing; }
        .stakeholder-tile.drag-over { border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" data-current-pjt="">

    <div id="main-wrapper" class="flex h-screen w-full overflow-hidden">
        
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 hidden md:flex flex-col shrink-0 z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <i class="fas fa-bolt text-brand-blue text-xl mr-3"></i>
                <span class="font-extrabold text-[15px] tracking-wide text-white">전력솔루션영업부문</span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto relative">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Main Menu</div>
                
                <!-- 🔥 직관적인 키워드 & 상태 필터 스마트 검색창 🔥 -->
                <div class="mb-4 relative no-print group">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs pointer-events-none group-focus-within:text-brand-cyan transition-colors"></i>
                    <input type="text" id="pjtSearch" oninput="filterSidebar(this.value)" onkeydown="if(event.key==='Enter') executeSmartSearch(this.value)" placeholder="PJT, 상태, 담당자 검색 ⏎" class="w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:border-brand-cyan transition-colors outline-none" title="검색어를 입력하고 Enter를 누르면 스마트 팝업이 열립니다.">
                </div>

                <nav class="space-y-1">
                    <div class="space-y-1">
                        <button onclick="togglePjtMenu()" class="w-full flex justify-between items-center px-3 py-2.5 bg-brand-blue/10 text-brand-blue rounded-lg font-bold transition-colors">
                            <div class="flex items-center"><i class="fas fa-chart-pie w-5 mr-2"></i> PJT 대시보드</div>
                            <i id="pjtChevron" class="fas fa-chevron-down text-xs transition-transform duration-200 transform rotate-180"></i>
                        </button>
                        <div id="pjtSubMenu" class="pl-9 pr-2 py-2 space-y-3">
                            <div id="loadingSidebar" class="text-slate-500 text-xs py-4 text-center"><i class="fas fa-spinner fa-spin mr-1"></i> DB 연결 중...</div>
                        </div>
                    </div>
                </nav>
            </div>
        </aside>

        <main id="scroll-main" class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-4 lg:px-6 shrink-0 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-slate-300 hover:text-white mr-4" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="font-bold text-lg text-white hidden sm:block">주요 PJT 정보 공유 관리 시스템</h1>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div id="lastModifiedTime" class="hidden sm:flex items-center text-[11px] font-medium text-slate-400 mr-2 tracking-wide no-print">
                        <i class="far fa-clock mr-1.5"></i><span id="lastModText">최종 수정: -</span>
                    </div>

                    <button id="saveBtn" onclick="saveDataToCloud()" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white text-[13px] w-24 py-2 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow-lg transition-all hover:-translate-y-0.5 border border-green-500" title="단축키: Ctrl + S">
                        <i class="fas fa-save text-base"></i> <span class="hidden sm:inline">저장</span>
                    </button>
                    <button onclick="executePrint()" class="bg-slate-700 hover:bg-slate-600 text-white text-[13px] w-24 py-2 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow-lg transition-all hover:-translate-y-0.5 border border-slate-500">
                        <i class="fas fa-print text-base"></i> <span class="hidden sm:inline">출력</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-850 relative">
                <div class="max-w-7xl mx-auto">
                    <div id="sync-area" class="transition-opacity duration-300 opacity-30">
                        <!-- 동적으로 로드될 영역 -->
                    </div> 
                </div>
            </div>
        </main>
    </div>

    <!-- 🔥 인쇄 시 나타나는 보고서 폼 (화면엔 숨김 처리됨) 🔥 -->
    <div id="print-area" class="hidden print:block w-full min-h-screen bg-white text-black font-sans">
    </div>

    <!-- 실행 취소 팝업 -->
    <div id="undoToast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 bg-slate-800/95 backdrop-blur border border-slate-600 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-4 z-[100] transition-all duration-300 translate-y-24 opacity-0 pointer-events-none">
        <i class="fas fa-info-circle text-brand-blue"></i>
        <span class="text-sm font-medium">항목이 삭제되었습니다.</span>
        <button onclick="undoDelete()" class="text-brand-cyan text-sm font-bold hover:text-brand-blue transition-colors focus:outline-none ml-2 pointer-events-auto cursor-pointer">실행 취소</button>
        <button onclick="closeUndoToast()" class="text-slate-400 hover:text-white ml-2 pointer-events-auto cursor-pointer"><i class="fas fa-times"></i></button>
    </div>

    <!-- 휴지통 모달 -->
    <div id="trashModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div id="trashModalInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-11/12 max-w-lg shadow-2xl transform scale-95 transition-transform duration-300 relative">
            <button onclick="closeTrashModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 hover:bg-slate-600 rounded-full w-8 h-8 flex items-center justify-center"><i class="fas fa-times text-lg"></i></button>
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-4">
                <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center"><i class="fas fa-trash-alt text-slate-400 text-xl"></i></div>
                <h3 class="text-xl font-bold text-white">휴지통 (삭제된 항목 복구)</h3>
            </div>
            <div id="trashContent" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
        </div>
    </div>

    <!-- 상세정보 모달 -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div id="modalInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 md:p-8 w-11/12 max-w-2xl shadow-2xl transform scale-95 transition-transform duration-300 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 hover:bg-slate-600 rounded-full w-8 h-8 flex items-center justify-center"><i class="fas fa-times text-lg"></i></button>
            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-4">
                <div class="w-10 h-10 rounded-full bg-brand-blue/20 flex items-center justify-center"><i class="fas fa-info-circle text-brand-blue text-xl"></i></div>
                <h3 id="modalTitle" class="text-2xl font-bold text-white">상세 정보</h3>
            </div>
            <div id="modalContent" class="text-slate-200 text-sm leading-relaxed overflow-y-auto max-h-[60vh] pr-2"></div>
            <div class="mt-8 text-right"><button onclick="closeModal()" class="bg-slate-700 hover:bg-slate-600 text-white px-6 py-2 rounded-lg font-bold transition-colors">닫기</button></div>
        </div>
    </div>
    
    <!-- 사진 줌 모달 -->
    <div id="imageModal" class="fixed inset-0 bg-black/95 hidden z-[60] flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeImageModal()">
        <button onclick="closeImageModal()" class="absolute top-6 right-6 text-white/70 hover:text-white transition-colors bg-white/10 hover:bg-white/20 rounded-full w-10 h-10 flex items-center justify-center z-10"><i class="fas fa-times text-xl"></i></button>
        <img id="enlargedImage" src="" alt="확대된 조감도" class="max-w-[95vw] max-h-[90vh] object-contain rounded-lg shadow-2xl transform scale-95 transition-transform duration-300" onclick="event.stopPropagation()">
    </div>

    <!-- 🔥 스마트 검색 결과 모달 (팝업창) 🔥 -->
    <div id="smartSearchModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeSmartSearchModal()">
        <div id="smartSearchInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-11/12 max-w-3xl shadow-2xl transform scale-95 transition-transform duration-300 relative flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <button onclick="closeSmartSearchModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 hover:bg-slate-600 rounded-full w-8 h-8 flex items-center justify-center z-10"><i class="fas fa-times text-lg"></i></button>
            <div class="flex items-center gap-3 mb-4 border-b border-slate-700 pb-4 shrink-0">
                <div class="w-10 h-10 rounded-full bg-brand-cyan/20 flex items-center justify-center"><i class="fas fa-search text-brand-cyan text-xl"></i></div>
                <h3 class="text-xl font-bold text-white">스마트 검색 결과</h3>
                <span id="searchQueryBadge" class="ml-2 bg-slate-700/50 border border-slate-600 text-brand-cyan text-xs px-3 py-1 rounded-full font-bold"></span>
            </div>
            <!-- 검색 결과 리스트 영역 -->
            <div id="smartSearchResultContent" class="overflow-y-auto pr-2 space-y-6 flex-1 pb-4">
                <!-- 결과 동적 렌더링 -->
            </div>
        </div>
    </div>

    <!-- 핵심 로직 스크립트 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        const apiKey = ""; // 실행 환경에서 런타임에 삽입됩니다.
        let appDB = {};
        let updateTimes = {}; 
        
        let deletedNodeInfo = null;
        let toastTimeout = null;

        function getNewProjectTemplate(pjtName) {
            return `
                <div class="mb-8 flex flex-col md:flex-row justify-between items-start">
                    <div class="w-full">
                        <div class="flex items-center gap-3 mb-2">
                            <select id="statusSelect" onchange="updateStatusColor(this)" class="w-48 text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-full px-2 py-1 cursor-pointer transition-colors outline-none">
                                <option value="완료" class="bg-slate-800 text-white">완료</option>
                                <option value="진행 중" selected class="bg-slate-800 text-white">진행 중</option>
                                <option value="주요 이슈" class="bg-slate-800 text-white">주요 이슈</option>
                            </select>
                        </div>
                        <input type="text" id="pjtTitle" value="${pjtName}" placeholder="프로젝트 이름을 입력하세요" onchange="renameFromTitle(this)" onkeydown="if(event.key==='Enter') this.blur();" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight bg-transparent border-none w-full mb-2 h-12 px-0 hover:bg-white/5 transition-colors cursor-text rounded-md" title="클릭하여 프로젝트 이름 변경">
                        <div class="flex items-center text-brand-cyan w-full mt-2">
                            <i class="fas fa-bullseye mr-2 shrink-0 text-lg"></i>
                            <span class="text-brand-cyan text-base font-bold w-16 md:w-20 shrink-0">Target:</span>
                            <input type="text" id="val-target" value="" placeholder="예: 가온 GP커넥터 + ACF 케이블 통합 솔루션 벤더 등록" class="text-slate-300 text-base md:text-lg w-full border-none bg-transparent hover:bg-white/5 transition-colors px-2 py-1 rounded-md">
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                    <div class="flex flex-col gap-6">
                        <section class="glass-panel rounded-2xl p-5 shadow-2xl relative">
                            <div class="flex justify-between items-center mb-4 gap-4">
                                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                    <i class="fas fa-image text-brand-blue shrink-0"></i>
                                    <span class="text-lg font-bold text-slate-200 w-full px-2">현장 조감도 및 개요</span>
                                </h2>
                                <button onclick="addOverviewTile()" class="shrink-0 text-[11px] bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-2 py-1 rounded border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            
                            <div class="w-full h-48 bg-slate-800 rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center relative overflow-hidden group hover:border-brand-blue transition-colors">
                                <div id="uploadPlaceholder" class="flex flex-col items-center justify-center z-10 p-4 w-full h-full cursor-pointer bg-slate-800/80 hover:bg-slate-800/90 transition-all" onclick="document.getElementById('imageUpload').click()">
                                    <i class="fas fa-camera text-3xl text-slate-400 mb-2 group-hover:text-brand-blue transition-colors"></i>
                                    <span class="text-xs text-slate-300 text-center">클릭하여 사진 첨부<br>(로컬 파일 첨부)</span>
                                </div>
                                <img id="previewImage" src="" alt="현장 조감도" class="absolute inset-0 w-full h-full object-cover hidden z-0 cursor-pointer" onclick="openImageModal()">
                                <button id="changeImgBtn" onclick="document.getElementById('imageUpload').click()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-brand-blue text-white px-2 py-1 rounded text-[11px] font-bold hidden z-20 transition-colors shadow-lg border border-slate-600">
                                    <i class="fas fa-sync-alt mr-1"></i> 변경
                                </button>
                                <div id="zoomHintIcon" class="absolute bottom-2 right-2 bg-black/60 text-white p-2 rounded-lg hidden z-10 pointer-events-none">
                                    <i class="fas fa-search-plus"></i>
                                </div>
                                <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewFile(event)">
                            </div>

                            <div id="overview-container" class="mt-4 grid grid-cols-2 gap-3">
                                <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                    <input type="text" id="title-investment" value="💰 총 투자 규모" class="text-[11px] font-semibold text-brand-cyan mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1 cursor-text">
                                    <input type="text" value="" placeholder="예: 15조 원" class="text-lg font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1">
                                    <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                </div>
                                <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                    <input type="text" id="title-timeline" value="📅 진행 기간" class="text-[11px] font-semibold text-purple-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1 cursor-text">
                                    <input type="text" value="" placeholder="예: 2025.Q3 ~ 2027.Q4" class="text-[13px] font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full mt-1 hover:bg-white/5 rounded-md px-1">
                                    <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                </div>
                                <div onclick="openTileModal(this, event)" class="col-span-2 clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                    <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                    <input type="text" id="title-target-zone" value="🎯 공사 현황" placeholder="항목명 (예: 🎯 공사 현황)" class="text-[11px] font-semibold text-blue-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1 cursor-text">
                                    <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 클린룸 상층부 및 서브스테이션 배관/배선망 구축 구간" class="text-sm text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full resize-none overflow-hidden hover:bg-white/5 rounded-md px-1"></textarea>
                                    <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                </div>
                            </div>
                        </section>

                        <section class="glass-panel rounded-2xl p-5 shadow-2xl">
                            <div class="flex justify-between items-center mb-4 gap-4">
                                <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                    <i class="fas fa-chart-pie text-brand-blue shrink-0"></i>
                                    <span class="text-lg font-bold text-slate-200 w-full px-2">목표 매출</span>
                                </h2>
                                <button onclick="addTamTile()" class="shrink-0 text-[11px] bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-2 py-1 rounded border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                    <i class="fas fa-plus"></i> 추가
                                </button>
                            </div>
                            <div id="tam-container" class="grid grid-cols-2 gap-4">
                                <!-- 사용자가 추가하도록 유도 -->
                            </div>
                        </section>

        // 🔥 전체 DB 추출 (AI 분석 및 스마트 검색용) 🔥
        function extractDatabaseForAI() {
            let aiReadyDB = [];
            for (const pjtName in appDB) {
                if (pjtName.startsWith('_') || pjtName === 'error') continue;
                
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = appDB[pjtName];

                let status = "알 수 없음";
                const statusSelect = tempDiv.querySelector('#statusSelect');
                if (statusSelect) {
                    const selected = statusSelect.querySelector('option[selected]');
                    status = selected ? selected.value : statusSelect.value;
                }

                let stakeholders = [];
                tempDiv.querySelectorAll('.stakeholder-tile').forEach(tile => {
                    const inputs = tile.querySelectorAll('input');
                    if (inputs.length >= 3) {
                        const type = inputs[0].value || inputs[0].placeholder || "";
                        const company = inputs[1].value || inputs[1].placeholder || "";
                        const person = inputs[2].value || inputs[2].placeholder || "";
                        stakeholders.push(`${type} - ${company} (${person})`);
                    }
                });
                
                let riskContent = "";
                let strategyContent = "";
                const riskSection = tempDiv.querySelector('.bg-brand-red\\/10');
                if(riskSection) {
                    const textareas = riskSection.querySelectorAll('textarea');
                    if(textareas.length >= 2) {
                        riskContent = textareas[0].value || "";
                        strategyContent = textareas[1].value || "";
                    }
                }

                aiReadyDB.push({
                    "프로젝트명": pjtName,
                    "상태": status,
                    "이해관계자": stakeholders,
                    "과거_이슈": riskContent,
                    "과거_전략": strategyContent
                });
            }
            return aiReadyDB;
        }

        // 🔥 Gemini API 재시도 및 안전 통신 로직 🔥
        async function fetchGeminiWithRetry(payload, maxRetries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const delays = [1000, 2000, 4000, 8000, 16000];

            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        const errText = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errText}`);
                    }
                    return await response.json();
                } catch (error) {
                    if (i === maxRetries - 1) throw error;
                    await new Promise(res => setTimeout(res, delays[i]));
                }
            }
        }

        // 🔥 AI 조언 받기 (에러 수정 및 구조 보강 완료) 🔥
        window.getAIAdvice = async function(btn) {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (!currentPjt) return;

            const riskSection = btn.closest('section');
            const textareas = riskSection.querySelectorAll('textarea');
            if (textareas.length < 2) return;
            
            const riskText = textareas[0].value.trim();
            const strategyTextarea = textareas[1];

            if (!riskText) {
                alert("현재 막혀있는 이슈(Risk)를 먼저 입력해주세요. 그래야 AI가 최적의 조언을 해줄 수 있습니다!");
                return;
            }

            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 분석 중...';
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                const dbJson = extractDatabaseForAI();
                
                const systemPrompt = `너는 B2B 영업 부서의 최고 전략 책임자(CSO)이자 AI 비서야. 
현재 프로젝트명: '${currentPjt}'
현재 발생한 이슈(Risk):
"${riskText}"

제공된 전체 프로젝트 데이터베이스(JSON)를 분석해서, 다른 프로젝트의 성공 사례, 관련 부서 협업 포인트, 또는 특정 담당자의 성향 등을 종합적으로 활용한 '돌파 전략(Strategy)'을 제시해.
응답은 다른 인사말이나 부연 설명 없이, 바로 실무에 적용 가능한 핵심 전략 1~2문장만 평문으로 반환해.`;

                // 시스템 프롬프트 규격 에러 방지를 위해 contents 내부에 안전하게 병합
                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: `${systemPrompt}\n\n[데이터베이스]\n${JSON.stringify(dbJson)}` }]
                    }]
                };

                const result = await fetchGeminiWithRetry(payload);
                
                if(result.candidates && result.candidates[0].content && result.candidates[0].content.parts[0].text) {
                    const advice = result.candidates[0].content.parts[0].text.trim();
                    strategyTextarea.value = advice;
                    strategyTextarea.style.height = 'auto';
                    strategyTextarea.style.height = strategyTextarea.scrollHeight + 'px';
                    commitCurrentState(); // AI 조언 즉시 내부 DB 임시 저장
                } else {
                    throw new Error("AI 응답 형식이 올바르지 않습니다.");
                }
            } catch(e) {
                console.error("AI 조언 에러 상세:", e);
                // API 키 누락이나 네트워크 에러 등 구체적 원인 알림
                alert("AI 조언을 생성하는 중 오류가 발생했습니다.\n상세: " + e.message);
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        };

        // 🔥 스마트 팝업 검색 (프로젝트명, 상태, 담당자 매칭) 🔥
        window.executeSmartSearch = function(query) {
            query = query.trim().toLowerCase();
            if (!query) return;

            document.getElementById('searchQueryBadge').innerText = `'${query}'`;
            const contentArea = document.getElementById('smartSearchResultContent');
            contentArea.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i><p>프로젝트 및 담당자 DB를 스캔 중입니다...</p></div>';

            const modal = document.getElementById('smartSearchModal');
            const inner = document.getElementById('smartSearchInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); inner.classList.remove('scale-95'); }, 10);

            setTimeout(() => {
                let matchedProjects = [];
                let matchedStakeholders = [];

                for (const pjtName in appDB) {
                    if (pjtName.startsWith('_') || pjtName === 'error') continue;

                    let pjtAdded = false;
                    const htmlString = appDB[pjtName];
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = htmlString;

                    // 1. 상태 (Status) 추출
                    let statusText = "";
                    const selectEl = tempDiv.querySelector('#statusSelect');
                    if (selectEl) {
                        const selectedOpt = selectEl.querySelector('option[selected]');
                        if(selectedOpt) statusText = selectedOpt.value.toLowerCase();
                        else statusText = selectEl.value.toLowerCase();
                    }

                    // 프로젝트 이름 또는 상태(진행 중, 이슈 등) 매칭
                    if (pjtName.toLowerCase().includes(query) || statusText.includes(query)) {
                        let reason = pjtName.toLowerCase().includes(query) ? "프로젝트명 매칭" : `상태 매칭 (${statusText.replace(/🟡|🟢|🔴/g,'').trim()})`;
                        matchedProjects.push({ name: pjtName, reason: reason });
                        pjtAdded = true;
                    }

                    // 2. 이해관계자 (담당자, 업체) 매칭
                    const shTiles = tempDiv.querySelectorAll('.stakeholder-tile');
                    shTiles.forEach(tile => {
                        const inputs = tile.querySelectorAll('input[type="text"]');
                        if(inputs.length >= 3) {
                            const type = inputs[0].value || inputs[0].placeholder || "";
                            const company = inputs[1].value || inputs[1].placeholder || "";
                            const person = inputs[2].value || inputs[2].placeholder || "";
                            const deptSelect = tile.querySelector('select');
                            const dept = deptSelect ? deptSelect.value : "";
                            
                            const insightTextarea = tile.querySelector('textarea');
                            const insight = insightTextarea ? insightTextarea.value : "";

                            const combinedText = `${type} ${company} ${person} ${dept} ${insight}`.toLowerCase();

                            if(combinedText.includes(query)) {
                                matchedStakeholders.push({
                                    pjtName: pjtName,
                                    type: type,
                                    company: company,
                                    person: person,
                                    dept: dept === '없음' || dept === '담당 부서 선택' ? '-' : dept
                                });
                                // 담당자가 속한 프로젝트도 프로젝트 리스트에 추가 (중복 방지)
                                if(!pjtAdded) {
                                    matchedProjects.push({ name: pjtName, reason: "내부 담당자/업체 매칭" });
                                    pjtAdded = true;
                                }
                            }
                        }
                    });
                }

                renderSearchResults(matchedProjects, matchedStakeholders);
            }, 300); // 로딩 효과를 위한 딜레이
        };

        // 스마트 검색 결과 렌더링

                if (link.innerText === pjtName) {
                    loadProject(pjtName, link);

                    break;

            if(!found) loadProject(pjtName, null); // 사이드바 목록에 안보일 시 강제 로드

                    }
                }

                if(text.includes(query) || statusText.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
