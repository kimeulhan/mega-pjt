<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 PJT 정보 공유 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' }, brand: { blue: '#3b82f6', cyan: '#06b6d4', red: '#ef4444' } } } }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        .clickable-tile { cursor: pointer; transition: all 0.2s ease; }
        .clickable-tile:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-2px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        @media print {
            #main-wrapper, #sidebar, #detailModal, #trashModal, #imageModal, #undoToast, #smartSearchModal { display: none !important; }
            #print-area { display: block !important; }
            body, html { background: white !important; color: black !important; height: auto !important; overflow: visible !important; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" data-current-pjt="">

    <div id="main-wrapper" class="flex h-screen w-full overflow-hidden">
        <!-- 사이드바 -->
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 hidden md:flex flex-col shrink-0 z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <i class="fas fa-bolt text-brand-blue text-xl mr-3"></i>
                <span class="font-extrabold text-[15px] tracking-wide text-white">전력솔루션영업부문</span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto relative">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Main Menu</div>
                <!-- 스마트 검색창 -->
                <div class="mb-4 relative no-print group">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs transition-colors group-focus-within:text-brand-cyan"></i>
                    <input type="text" id="pjtSearch" oninput="filterSidebar(this.value)" onkeydown="if(event.key==='Enter') executeSmartSearch(this.value)" placeholder="PJT, 상태, 담당자 검색 ⏎" class="w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:border-brand-cyan outline-none">
                </div>
                <nav class="space-y-1">
                    <button onclick="togglePjtMenu()" class="w-full flex justify-between items-center px-3 py-2.5 bg-brand-blue/10 text-brand-blue rounded-lg font-bold">
                        <div class="flex items-center"><i class="fas fa-chart-pie w-5 mr-2"></i> PJT 대시보드</div>
                        <i id="pjtChevron" class="fas fa-chevron-down text-xs transition-transform duration-200 transform rotate-180"></i>
                    </button>
                    <div id="pjtSubMenu" class="pl-9 pr-2 py-2 space-y-3">
                        <div id="loadingSidebar" class="text-slate-500 text-xs py-4 text-center"><i class="fas fa-spinner fa-spin"></i> DB 연결 중...</div>
                    </div>
                </nav>
            </div>
        </aside>

        <!-- 메인 컨텐츠 -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden">
            <header class="h-16 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-4 lg:px-6 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-slate-300 mr-4" onclick="document.getElementById('sidebar').classList.toggle('hidden')"><i class="fas fa-bars text-xl"></i></button>
                    <h1 class="font-bold text-lg text-white">PJT 정보 공유 시스템</h1>
                </div>
                <div class="flex gap-2 items-center">
                    <div id="lastModifiedTime" class="hidden sm:flex text-[11px] text-slate-400 mr-2"><i class="far fa-clock mr-1.5 mt-0.5"></i><span id="lastModText">최종 수정: -</span></div>
                    <button id="saveBtn" onclick="saveDataToCloud()" class="bg-gradient-to-r from-green-600 to-emerald-600 text-white text-sm px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg hover:-translate-y-0.5 transition-all"><i class="fas fa-save"></i> 저장</button>
                    <button onclick="executePrint()" class="bg-slate-700 text-white text-sm px-4 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg hover:-translate-y-0.5 transition-all"><i class="fas fa-print"></i> 출력</button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-850 relative">
                <div class="max-w-7xl mx-auto" id="sync-area" class="opacity-30 transition-opacity duration-300">
                    <!-- 데이터 동적 로드 영역 -->
                </div>
            </div>
        </main>
    </div>

    <!-- 각종 모달 (스마트검색, 상세정보, 이미지줌 등) -->
    <div id="smartSearchModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center backdrop-blur-sm opacity-0 transition-all duration-300" onclick="closeSmartSearchModal()">
        <div class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-11/12 max-w-3xl shadow-2xl transform scale-95 relative flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <div class="flex items-center gap-3 mb-4 border-b border-slate-700 pb-4 shrink-0">
                <div class="w-10 h-10 rounded-full bg-brand-cyan/20 flex items-center justify-center"><i class="fas fa-search text-brand-cyan text-xl"></i></div>
                <h3 class="text-xl font-bold text-white">검색 결과</h3>
                <span id="searchQueryBadge" class="ml-2 bg-slate-700/50 text-brand-cyan text-xs px-3 py-1 rounded-full"></span>
            </div>
            <div id="smartSearchResultContent" class="overflow-y-auto space-y-6 flex-1"></div>
        </div>
    </div>

    <div id="detailModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center backdrop-blur-sm opacity-0 transition-all duration-300" onclick="closeModal()">
        <div id="modalInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 max-w-2xl w-11/12 shadow-2xl transform scale-95" onclick="event.stopPropagation()">
            <h3 id="modalTitle" class="text-2xl font-bold text-white mb-4 border-b border-slate-700 pb-2">상세 정보</h3>
            <div id="modalContent" class="text-slate-200 text-sm overflow-y-auto max-h-[60vh]"></div>
            <div class="mt-6 text-right"><button onclick="closeModal()" class="bg-slate-700 text-white px-6 py-2 rounded-lg font-bold hover:bg-slate-600">닫기</button></div>
        </div>
    </div>

    <div id="print-area" class="hidden print:block w-full"></div>

    <!-- 🔥 핵심 비즈니스 로직 스크립트 🔥 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        
        // 🔒 API 키 유출 방지를 위한 '가온전선 전용' 암호화 처리 로직
        // 부서 암호(gaon)를 알아야만 이 키가 정상적으로 풀립니다.
        const _SECRET_KEY_ = "c6hQxtkc0VG9nBMNUlDWa4x1IWSYcJAYsazIA"; // 암호화된 API 키
        const _DEPT_PW_ = "gaon"; // 부서 공용 비밀번호 (필요시 변경 가능)

        let appDB = {};
        let updateTimes = {};
        const parser = new DOMParser();

        // 1. 초기 로드 및 데이터 자가 치유
        window.onload = async function() {
            const btn = document.getElementById('saveBtn');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 연결중..';

            try {
                const res = await fetch(WEB_APP_URL + "?t=" + Date.now());
                const data = await res.json();
                if(data && !data.error) {
                    appDB = data;
                    if(appDB['_UPDATED_TIMES_']) updateTimes = JSON.parse(appDB['_UPDATED_TIMES_']);
                }
            } catch(e) { console.error(e); }

            renderSidebar();
            const first = document.querySelector('.pjt-link');
            if(first) first.click();
            else loadProject('신규 프로젝트', null);

            document.getElementById('sync-area').style.opacity = '1';
            btn.innerHTML = originalContent;
        };

        // 2. 부서 공용 AI 조언 로직 (암호화 해독 포함)
        window.getAIAdvice = async function(btn) {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            const riskText = btn.closest('section').querySelectorAll('textarea')[0].value.trim();
            const targetArea = btn.closest('section').querySelectorAll('textarea')[1];

            if(!riskText) { alert("이슈(Risk)를 먼저 입력해주세요!"); return; }

            // 팀원 공유용 암호 확인 과정
            let key = localStorage.getItem('_team_ai_key_');
            if(!key) {
                const inputPw = prompt("부서 공용 비밀번호를 입력하세요 (전달받은 암호):");
                if(inputPw === _DEPT_PW_) {
                    // 키를 복구함 (거꾸로 뒤집기 로직)
                    key = _SECRET_KEY_.split('').reverse().join('');
                    localStorage.setItem('_team_ai_key_', key);
                } else {
                    alert("비밀번호가 틀렸습니다. 파트장님께 문의하세요.");
                    return;
                }
            }

            const originalBtn = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 분석중..';
            btn.disabled = true;

            try {
                // 부하를 줄이기 위해 데이터 압축 추출
                const dbSummary = [];
                for(let k in appDB) { if(!k.startsWith('_')) dbSummary.push(k); }

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: `넌 B2B 전략가야. 프로젝트 '${currentPjt}'의 이슈 '${riskText}'를 해결할 1~2문장의 돌파 전략을 제시해. 사내 DB 참고용: ${dbSummary.join(',')}` }] }],
                        generationConfig: { temperature: 0.7, maxOutputTokens: 200 }
                    })
                });

                const resData = await response.json();
                const advice = resData.candidates?.[0]?.content?.parts?.[0]?.text;
                if(advice) {
                    targetArea.value = advice.trim();
                    targetArea.style.height = 'auto';
                    targetArea.style.height = targetArea.scrollHeight + 'px';
                }
            } catch(e) {
                alert("AI 통신 오류가 발생했습니다. 암호가 만료되었을 수 있습니다.");
                localStorage.removeItem('_team_ai_key_');
            } finally {
                btn.innerHTML = originalBtn;
                btn.disabled = false;
            }
        };

        // 3. 초고속 사이드바 필터링 (정규식 최적화)
        window.filterSidebar = function(query) {
            query = query.toLowerCase().trim();
            const items = document.querySelectorAll('.pjt-item-wrap');
            items.forEach(item => {
                const name = item.querySelector('.pjt-link').innerText.toLowerCase();
                const content = appDB[item.querySelector('.pjt-link').innerText] || "";
                // 정규식으로 상태값만 빠르게 추출하여 검색 (DOM 파싱 안함)
                const statusMatch = content.match(/<option[^>]*selected[^>]*>([^<]+)<\/option>/i);
                const status = statusMatch ? statusMatch[1].toLowerCase() : "";

                if(name.includes(query) || status.includes(query)) item.style.display = 'flex';
                else item.style.display = 'none';
            });
        };

        // 4. 스마트 검색 팝업
        window.executeSmartSearch = function(query) {
            query = query.trim().toLowerCase();
            if(!query) return;
            commitCurrentState();

            document.getElementById('searchQueryBadge').innerText = `'${query}'`;
            const contentArea = document.getElementById('smartSearchResultContent');
            contentArea.innerHTML = '<div class="text-center py-8 opacity-50"><i class="fas fa-circle-notch fa-spin mr-2"></i>검색 중...</div>';
            
            const modal = document.getElementById('smartSearchModal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('opacity-100'), 10);

            let html = '';
            for(let pjtName in appDB) {
                if(pjtName.startsWith('_')) continue;
                const doc = parser.parseFromString(appDB[pjtName], 'text/html');
                const textContent = doc.body.innerText.toLowerCase();
                
                if(pjtName.toLowerCase().includes(query) || textContent.includes(query)) {
                    html += `
                        <div onclick="goToProject('${pjtName.replace(/'/g, "\\'")}')" class="bg-slate-900/50 p-4 rounded-xl border border-slate-700 hover:border-brand-blue cursor-pointer transition-all group flex justify-between items-center">
                            <div>
                                <div class="text-lg font-bold text-white mb-1 group-hover:text-brand-blue">${pjtName}</div>
                                <div class="text-xs text-slate-500">데이터베이스 내 검색어 일치</div>
                            </div>
                            <i class="fas fa-chevron-right text-slate-600 group-hover:text-brand-blue"></i>
                        </div>`;
                }
            }
            contentArea.innerHTML = html || '<div class="text-center py-10 opacity-50">결과가 없습니다.</div>';
        };

        window.goToProject = function(name) {
            closeSmartSearchModal();
            const links = document.querySelectorAll('.pjt-link');
            for(let link of links) { if(link.innerText === name) { link.click(); return; } }
            loadProject(name, null);
        };

        // 5. 기본 UI 헬퍼
        function togglePjtMenu() {
            document.getElementById('pjtSubMenu').classList.toggle('hidden');
            document.getElementById('pjtChevron').classList.toggle('rotate-180');
        }

        function closeSmartSearchModal() {
            document.getElementById('smartSearchModal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('smartSearchModal').classList.add('hidden'), 300);
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('opacity-100');
            setTimeout(() => document.getElementById('detailModal').classList.add('hidden'), 300);
        }

        function commitCurrentState() {
            const current = document.body.getAttribute('data-current-pjt');
            if(!current || current === 'DELETED') return;
            const area = document.getElementById('sync-area');
            // 입력값을 HTML에 박제
            area.querySelectorAll('input').forEach(i => i.setAttribute('value', i.value));
            area.querySelectorAll('textarea').forEach(t => t.textContent = t.value);
            area.querySelectorAll('select').forEach(s => {
                Array.from(s.options).forEach(o => {
                    if(o.value === s.value) o.setAttribute('selected', 'selected');
                    else o.removeAttribute('selected');
                });
            });
            appDB[current] = area.innerHTML;
        }

        async function saveDataToCloud() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 저장 중';
            commitCurrentState();
            
            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            updateTimes[document.body.getAttribute('data-current-pjt')] = timeStr;
            appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);

            try {
                await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(appDB) });
                btn.innerHTML = '<i class="fas fa-check text-green-400"></i> 저장완료';
            } catch(e) { alert("저장 실패"); }
            setTimeout(() => btn.innerHTML = '<i class="fas fa-save"></i> 저장', 2000);
        }

        function renderSidebar() {
            const container = document.getElementById('pjtSubMenu');
            let order = [];
            try { order = JSON.parse(appDB['_CONFIG_ORDER_'] || '[]'); } catch(e) { order = Object.keys(appDB).filter(k => !k.startsWith('_')); }
            if(order.length === 0) order = ['삼성전자 평택 5공장', 'SK하이닉스 용인 클러스터'];

            let html = '';
            order.forEach(name => {
                html += `<div class="flex justify-between items-center group pjt-item-wrap">
                    <a href="#" onclick="loadProject('${name.replace(/'/g, "\\'")}', this); event.preventDefault();" class="pjt-link block text-sm text-slate-400 hover:text-white transition-colors relative before:content-[''] before:absolute before:-left-4 before:top-1.5 before:w-2 before:h-2 before:bg-slate-600 before:rounded-full w-full truncate pr-2">${name}</a>
                </div>`;
            });
            container.innerHTML = html + `<a href="#" onclick="addNewProject()" class="block text-xs text-brand-cyan mt-4 pt-3 border-t border-slate-700/50"><i class="fas fa-plus mr-1"></i> 신규 PJT 추가</a>`;
        }

        function loadProject(name, el) {
            commitCurrentState();
            document.querySelectorAll('.pjt-link').forEach(l => {
                l.classList.replace('text-white', 'text-slate-400');
                l.classList.remove('font-semibold');
            });
            if(el) {
                el.classList.replace('text-slate-400', 'text-white');
                el.classList.add('font-semibold');
            }

            const area = document.getElementById('sync-area');
            area.style.opacity = '0.3';
            setTimeout(() => {
                document.body.setAttribute('data-current-pjt', name);
                document.getElementById('lastModText').innerText = `최종 수정: ${updateTimes[name] || '-'}`;
                if(appDB[name]) {
                    area.innerHTML = appDB[name];
                } else {
                    area.innerHTML = `
                        <div class="mb-8">
                            <select id="statusSelect" onchange="updateStatusColor(this)" class="w-48 text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-full px-2 py-1"><option value="진행 중">진행 중</option><option value="완료">완료</option><option value="이슈 발생">이슈 발생</option></select>
                            <input type="text" id="pjtTitle" value="${name}" class="text-3xl md:text-4xl font-extrabold text-white bg-transparent border-none w-full mt-4 h-12 px-0">
                            <div class="flex items-center text-brand-cyan mt-2"><i class="fas fa-bullseye mr-2"></i>Target: <input type="text" placeholder="목표 입력.." class="text-slate-300 bg-transparent border-none w-full"></div>
                        </div>
                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            <section class="glass-panel rounded-2xl p-5 shadow-2xl"><h2 class="text-lg font-bold text-slate-200 mb-4 flex items-center gap-2"><i class="fas fa-image text-brand-blue"></i> 현장 개요</h2><div class="w-full h-48 bg-slate-800 rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center cursor-pointer" onclick="document.getElementById('imageUpload').click()"><i class="fas fa-camera text-3xl mb-2"></i><span class="text-xs">사진 첨부</span><input type="file" id="imageUpload" class="hidden" onchange="previewFile(event)"></div></section>
                            <section class="xl:col-span-2 glass-panel rounded-2xl p-5 shadow-2xl relative">
                                <div class="flex justify-between items-center mb-4"><h2 class="text-lg font-bold text-white"><i class="fas fa-users text-brand-cyan mr-2"></i>이해관계자</h2><button onclick="addStakeholderTile()" class="text-xs bg-brand-cyan/20 px-3 py-1 rounded">추가</button></div>
                                <div id="stakeholder-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                            </section>
                            <section class="xl:col-span-3 bg-brand-red/10 border border-brand-red/50 rounded-xl p-5">
                                <h3 class="text-sm font-bold text-brand-red mb-4 flex items-center justify-between"><span>🚨 이슈 & 전략</span> <button onclick="getAIAdvice(this)" class="text-[10px] bg-brand-cyan/20 px-2 py-1 rounded border border-brand-cyan/50"><i class="fas fa-magic"></i> AI 조언</button></h3>
                                <div class="space-y-4">
                                    <textarea rows="2" class="text-sm text-white w-full bg-slate-900/50 p-3" placeholder="현재 이슈를 입력하세요.."></textarea>
                                    <textarea rows="2" class="text-sm text-brand-cyan w-full bg-black/40 p-3" placeholder="AI 조언 또는 전략 입력.."></textarea>
                                </div>
                            </section>
                        </div>`;
                }
                area.style.opacity = '1';
            }, 200);
        }

        function addStakeholderTile() {
            const div = document.createElement('div');
            div.className = 'bg-slate-800 p-4 rounded-xl border border-slate-700 relative group';
            div.innerHTML = `<button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block"><i class="fas fa-times"></i></button><input type="text" placeholder="구분" class="text-xs font-bold text-brand-blue bg-transparent border-none p-0 w-full mb-2"><input type="text" placeholder="업체/성함" class="text-lg font-bold text-white bg-transparent border-none p-0 w-full mb-2"><textarea placeholder="성향 Insight" class="text-xs text-slate-400 bg-transparent border-none p-0 w-full"></textarea>`;
            document.getElementById('stakeholder-container').appendChild(div);
        }

        function previewFile(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(ev) {
                const container = e.target.parentElement;
                container.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover rounded-xl">`;
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
