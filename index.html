    <style>

            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }

        ::-webkit-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        ::-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }

        /* 🔥 PDF 인쇄용 최적화 렌더링 🔥 */
        @media print {
            @page { size: A4 portrait; margin: 10mm 15mm; }
            #main-wrapper, #sidebar, #detailModal, #trashModal, #imageModal, #undoToast, #smartSearchModal, #loginScreen { display: none !important; }

    <!-- 🔥 인쇄 시 나타나는 보고서 폼 (화면엔 숨김 처리됨) 🔥 -->

    <!-- 실행 취소 팝업 -->

            <div class="flex items-center gap-3 mb-6 border-b border-slate-700 pb-4">

    <!-- 사진 줌 모달 -->
    <div id="imageModal" class="fixed inset-0 bg-black/95 hidden z-[60] flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeImageModal()">

                 onclick="event.stopPropagation()"
                 onwheel="zoomImage(event)"
                 onmousedown="startPan(event)"
                 onmousemove="doPan(event)"
                 onmouseup="endPan(event)"
                 onmouseleave="endPan(event)">
        </div>
    </div>

    <!-- 스마트 검색 결과 모달 (팝업창) -->
    <div id="smartSearchModal" class="fixed inset-0 bg-black/80 hidden z-[70] flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300" onclick="closeSmartSearchModal()">
        <div id="smartSearchInner" class="bg-slate-800 border border-slate-600 rounded-2xl p-6 w-11/12 max-w-3xl shadow-2xl transform scale-95 transition-transform duration-300 relative flex flex-col max-h-[80vh]" onclick="event.stopPropagation()">
            <button onclick="closeSmartSearchModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white transition-colors bg-slate-700/50 hover:bg-slate-600 rounded-full w-8 h-8 flex items-center justify-center z-10"><i class="fas fa-times text-lg"></i></button>
            <div class="flex items-center gap-3 mb-4 border-b border-slate-700 pb-4 shrink-0">
                <div class="w-10 h-10 rounded-full bg-brand-cyan/20 flex items-center justify-center"><i class="fas fa-search text-brand-cyan text-xl"></i></div>
                <h3 class="text-xl font-bold text-white">스마트 검색 결과</h3>
                <span id="searchQueryBadge" class="ml-2 bg-slate-700/50 border border-slate-600 text-brand-cyan text-xs px-3 py-1 rounded-full font-bold"></span>
            </div>
            <div id="smartSearchResultContent" class="overflow-y-auto pr-2 space-y-6 flex-1 pb-4"></div>
        </div>
    </div>

    <!-- 핵심 로직 스크립트 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        let appDB = {};
        let updateTimes = {}; 
        let deletedNodeInfo = null;
        let toastTimeout = null;
        let draggedItem = null;
        
        let permanentlyDeleted = []; 
        let lastSyncedKeys = []; 
        
        let autoSaveTimer = null;
        let liveSyncTimer = null;
        let lastInputTime = 0; 
        
        // 히스토리 펼침 상태 관리용 변수
        let isHistoryExpanded = false;
        
        const parser = new DOMParser();

        window.onload = async function() { 
            const loginLoading = document.getElementById('loginLoading');
            const loginForm = document.getElementById('loginForm');

            try {
                const url = WEB_APP_URL + "?t=" + new Date().getTime();
                const response = await fetch(url);
                
                const textData = await response.text();
                if (!textData || textData.trim().startsWith('<')) throw new Error("AUTH_ERROR");
                
                const data = JSON.parse(textData);
                if (data && !data.error) {
                    appDB = data;
                    if (appDB['_UPDATED_TIMES_']) try { updateTimes = JSON.parse(appDB['_UPDATED_TIMES_']); } catch(e) {}
                    if (appDB['_CONFIG_ORDER_']) {
                        try {
                            let validOrder = JSON.parse(appDB['_CONFIG_ORDER_']);
                            for (let key in appDB) { 
                                if (key !== '_CONFIG_ORDER_' && key !== '_UPDATED_TIMES_' && key !== '_APP_PASSWORD_' && key !== '_ADMIN_PASSWORD_' && !key.startsWith('_DELETED_::') && key !== '_CONTENT_UPDATES_' && !validOrder.includes(key)) {
                                    delete appDB[key]; 
                                }
                            }
                        } catch(e) {}
                    }
                    lastSyncedKeys = Object.keys(appDB);
                }
            } catch (e) { 
                console.error("DB 로드 실패:", e);
                if (e.message === "AUTH_ERROR") alert("🚨 권한 오류. 구글 앱스 스크립트 설정을 확인해 주세요.");
                else alert("🚨 데이터베이스 연결 실패. 오프라인 모드로 시작합니다.");
            }

            if (sessionStorage.getItem('pjt_authenticated') === 'true') {
                const loginScreen = document.getElementById('loginScreen');
                loginScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loginScreen.remove(), 500);

                renderSidebar();
                const firstLink = document.querySelector('.pjt-link');
                if (firstLink) loadProject(firstLink.getAttribute('data-pjt-name'), firstLink.parentElement);
                else loadProject('신규 프로젝트', null);

                document.getElementById('sync-area').style.opacity = '1';
            } else {
                loginLoading.classList.add('hidden');
                loginForm.classList.remove('hidden');
                if(document.getElementById('loginPwd')) document.getElementById('loginPwd').focus();
            }

            liveSyncTimer = setInterval(fetchLiveUpdates, 10000);

            const syncAreaEl = document.getElementById('sync-area');
            syncAreaEl.addEventListener('input', triggerAutoSave);
            syncAreaEl.addEventListener('change', triggerAutoSave);
            syncAreaEl.addEventListener('click', () => lastInputTime = Date.now()); 
        };

        function triggerAutoSave() {
            lastInputTime = Date.now(); 
            if(autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveDataToCloud(true); 
            }, 3000);
        }

        window.checkPassword = function() {
            const inputPwd = document.getElementById('loginPwd').value;
            const correctPwd = appDB['_APP_PASSWORD_'] || '1234'; 

            if (inputPwd === correctPwd) {
                sessionStorage.setItem('pjt_authenticated', 'true');

                const loginScreen = document.getElementById('loginScreen');
                loginScreen.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => loginScreen.remove(), 500);

                renderSidebar();
                const firstLink = document.querySelector('.pjt-link');
                if (firstLink) loadProject(firstLink.getAttribute('data-pjt-name'), firstLink.parentElement);
                else loadProject('신규 프로젝트', null);

                document.getElementById('sync-area').style.opacity = '1';
            } else {
                const errorMsg = document.getElementById('loginError');
                errorMsg.classList.remove('hidden');
                document.getElementById('loginPwd').value = '';
                document.getElementById('loginPwd').focus();
            }
        };

        window.changePassword = function() {
            const adminPwd = appDB['_ADMIN_PASSWORD_'] || 'admin0000'; 
            const inputAdmin = prompt("🔑 [관리자 권한 확인]\n관리자 전용 비밀번호를 입력하세요.");
            if (inputAdmin === null) return; 
            
            if (inputAdmin !== adminPwd) {
                alert("🚨 관리자 비밀번호가 일치하지 않습니다. 권한이 없습니다.");
                return;
            }

            const newPwd = prompt("✅ 관리자 인증 성공!\n부서원들에게 공유할 새로운 [일반 접속 비밀번호]를 입력하세요:");
            if (newPwd === null) return;
            if (newPwd.trim() === '') { alert("비밀번호는 공백일 수 없습니다."); return; }

            const confirmPwd = prompt("새로운 [일반 접속 비밀번호]를 다시 한 번 입력하세요:");
            if (newPwd !== confirmPwd) { alert("새 비밀번호가 일치하지 않습니다."); return; }

            appDB['_APP_PASSWORD_'] = newPwd;
            
            if (confirm("관리자 전용 비밀번호도 새로 변경하시겠습니까?\n(취소 시 기존 관리자 비밀번호 유지)")) {
                const newAdminPwd = prompt("새로운 [관리자 전용 비밀번호]를 입력하세요:");
                if (newAdminPwd && newAdminPwd.trim() !== '') {
                    appDB['_ADMIN_PASSWORD_'] = newAdminPwd.trim();
                    alert("관리자 전용 비밀번호도 함께 변경되었습니다.");
                }
            }

            saveDataToCloud();
            alert("비밀번호 설정이 완료되었습니다. 서버에 저장합니다.");
        };

        // 🔥 알림 배지 수동 켜기/끄기 기능 추가 🔥
        window.toggleBadgeManual = function(pjtName, event) {
            if(event) event.stopPropagation();
            let contentUpdates = {};
            try { if(appDB['_CONTENT_UPDATES_']) contentUpdates = JSON.parse(appDB['_CONTENT_UPDATES_']); } catch(e){}

            const now = Date.now();
            const lastUpdated = contentUpdates[pjtName] || 0;
            const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;

            // 이미 배지가 켜져있다면 -> 끄기 (0으로 초기화)
            // 꺼져있거나 기한이 지났다면 -> 켜기 (현재 시간으로 설정)
            if (lastUpdated > 0 && (now - lastUpdated) <= THIRTY_DAYS) {
                contentUpdates[pjtName] = 0; 
            } else {
                contentUpdates[pjtName] = now; 
            }

            appDB['_CONTENT_UPDATES_'] = JSON.stringify(contentUpdates);
            renderSidebar(); 
            triggerAutoSave(); 
        };

        // 🔥 사이드바 드래그 앤 드롭 순서 변경 로직 🔥
        let draggedPjtItem = null;
        window.pjtDragStart = function(e) {
            if(e.target.tagName === 'BUTTON' || e.target.tagName === 'I' || e.target.closest('button')) { 
                e.preventDefault(); 
                return; 
            }
            draggedPjtItem = e.currentTarget;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', 'pjt-menu'); 
            setTimeout(() => { if(e.currentTarget) e.currentTarget.style.opacity = '0.4'; }, 0);
        }
        window.pjtDragOver = function(e) {
            e.preventDefault();
            const target = e.currentTarget;
            if(target !== draggedPjtItem) target.classList.add('drag-over-menu');
        }
        window.pjtDragLeave = function(e) { 
            e.currentTarget.classList.remove('drag-over-menu'); 
        }
        window.pjtDragEnter = function(e) { e.preventDefault(); }
        window.pjtDrop = function(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over-menu');
            if(draggedPjtItem && draggedPjtItem !== e.currentTarget && e.dataTransfer.getData('text/plain') === 'pjt-menu') {
                const container = draggedPjtItem.parentNode;
                const items = [...container.querySelectorAll('.pjt-item-wrap')];
                const draggedIdx = items.indexOf(draggedPjtItem);
                const targetIdx = items.indexOf(e.currentTarget);
                
                if (draggedIdx < targetIdx) container.insertBefore(draggedPjtItem, e.currentTarget.nextSibling);
                else container.insertBefore(draggedPjtItem, e.currentTarget);

                // 순서 배열 업데이트 및 저장
                const links = document.querySelectorAll('.pjt-link');
                const order = Array.from(links).map(link => link.getAttribute('data-pjt-name'));
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                triggerAutoSave(); 
            }
        }
        window.pjtDragEnd = function(e) {
            if(e.currentTarget) e.currentTarget.style.opacity = '1';
            document.querySelectorAll('.pjt-item-wrap').forEach(el => el.classList.remove('drag-over-menu'));
            draggedPjtItem = null;
        }

        function togglePjtMenu() {
            const menu = document.getElementById('pjtSubMenu');
            const chevron = document.getElementById('pjtChevron');
            menu.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function moveProjectUp(btnElement) {
            const currentItem = btnElement.closest('.pjt-item-wrap');
            const prevItem = currentItem.previousElementSibling;
            if (prevItem && prevItem.classList.contains('pjt-item-wrap')) {
                currentItem.parentNode.insertBefore(currentItem, prevItem);
                const links = document.querySelectorAll('.pjt-link');
                const order = Array.from(links).map(link => link.getAttribute('data-pjt-name'));
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                saveDataToCloud(); 
            }
        }

        function moveProjectDown(btnElement) {
            const currentItem = btnElement.closest('.pjt-item-wrap');
            const nextItem = currentItem.nextElementSibling;
            if (nextItem && nextItem.classList.contains('pjt-item-wrap')) {
                currentItem.parentNode.insertBefore(nextItem, currentItem);
                const links = document.querySelectorAll('.pjt-link');
                const order = Array.from(links).map(link => link.getAttribute('data-pjt-name'));
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                saveDataToCloud(); 
            }
        }

        function renameProjectLogic(oldName, newName) {
            if (appDB[oldName] !== undefined) {
                appDB[newName] = appDB[oldName];
                delete appDB[oldName];
                permanentlyDeleted.push(oldName); 
                permanentlyDeleted.push(`_DELETED_::${oldName}`); 
            } else {
                appDB[newName] = ""; 
            }
            
            permanentlyDeleted = permanentlyDeleted.filter(k => k !== newName && k !== `_DELETED_::${newName}`); 

            if (updateTimes[oldName]) {
                updateTimes[newName] = updateTimes[oldName];
                delete updateTimes[oldName];
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
            }

            if (appDB['_CONFIG_ORDER_']) {
                let order = JSON.parse(appDB['_CONFIG_ORDER_']);
                const idx = order.indexOf(oldName);
                if (idx !== -1) order[idx] = newName;
                else order.push(newName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            } else {
                let order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && k !== '_APP_PASSWORD_' && k !== '_ADMIN_PASSWORD_' && !k.startsWith('_DELETED_::') && k !== '_CONTENT_UPDATES_');
                if(!order.includes(newName)) order.push(newName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            }

            renderSidebar();

            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (currentPjt === oldName) {
                document.body.setAttribute('data-current-pjt', newName);
                const titleInput = document.getElementById('pjtTitle');
                if(titleInput) {
                    titleInput.value = newName;
                    titleInput.setAttribute('value', newName);
                }
                commitCurrentState();
            }

            saveDataToCloud();
        }

        function renameProject(oldName, btnElement) {
            let newName = prompt("새로운 프로젝트 이름을 입력하세요:", oldName);
            if (!newName) return;
            newName = newName.trim();
            if (newName === oldName) return;
            
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        function renameFromTitle(inputEl) {
            const oldName = document.body.getAttribute('data-current-pjt');
            const newName = inputEl.value.trim();
            
            if(!newName || newName === oldName) {
                inputEl.value = oldName; 
                return; 
            }
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                inputEl.value = oldName;
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        function deleteProject(pjtName, btnElement) {
            if(!confirm(`'${pjtName}' 프로젝트를 삭제하시겠습니까?\n(휴지통으로 이동되며 나중에 복구할 수 있습니다)`)) return;

            const trashKey = `_DELETED_::${pjtName}`;
            appDB[trashKey] = appDB[pjtName] || "";
            delete appDB[pjtName]; 

            if(updateTimes[pjtName]) {
                updateTimes[trashKey] = updateTimes[pjtName];
                delete updateTimes[pjtName];
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
            }

            if (appDB['_CONFIG_ORDER_']) {
                let order = JSON.parse(appDB['_CONFIG_ORDER_']);
                order = order.filter(name => name !== pjtName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            }

            const currentPjt = document.body.getAttribute('data-current-pjt');
            if(currentPjt === pjtName) {
                document.body.setAttribute('data-current-pjt', 'DELETED_TEMP');
            }
            
            renderSidebar();
            
            const firstAvailable = document.querySelector('.pjt-link');
            if(firstAvailable) loadProject(firstAvailable.getAttribute('data-pjt-name'), firstAvailable.parentElement);
            else loadProject('신규 프로젝트', null); 
            
            saveDataToCloud();
        }

        function openTrashModal() {
            const content = document.getElementById('trashContent');
            content.innerHTML = '';
            let hasItems = false;
            for(let key in appDB) {
                if(key.startsWith('_DELETED_::')) {
                    hasItems = true;
                    const originalName = key.replace('_DELETED_::', '');
                    const safeName = originalName.replace(/'/g, "\\'");
                    content.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 mb-2">
                            <span class="text-sm text-slate-300 font-semibold truncate pr-4">${originalName}</span>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="restoreProject('${safeName}')" class="text-xs font-bold bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white px-3 py-1.5 rounded transition-colors"><i class="fas fa-undo-alt mr-1"></i>복구</button>
                                <button onclick="permanentDeleteProject('${safeName}')" class="text-xs font-bold bg-brand-red/20 text-brand-red hover:bg-brand-red hover:text-white px-3 py-1.5 rounded transition-colors">영구삭제</button>
                            </div>
                        </div>
                    `;
                }
            }
            if(!hasItems) content.innerHTML = '<div class="text-center text-slate-500 text-sm py-8"><i class="fas fa-folder-open text-3xl mb-3 block opacity-50"></i>휴지통이 비어있습니다.</div>';
            
            const modal = document.getElementById('trashModal');
            const inner = document.getElementById('trashModalInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); inner.classList.remove('scale-95'); }, 10);
        }

        function closeTrashModal() {
            const modal = document.getElementById('trashModal');
            const inner = document.getElementById('trashModalInner');
            modal.classList.add('opacity-0'); inner.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function restoreProject(pjtName) {
            const trashKey = `_DELETED_::${pjtName}`;
            if(appDB[trashKey] !== undefined) {
                appDB[pjtName] = appDB[trashKey];
                delete appDB[trashKey];
                
                if(updateTimes[trashKey]) {
                    updateTimes[pjtName] = updateTimes[trashKey];
                    delete updateTimes[trashKey];
                    appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
                }

                permanentlyDeleted = permanentlyDeleted.filter(k => k !== pjtName && k !== trashKey); 
                
                let order = [];
                if (appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']);
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && k !== '_APP_PASSWORD_' && k !== '_ADMIN_PASSWORD_' && !k.startsWith('_DELETED_::') && k !== '_CONTENT_UPDATES_');
                
                if (!order.includes(pjtName)) {
                    order.push(pjtName);
                    appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                }
                renderSidebar();
                saveDataToCloud();
                openTrashModal();
                
                setTimeout(() => {
                    const links = document.querySelectorAll('.pjt-link');
                    for(let link of links) {
                        if(link.getAttribute('data-pjt-name') === pjtName) { 
                            loadProject(pjtName, link.parentElement);
                            break; 
                        }
                    }
                    closeTrashModal();
                }, 100);
            }
        }

        function permanentDeleteProject(pjtName) {
            if(!confirm(`'${pjtName}' 프로젝트를 영구 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.`)) return;
            const trashKey = `_DELETED_::${pjtName}`;
            delete appDB[trashKey];

            if(updateTimes[trashKey]) {
                delete updateTimes[trashKey];
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
            }
            if(updateTimes[pjtName]) {
                delete updateTimes[pjtName];
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
            }

            permanentlyDeleted.push(trashKey); 
            permanentlyDeleted.push(pjtName); 
            
            saveDataToCloud();
            openTrashModal();
        }

        window.deleteElement = function(btn, event) {
            if(event) event.stopPropagation();
            const target = btn.parentElement;
            target.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            target.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            target.querySelectorAll('select').forEach(el => {
                const selectedValue = el.value;
                Array.from(el.options).forEach(opt => {
                    if (opt.value === selectedValue) opt.setAttribute('selected', 'selected');
                    else opt.removeAttribute('selected');
                });
            });
            deletedNodeInfo = { node: target, parent: target.parentNode, nextSibling: target.nextSibling };
            target.remove();
            showUndoToast();
            updateHistoryView(); 
            triggerAutoSave(); 
        }

        function showUndoToast() {
            const toast = document.getElementById('undoToast');
            toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { closeUndoToast(); }, 5000); 
        }

        window.closeUndoToast = function() {
            const toast = document.getElementById('undoToast');
            toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }

        window.undoDelete = function() {
            if(deletedNodeInfo && deletedNodeInfo.parent) {
                if(deletedNodeInfo.nextSibling) deletedNodeInfo.parent.insertBefore(deletedNodeInfo.node, deletedNodeInfo.nextSibling);
                else deletedNodeInfo.parent.appendChild(deletedNodeInfo.node);
                closeUndoToast();
                deletedNodeInfo = null; 
                updateHistoryView(); 
                triggerAutoSave(); 
            }
        }

        window.toggleDept = function(btn, event) {

        function sortHistory() {
            const container = document.getElementById('history-container');
            if (!container) return;
            const tiles = Array.from(container.children);
            tiles.sort((a, b) => {
                const dateA = a.querySelector('input[type="date"]')?.value || "";
                const dateB = b.querySelector('input[type="date"]')?.value || "";
                return dateB.localeCompare(dateA); 
            });
            tiles.forEach(tile => container.appendChild(tile));
            updateHistoryView();
        }
        
        window.updateHistoryView = function() {
            const container = document.getElementById('history-container');
            const wrapper = document.getElementById('history-toggle-wrapper');
            if(!container) return;
            
            const tiles = Array.from(container.children).filter(el => el.tagName === 'DIV');
            if(tiles.length > 3) {
                if(wrapper) wrapper.classList.remove('hidden');
                tiles.forEach((tile, index) => {
                    if(index >= 3 && !isHistoryExpanded) {
                        tile.classList.add('hidden-history-item');
                    } else {
                        tile.classList.remove('hidden-history-item');
                    }
                });
                const textEl = document.getElementById('history-toggle-text');
                const iconEl = wrapper ? wrapper.querySelector('i') : null;
                if(textEl) textEl.innerText = isHistoryExpanded ? '접기' : `이전 기록 더보기 (${tiles.length - 3}개)`;
                if(iconEl) iconEl.className = isHistoryExpanded ? 'fas fa-chevron-up mr-1' : 'fas fa-chevron-down mr-1';
            } else {
                if(wrapper) wrapper.classList.add('hidden');
                tiles.forEach(tile => tile.classList.remove('hidden-history-item'));
            }
        }

        window.toggleHistoryExpand = function() {
            isHistoryExpanded = !isHistoryExpanded;
            updateHistoryView();
        }

        function addNewProject() {
            let defaultName = "신규 프로젝트";
            let counter = 1;
            while(appDB.hasOwnProperty(defaultName) || appDB.hasOwnProperty(`_DELETED_::${defaultName}`)) {
                defaultName = `신규 프로젝트 ${counter}`;
                counter++;
            }
            
            let pjtName = prompt("새로운 프로젝트 이름을 입력하세요:", defaultName);
            if (pjtName) {
                pjtName = pjtName.trim();
                
                if(appDB.hasOwnProperty(pjtName) || appDB.hasOwnProperty(`_DELETED_::${pjtName}`)) {
                    alert("이미 존재하거나 휴지통에 있는 프로젝트 이름입니다.");
                    return;
                }
                
                permanentlyDeleted = permanentlyDeleted.filter(k => k !== pjtName && k !== `_DELETED_::${pjtName}`); 

                appDB[pjtName] = getNewProjectTemplate(pjtName); 
                
                let order = [];
                if (appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']);
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && k !== '_APP_PASSWORD_' && k !== '_ADMIN_PASSWORD_' && !k.startsWith('_DELETED_::') && k !== '_CONTENT_UPDATES_');
                
                if (!order.includes(pjtName)) {
                    order.push(pjtName);
                    appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                }

                renderSidebar();
                const links = document.querySelectorAll('.pjt-link');
                let newLink = null;
                for (let link of links) {
                    if (link.getAttribute('data-pjt-name') === pjtName) {
                        newLink = link; break;
                    }
                }
                if (newLink) loadProject(pjtName, newLink.parentElement);
                else if (links.length > 0) loadProject(pjtName, links[links.length - 1].parentElement);
                
                setTimeout(() => { saveDataToCloud(); }, 300);
            }
        }

        function commitCurrentState() {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (!currentPjt || currentPjt === 'DELETED_TEMP') return false;
            const syncArea = document.getElementById('sync-area');
            
            const titleInput = document.getElementById('pjtTitle');
            if (titleInput) titleInput.setAttribute('value', titleInput.value);

            syncArea.querySelectorAll('.hidden-history-item').forEach(el => el.classList.remove('hidden-history-item'));
            isHistoryExpanded = false; 

            syncArea.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            syncArea.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            syncArea.querySelectorAll('select').forEach(el => {
                Array.from(el.options).forEach(opt => { if (opt.value === el.value) opt.setAttribute('selected', 'selected'); else opt.removeAttribute('selected'); });
            });
            
            const newData = syncArea.innerHTML;
            const oldData = appDB[currentPjt] || "";
            appDB[currentPjt] = newData;
            
            updateHistoryView();
            
            return oldData !== newData; 
        }

        async function fetchLiveUpdates() {
            const syncArea = document.getElementById('sync-area');
            const isFocused = document.activeElement && syncArea.contains(document.activeElement);
            if (Date.now() - lastInputTime < 5000 || isFocused) return; 

            try {
                const response = await fetch(WEB_APP_URL + "?t=" + new Date().getTime());
                const textData = await response.text();
                
                if (!textData || textData.trim().startsWith('<')) return;

                const data = JSON.parse(textData);

                if (data && !data.error) {
                    let serverTimes = {};
                    if(data['_UPDATED_TIMES_']) try { serverTimes = JSON.parse(data['_UPDATED_TIMES_']); } catch(e){}

                    let needsRefresh = false;
                    const currentPjt = document.body.getAttribute('data-current-pjt');

                    for (let key in data) {
                        if (key.startsWith('_') && !key.startsWith('_DELETED_::')) {
                            if(key === '_CONTENT_UPDATES_') appDB[key] = data[key]; 
                            continue;
                        }
                        if (permanentlyDeleted.includes(key)) continue;
                        
                        let serverTime = serverTimes[key];
                        let localTime = updateTimes[key];

                        if (serverTime && serverTime !== localTime) {
                            appDB[key] = data[key];
                            updateTimes[key] = serverTime;
                            if (key === currentPjt) needsRefresh = true;
                        }
                    }
                    appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);

                    if (data['_CONFIG_ORDER_'] && data['_CONFIG_ORDER_'] !== appDB['_CONFIG_ORDER_']) {
                        let serverOrder = [];
                        try { serverOrder = JSON.parse(data['_CONFIG_ORDER_']); } catch(e) {}
                        let localOrder = [];
                        try { localOrder = JSON.parse(appDB['_CONFIG_ORDER_'] || '[]'); } catch(e) {}
                        
                        let mergedOrder = [...serverOrder];
                        localOrder.forEach(item => {
                            if (!mergedOrder.includes(item) && appDB[item] !== undefined && !appDB[`_DELETED_::${item}`]) {
                                mergedOrder.push(item);
                            }
                        });
                        mergedOrder = mergedOrder.filter(item => !appDB[`_DELETED_::${item}`]); 
                        
                        const newOrderStr = JSON.stringify(mergedOrder);
                        if (appDB['_CONFIG_ORDER_'] !== newOrderStr) {
                            appDB['_CONFIG_ORDER_'] = newOrderStr;
                            renderSidebar();
                        }
                    }

                    for (let key in appDB) {
                        if (!key.startsWith('_')) {
                            if (!data.hasOwnProperty(key)) {
                                if (data.hasOwnProperty(`_DELETED_::${key}`)) {
                                    delete appDB[key];
                                    if (key === currentPjt) { document.body.setAttribute('data-current-pjt', 'DELETED_TEMP'); needsRefresh = true; }
                                } 
                                else if (lastSyncedKeys.includes(key)) {
                                    delete appDB[key];
                                    if (key === currentPjt) { document.body.setAttribute('data-current-pjt', 'DELETED_TEMP'); needsRefresh = true; }
                                }
                            }
                        }
                    }

                    if (needsRefresh && currentPjt && currentPjt !== 'DELETED_TEMP') {
                        if (document.activeElement && syncArea.contains(document.activeElement)) return;

                        const doc = parser.parseFromString(appDB[currentPjt], 'text/html');
                        doc.querySelectorAll('#history-container textarea').forEach(ta => {
                            ta.className = "text-sm text-slate-200 w-full resize-none bg-transparent border-none p-0 focus:ring-0 overflow-hidden h-[2.8rem] leading-[1.4rem] hover:bg-white/5 px-1 rounded cursor-text pointer-events-auto";
                        });
                        syncArea.innerHTML = doc.body.innerHTML;
                        
                        ensureHistoryToggleExists(syncArea);
                        isHistoryExpanded = false;
                        updateHistoryView();
                        
                        document.querySelectorAll('textarea:not(#history-container textarea)').forEach(el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; });

                        const timeTextEl = document.getElementById('lastModText');
                        if(timeTextEl) {
                            timeTextEl.innerHTML = `<span class="text-brand-cyan font-bold">방금 동기화됨</span>`;
                            const displayTime = updateTimes[currentPjt] ? updateTimes[currentPjt].split('::')[0] : '-';
                            setTimeout(() => { timeTextEl.innerHTML = `최종 수정: ${displayTime}`; }, 3000);
                        }
                    } else {
                        renderSidebar();
                    }
                    
                    lastSyncedKeys = Object.keys(appDB);
                }
            } catch(e) { console.error("Live Sync Error (무시됨):", e); }
        }

        async function saveDataToCloud(isAuto = false) {
            if (autoSaveTimer && !isAuto) clearTimeout(autoSaveTimer);

            // 🔥 [수정 3] 드래그 앤 드롭 복귀 오류 방지: 저장 직전 무조건 현재 화면에 보이는 배열 순서를 강제로 추출하여 덮어쓰기 🔥
            const links = document.querySelectorAll('.pjt-link');
            if (links.length > 0) {
                const currentDomOrder = Array.from(links).map(link => link.getAttribute('data-pjt-name'));
                appDB['_CONFIG_ORDER_'] = JSON.stringify(currentDomOrder);
            }

            const btn = document.getElementById('saveBtn');
            const timeTextEl = document.getElementById('lastModText');
            
            if(!isAuto && btn) {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin text-sm"></i> <span class="hidden sm:inline">저장 중</span>';
            } else if (timeTextEl) {
                timeTextEl.innerHTML = `<span class="text-brand-blue font-bold">자동 저장 중...</span>`;
            }

            const isDataChanged = commitCurrentState(); 
            let currentPjt = document.body.getAttribute('data-current-pjt');
            
            if (currentPjt && currentPjt !== 'DELETED_TEMP') {
                const now = new Date();
                const timeStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                
                const syncTimeStr = timeStr + "::" + Date.now();
                updateTimes[currentPjt] = syncTimeStr;
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes); 
                
                // 실제 변경점이 있을 때만 배지 알림용 업데이트 시각 갱신
                if(isDataChanged) {
                    let contentUpdates = {};
                    try { if(appDB['_CONTENT_UPDATES_']) contentUpdates = JSON.parse(appDB['_CONTENT_UPDATES_']); } catch(e){}
                    contentUpdates[currentPjt] = Date.now();
                    appDB['_CONTENT_UPDATES_'] = JSON.stringify(contentUpdates);
                }
            }

            try {
                try {
                    const getRes = await fetch(WEB_APP_URL + "?t=" + new Date().getTime());
                    const textData = await getRes.text();
                    
                    if (textData && !textData.trim().startsWith('<')) {
                        const latestData = JSON.parse(textData);
                        if (latestData && !latestData.error) {
                            
                            commitCurrentState();
                            currentPjt = document.body.getAttribute('data-current-pjt');
                            const myCurrentPjtData = appDB[currentPjt];
                            const myOrder = appDB['_CONFIG_ORDER_'];
                            
                            permanentlyDeleted.forEach(delKey => {
                                delete latestData[delKey];
                            });

                            for (let key in appDB) {
                                if (!key.startsWith('_')) {
                                    if (!latestData.hasOwnProperty(key)) {
                                        if (latestData.hasOwnProperty(`_DELETED_::${key}`)) {
                                            delete appDB[key];
                                        } else if (lastSyncedKeys.includes(key)) {
                                            delete appDB[key];
                                        } else if (!permanentlyDeleted.includes(key)) {
                                            latestData[key] = appDB[key];
                                        }
                                    } else if (!permanentlyDeleted.includes(key)) {
                                        latestData[key] = appDB[key];
                                    }
                                }
                            }

                            const myDeletions = Object.keys(appDB).filter(k => k.startsWith('_DELETED_::'));
                            myDeletions.forEach(delKey => {
                                latestData[delKey] = appDB[delKey];
                                delete latestData[delKey.replace('_DELETED_::', '')]; 
                            });
                            
                            if (appDB['_CONTENT_UPDATES_']) {
                                let myUpdates = JSON.parse(appDB['_CONTENT_UPDATES_']);
                                let serverUpdates = {};
                                try { if(latestData['_CONTENT_UPDATES_']) serverUpdates = JSON.parse(latestData['_CONTENT_UPDATES_']); } catch(e){}
                                for(let key in myUpdates) {
                                    serverUpdates[key] = myUpdates[key]; 
                                }
                                latestData['_CONTENT_UPDATES_'] = JSON.stringify(serverUpdates);
                            }

                            let serverTimes = {};
                            if (latestData['_UPDATED_TIMES_']) {
                                try { serverTimes = JSON.parse(latestData['_UPDATED_TIMES_']); } catch(e){}
                            }
                            if (currentPjt && currentPjt !== 'DELETED_TEMP' && updateTimes[currentPjt]) {
                                serverTimes[currentPjt] = updateTimes[currentPjt]; 
                            }
                            for(let key in updateTimes) {
                                if(!serverTimes[key]) serverTimes[key] = updateTimes[key]; 
                            }
                            updateTimes = serverTimes; 

                            appDB = latestData; 
                            
                            if (currentPjt && currentPjt !== 'DELETED_TEMP' && myCurrentPjtData) appDB[currentPjt] = myCurrentPjtData;
                            
                            if (myOrder) {
                                let lOrder = []; try { lOrder = JSON.parse(myOrder); } catch(e){}
                                let sOrder = []; try { sOrder = JSON.parse(latestData['_CONFIG_ORDER_'] || '[]'); } catch(e){}
                                
                                let mergedOrder = [...lOrder]; 
                                sOrder.forEach(item => {
                                    if (!mergedOrder.includes(item) && !permanentlyDeleted.includes(item)) mergedOrder.push(item); 
                                });
                                
                                mergedOrder = mergedOrder.filter(item => appDB[item] !== undefined && !appDB[`_DELETED_::${item}`]);
                                appDB['_CONFIG_ORDER_'] = JSON.stringify(mergedOrder);
                            }

                            appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
                        }
                    }
                } catch (e) {
                    console.warn("Pre-fetch 병합 실패, 로컬 데이터로 단독 저장 진행:", e);
                }

                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(appDB)
                });
                
                if (!response.ok) throw new Error("네트워크 연결 오류");

                const responseText = await response.text();
                try {
                    const resultData = JSON.parse(responseText);
                    if (resultData.error === "LOCKED") {
                        if(!isAuto) alert("🚨 [충돌 방지 안전장치 작동]\n현재 다른 부서원이 데이터를 저장 중입니다.\n시스템이 3초 후 백그라운드에서 자동으로 재시도합니다.");
                        if(autoSaveTimer) clearTimeout(autoSaveTimer);
                        autoSaveTimer = setTimeout(() => saveDataToCloud(true), 3000); 
                        return; 
                    }
                } catch(e) {} 
                
                lastSyncedKeys = Object.keys(appDB);
                renderSidebar(); 

                if(!isAuto && btn) {
                    btn.innerHTML = '<i class="fas fa-check text-green-400 text-sm"></i> <span class="hidden sm:inline">완료</span>';
                    btn.classList.replace('border-green-500', 'border-green-400');
                    if(timeTextEl) {
                        const displayTime = updateTimes[currentPjt] ? updateTimes[currentPjt].split('::')[0] : '-';
                        timeTextEl.innerHTML = `최종 수정: ${displayTime}`;
                    }
                } else if (timeTextEl) {
                    timeTextEl.innerHTML = `<span class="text-green-400 font-bold">자동 저장 완료</span>`;
                    setTimeout(() => { 
                        if(Date.now() - lastInputTime >= 3000) {
                            const displayTime = updateTimes[currentPjt] ? updateTimes[currentPjt].split('::')[0] : '-';
                            timeTextEl.innerHTML = `최종 수정: ${displayTime}`; 
                        }
                    }, 2000);
                }

            } catch (err) { 
                console.error("클라우드 저장 실패:", err);
                if(!isAuto && btn) {
                    alert("저장 중 통신 오류가 발생했습니다.\n네트워크 상태를 확인해 주세요."); 
                    btn.innerHTML = '<i class="fas fa-times text-red-400 text-sm"></i> <span class="hidden sm:inline text-red-400">실패</span>';
                }
            } finally {
                if(!isAuto && btn) {
                    setTimeout(() => { btn.innerHTML = '<i class="fas fa-save text-sm"></i> <span class="hidden sm:inline">저장</span>'; btn.classList.replace('border-green-400', 'border-green-500'); }, 2000);
                }
            }
        }

        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 500; const MAX_HEIGHT = 400; 
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.5); 
                    
                    if (dataUrl.length > 45000) {
                        alert("🚨 첨부하신 이미지의 용량이 너무 커서 클라우드(구글 시트)에 저장할 수 없습니다.\n시스템 셧다운을 방지하기 위해 더 작거나 단순한 이미지를 첨부해 주세요.\n(최대 5만자 제한 초과)");
                        return;
                    }

                    const previewImage = document.getElementById('previewImage');
                    const placeholder = document.getElementById('uploadPlaceholder');
                    const changeBtn = document.getElementById('changeImgBtn');
                    const zoomHint = document.getElementById('zoomHintIcon');
                    
                    previewImage.src = dataUrl;
                    previewImage.setAttribute('src', dataUrl);
                    previewImage.classList.remove('hidden');
                    if(placeholder) placeholder.classList.add('hidden');
                    if(changeBtn) changeBtn.classList.remove('hidden');
                    if(zoomHint) zoomHint.classList.remove('hidden');
                    
                    triggerAutoSave(); 
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function openImageModal() {
            const previewSrc = document.getElementById('previewImage').src;
            if (!previewSrc || previewSrc === window.location.href) return;
            document.getElementById('enlargedImage').src = previewSrc;
            
            imgScale = 1;
            imgTranslateX = 0;
            imgTranslateY = 0;
            document.getElementById('enlargedImage').style.transform = `translate(0px, 0px) scale(1)`;

            const modal = document.getElementById('imageModal');
            const wrapper = document.getElementById('imageModalWrapper');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); wrapper.classList.remove('scale-95'); }, 10);
            lastInputTime = Date.now(); 
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            const wrapper = document.getElementById('imageModalWrapper');
            modal.classList.add('opacity-0');
            if(wrapper) wrapper.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
            lastInputTime = Date.now(); 
        }

        let imgScale = 1;
        let imgTranslateX = 0;
        let imgTranslateY = 0;
        let isDraggingImg = false;
        let dragStartX = 0;
        let dragStartY = 0;

        window.zoomImage = function(e) {
            e.preventDefault();
            lastInputTime = Date.now(); 
            const zoomSensitivity = 0.15;
            if (e.deltaY < 0) imgScale += zoomSensitivity; 
            else imgScale -= zoomSensitivity; 
            
            imgScale = Math.max(0.2, Math.min(imgScale, 10)); 
            updateImageTransform();
        }

        window.startPan = function(e) {
            e.preventDefault();
            lastInputTime = Date.now(); 
            isDraggingImg = true;
            dragStartX = e.clientX - imgTranslateX;
            dragStartY = e.clientY - imgTranslateY;
            document.getElementById('enlargedImage').style.cursor = 'grabbing';
        }

        window.doPan = function(e) {
            if (!isDraggingImg) return;
            e.preventDefault();
            lastInputTime = Date.now();
            imgTranslateX = e.clientX - dragStartX;
            imgTranslateY = e.clientY - dragStartY;
            updateImageTransform();
        }

        window.endPan = function(e) {
            isDraggingImg = false;
            document.getElementById('enlargedImage').style.cursor = 'grab';
        }

        function updateImageTransform() {
            const img = document.getElementById('enlargedImage');
            img.style.transform = `translate(${imgTranslateX}px, ${imgTranslateY}px) scale(${imgScale})`;
        }

        function updateStatusColor(selectElement) {
            const value = selectElement.value;
            selectElement.className = "w-48 text-xs font-bold rounded-full px-2 py-1 cursor-pointer transition-colors outline-none";

            else if (value.includes("진행")) selectElement.classList.add("bg-yellow-500/20", "text-yellow-400", "border", "border-yellow-500/50");
            else if (value.includes("이슈")) selectElement.classList.add("bg-brand-red/20", "text-brand-red", "border", "border-brand-red/50");
        }

                const contactDept = deptSelect ? deptSelect.value : "없음";

                bodyContent += `<div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700"><p class="text-xs text-brand-cyan mb-1 font-bold tracking-wider">회사명</p><p class="text-lg font-bold text-white">${company}</p></div>`;

        window.dragStart = function(e) {
            if (['INPUT', 'TEXTAREA', 'SELECT', 'OPTION', 'BUTTON'].includes(e.target.tagName)) {
                e.preventDefault(); return;
            }
            lastInputTime = Date.now(); 
            window.draggedItem = e.currentTarget;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', 'dragged'); 
            setTimeout(() => { if(e.currentTarget) e.currentTarget.style.opacity = '0.4'; }, 0);
        }

        window.dragEnter = function(e) { e.preventDefault(); }
        window.dragOver = function(e) {
            e.preventDefault();
            lastInputTime = Date.now();
            e.dataTransfer.dropEffect = 'move';
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem && targetItem !== window.draggedItem) targetItem.classList.add('drag-over');
        }

        window.drop = function(e) {
            e.preventDefault();
            lastInputTime = Date.now();
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem && targetItem !== window.draggedItem && e.dataTransfer.getData('text/plain') === 'dragged') {
                const container = targetItem.parentNode;
                const allItems = [...container.querySelectorAll('.stakeholder-tile')];
                if (allItems.indexOf(window.draggedItem) < allItems.indexOf(targetItem)) {
                    container.insertBefore(window.draggedItem, targetItem.nextSibling);
                } else {
                    container.insertBefore(window.draggedItem, targetItem);
                }
            }
            if (window.draggedItem) window.draggedItem.style.opacity = '1';
            document.querySelectorAll('.stakeholder-tile').forEach(el => el.classList.remove('drag-over'));
            triggerAutoSave(); 
        }

        window.dragEnd = function(e) {
            if(e.currentTarget) e.currentTarget.style.opacity = '1';
            document.querySelectorAll('.stakeholder-tile').forEach(el => el.classList.remove('drag-over'));
            window.draggedItem = null;
        }

        window.dragLeave = function(e) {
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem) targetItem.classList.remove('drag-over');
        }
