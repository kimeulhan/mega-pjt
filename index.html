<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주요 PJT 정보 공유 관리 시스템</title>
    
    <meta property="og:title" content="📊 주요 PJT 정보 공유 관리 시스템">
    <meta property="og:description" content="전력솔루션영업부문 핵심 PJT 실시간 현황 및 의사결정권자 매핑 시스템입니다.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' }, brand: { blue: '#3b82f6', cyan: '#06b6d4', red: '#ef4444' } } }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        
        /* 안내 문구(Placeholder) 15% 투명도 및 기울임꼴 */
        ::-webkit-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        ::-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-ms-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        
        .clickable-tile { cursor: pointer; transition: all 0.2s ease; }
        .clickable-tile:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-2px); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* 🔥 PDF 인쇄 엔진: 메인 화면 숨김 + 템플릿만 렌더링 🔥 */
        @media print {
            @page { size: A4 portrait; margin: 10mm; }
            #main-wrapper, #sidebar, #detailModal, #trashModal, #imageModal, #undoToast { display: none !important; }
            #print-area { display: block !important; }
            body, html { background: white !important; color: black !important; height: auto !important; width: 100% !important; overflow: visible !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            a[href]:after { content: none !important; }
        }

        .stakeholder-tile { cursor: grab; }
        .stakeholder-tile:active { cursor: grabbing; }
        .stakeholder-tile.drag-over { border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" data-current-pjt="">

    <!-- 메인 대시보드 뷰 -->
    <div id="main-wrapper" class="flex h-screen w-full overflow-hidden">
        
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 hidden md:flex flex-col shrink-0 z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <i class="fas fa-bolt text-brand-blue text-xl mr-3"></i>
                <span class="font-extrabold text-[15px] tracking-wide text-white">전력솔루션영업부문</span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto relative">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Main Menu</div>
                
                <div class="mb-4 relative no-print">
                    <i class="fas fa-search absolute left-3 top-2.5 text-slate-500 text-xs pointer-events-none"></i>
                    <input type="text" id="pjtSearch" oninput="filterProjects(this)" placeholder="프로젝트, 상태 검색..." class="w-full bg-slate-800 border border-slate-700 text-slate-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:border-brand-blue transition-colors outline-none">
                </div>

                <nav class="space-y-1">
                    <div class="space-y-1">
                        <button onclick="togglePjtMenu()" class="w-full flex justify-between items-center px-3 py-2.5 bg-brand-blue/10 text-brand-blue rounded-lg font-bold transition-colors">
                            <div class="flex items-center"><i class="fas fa-chart-pie w-5 mr-2"></i> PJT 대시보드</div>
                            <i id="pjtChevron" class="fas fa-chevron-down text-xs transition-transform duration-200 transform rotate-180"></i>
                        </button>
                        <div id="pjtSubMenu" class="pl-9 pr-2 py-2 space-y-3">
                            <div id="loadingSidebar" class="text-slate-500 text-xs py-4 text-center"><i class="fas fa-spinner fa-spin mr-1"></i> DB 연결 중...</div>
                        </div>
                    </div>
                </nav>
            </div>
        </aside>

        <main id="scroll-main" class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-4 lg:px-6 shrink-0 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-slate-300 hover:text-white mr-4" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="font-bold text-lg text-white hidden sm:block">주요 PJT 정보 공유 관리 시스템</h1>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div id="lastModifiedTime" class="hidden sm:flex items-center text-[11px] font-medium text-slate-400 mr-2 tracking-wide no-print">
                        <i class="far fa-clock mr-1.5"></i><span id="lastModText">최종 수정: -</span>
                    </div>

                    <button id="saveBtn" onclick="saveDataToCloud()" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white text-[13px] w-24 py-2 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow-lg transition-all hover:-translate-y-0.5 border border-green-500" title="단축키: Ctrl + S">
                        <i class="fas fa-save text-base"></i> <span class="hidden sm:inline">저장</span>
                    </button>
                    <button onclick="executePrint()" class="bg-slate-700 hover:bg-slate-600 text-white text-[13px] w-24 py-2 rounded-lg font-bold flex items-center justify-center gap-1.5 shadow-lg transition-all hover:-translate-y-0.5 border border-slate-500">
                        <i class="fas fa-print text-base"></i> <span class="hidden sm:inline">출력</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-850 relative">
                <div class="max-w-7xl mx-auto">
                    <div id="sync-area" class="transition-opacity duration-300 opacity-30">
                        
                        <div class="mb-8 flex flex-col md:flex-row justify-between items-start">
                            <div class="w-full">
                                <div class="flex items-center gap-3 mb-2">
                                    <select id="statusSelect" onchange="updateStatusColor(this)" class="w-48 text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-full px-2 py-1 cursor-pointer transition-colors outline-none">
                                        <option value="완료" class="bg-slate-800 text-white">완료</option>
                                        <option value="진행 중" selected class="bg-slate-800 text-white">진행 중</option>
                                        <option value="주요 이슈" class="bg-slate-800 text-white">주요 이슈</option>
                                    </select>
                                </div>
                                <input type="text" id="pjtTitle" value="" placeholder="데이터를 불러오는 중입니다..." onchange="renameFromTitle(this)" onkeydown="if(event.key==='Enter') this.blur();" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight bg-transparent border-none w-full mb-2 h-12 px-0 hover:bg-white/5 transition-colors cursor-text rounded-md" title="클릭하여 프로젝트 이름 변경">
                                
                                <div class="flex items-center text-brand-cyan w-full mt-2">
                                    <i class="fas fa-bullseye mr-2 shrink-0 text-lg"></i>
                                    <span class="text-brand-cyan text-base font-bold w-16 md:w-20 shrink-0">Target:</span>
                                    <input type="text" value="" placeholder="예: 가온 GP커넥터 + ACF 케이블 통합 솔루션 벤더 등록" class="text-slate-300 text-base md:text-lg w-full border-none bg-transparent hover:bg-white/5 transition-colors px-2 py-1 rounded-md">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            
                            <div class="flex flex-col gap-6">
                                <section class="glass-panel rounded-2xl p-5 shadow-2xl relative">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-image text-brand-blue shrink-0"></i>
                                            <span class="text-lg font-bold text-slate-200 w-full px-2">현장 조감도 및 개요</span>
                                        </h2>
                                        <button onclick="addOverviewTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 세부항목 추가
                                        </button>
                                    </div>
                                    
                                    <div class="w-full h-48 bg-slate-800 rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center relative overflow-hidden group hover:border-brand-blue transition-colors">
                                        <div id="uploadPlaceholder" class="flex flex-col items-center justify-center z-10 p-4 w-full h-full cursor-pointer bg-slate-800/80 hover:bg-slate-800/90 transition-all" onclick="document.getElementById('imageUpload').click()">
                                            <i class="fas fa-camera text-3xl text-slate-400 mb-2 group-hover:text-brand-blue transition-colors"></i>
                                            <span class="text-xs text-slate-300 text-center">클릭하여 사진 첨부<br>(로컬 파일 첨부)</span>
                                        </div>
                                        <img id="previewImage" src="" alt="현장 조감도" class="absolute inset-0 w-full h-full object-cover hidden z-0 cursor-pointer" onclick="openImageModal()">
                                        <button id="changeImgBtn" onclick="document.getElementById('imageUpload').click()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-brand-blue text-white px-3 py-1.5 rounded-lg text-xs font-bold hidden z-20 transition-colors shadow-lg border border-slate-600">
                                            <i class="fas fa-sync-alt mr-1"></i> 변경
                                        </button>
                                        <div id="zoomHintIcon" class="absolute bottom-2 right-2 bg-black/60 text-white p-2 rounded-lg hidden z-10 pointer-events-none">
                                            <i class="fas fa-search-plus"></i>
                                        </div>
                                        <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewFile(event)">
                                    </div>

                                    <div id="overview-container" class="mt-4 grid grid-cols-2 gap-3">
                                        <!-- 🔥 타이틀 자유 수정 가능하도록 preserve-val 제거 🔥 -->
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <input type="text" value="💰 총 투자 규모" class="text-[11px] font-semibold text-brand-cyan mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1 cursor-text">
                                            <input type="text" value="" placeholder="예: 15조 원" class="text-lg font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1">
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <input type="text" value="📅 진행 기간" class="text-[11px] font-semibold text-purple-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1 cursor-text">
                                            <input type="text" value="" placeholder="예: 2025.Q3 ~ 2027.Q4" class="text-[13px] font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full mt-1 hover:bg-white/5 rounded-md px-1">
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="col-span-2 clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <input type="text" value="🎯 공사 진행 현황" placeholder="항목명" class="text-[11px] font-semibold text-blue-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1 cursor-text">
                                            <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 클린룸 상층부 배관망 공사 진행 중" class="text-sm text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full resize-none overflow-hidden hover:bg-white/5 rounded-md px-1"></textarea>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                    </div>
                                </section>

                                <section class="glass-panel rounded-2xl p-5 shadow-2xl">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-chart-pie text-brand-blue shrink-0"></i>
                                            <span class="text-lg font-bold text-slate-200 w-full px-2">목표 매출</span>
                                        </h2>
                                        <button onclick="addTamTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 추가
                                        </button>
                                    </div>
                                    <div id="tam-container" class="grid grid-cols-2 gap-4">
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/50 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            <input type="text" value="" placeholder="항목 (예: 배관 자재)" class="text-sm font-semibold text-slate-300 mb-1 w-full bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded">
                                            <div class="flex items-center">
                                                <input type="text" value="" oninput="formatNumber(this)" placeholder="예: 35" class="text-lg font-bold text-white w-full text-right bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><span class="text-sm text-slate-500 ml-1">억원</span>
                                            </div>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/50 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            <input type="text" value="" placeholder="항목 (예: ACF 케이블)" class="text-sm font-semibold text-slate-300 mb-1 w-full bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded">
                                            <div class="flex items-center">
                                                <input type="text" value="" oninput="formatNumber(this)" placeholder="예: 82" class="text-lg font-bold text-white w-full text-right bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><span class="text-sm text-slate-500 ml-1">억원</span>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                                
                                <section class="glass-panel rounded-2xl p-5 shadow-2xl relative">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-shield-alt text-brand-blue shrink-0"></i>
                                            <span class="text-lg font-bold text-slate-200 w-full px-2">핵심 제안 가치</span>
                                        </h2>
                                        <button onclick="addValueTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 추가
                                        </button>
                                    </div>
                                    <div id="value-container" class="space-y-4">
                                        <div onclick="openTileModal(this, event)" class="clickable-tile flex gap-4 items-start relative group p-3 -m-3 rounded-xl border border-transparent hover:bg-slate-800/30">
                                            <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <div class="w-8 h-8 rounded-full bg-brand-blue/20 flex items-center justify-center shrink-0 mt-1"><i class="fas fa-coins text-brand-blue text-xs pointer-events-none"></i></div>
                                            <div class="w-full pr-6 relative">
                                                <input type="text" value="" placeholder="가치명 (예: TCO 절감)" class="text-sm font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded-md">
                                                <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 무용접 원터치 체결(GP커넥터)로 시공 공기 70%, 현장 노무비 65% 혁신적 절감." class="text-xs text-slate-300 w-full resize-none border-none bg-transparent p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded-md"></textarea>
                                                <i class="fas fa-search-plus absolute bottom-0 right-0 text-brand-blue/50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            </div>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile flex gap-4 items-start relative group p-3 -m-3 rounded-xl border border-transparent hover:bg-slate-800/30">
                                            <button onclick="deleteElement(this, event)" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-1"><i class="fas fa-check-double text-green-400 text-xs pointer-events-none"></i></div>
                                            <div class="w-full pr-6 relative">
                                                <input type="text" value="" placeholder="가치명 (예: KEC 규정 완벽 대응)" class="text-sm font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded-md">
                                                <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 진동 노출 구간 내 별도 접지(본딩) 생략 가능한 합법적 논리 적용." class="text-xs text-slate-300 w-full resize-none border-none bg-transparent p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded-md"></textarea>
                                                <i class="fas fa-search-plus absolute bottom-0 right-0 text-brand-blue/50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>

                            <div id="right-column" class="xl:col-span-2 flex flex-col gap-6">
                                
                                <div id="dept-container" class="glass-panel rounded-xl p-4 shadow-xl border border-brand-cyan/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 bg-slate-800/30">
                                    <div class="flex items-center text-sm font-bold text-slate-200 shrink-0">
                                        <i class="fas fa-network-wired text-brand-cyan mr-2"></i> 관련 부서
                                    </div>
                                    <div class="flex flex-wrap gap-2 sm:justify-end w-full">
                                        <button onclick="toggleDept(this, event)" data-name="건설" class="dept-btn px-3 py-1.5 text-xs font-semibold rounded-full border border-slate-600 text-slate-400 bg-slate-800 hover:bg-slate-700 transition-colors">건설</button>

    <!-- 핵심 로직 스크립트 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        let appDB = {};
        let updateTimes = {}; 
        
        let deletedNodeInfo = null;
        let toastTimeout = null;

        window.deleteElement = function(btn, event) {
            if(event) event.stopPropagation();
            const target = btn.parentElement;

            target.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            target.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            target.querySelectorAll('select').forEach(el => {
                const selectedValue = el.value;
                Array.from(el.options).forEach(opt => {
                    if (opt.value === selectedValue) opt.setAttribute('selected', 'selected');
                    else opt.removeAttribute('selected');
                });
            });

            deletedNodeInfo = {
                node: target,
                parent: target.parentNode,
                nextSibling: target.nextSibling
            };

            target.remove();
            showUndoToast();
        }

        function showUndoToast() {
            const toast = document.getElementById('undoToast');
            toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { closeUndoToast(); }, 5000); 
        }

        window.closeUndoToast = function() {
            const toast = document.getElementById('undoToast');
            toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }

        window.undoDelete = function() {
            if(deletedNodeInfo && deletedNodeInfo.parent) {
                if(deletedNodeInfo.nextSibling) deletedNodeInfo.parent.insertBefore(deletedNodeInfo.node, deletedNodeInfo.nextSibling);
                else deletedNodeInfo.parent.appendChild(deletedNodeInfo.node);
                closeUndoToast();
                deletedNodeInfo = null; 
            }
        }

        // 🔥 스마트 검색 로직 (상태 및 프로젝트 이름 동시 검색) 🔥
        window.filterProjects = function(inputEl) {
            const query = inputEl.value.toLowerCase().trim();
            const items = document.querySelectorAll('.pjt-item-wrap');
            const currentPjt = document.body.getAttribute('data-current-pjt');
            
            items.forEach(item => {
                const pjtName = item.querySelector('.pjt-link').innerText;
                const text = pjtName.toLowerCase();
                let statusText = "";
                
                if (pjtName === currentPjt) {
                    const selectEl = document.getElementById('statusSelect');
                    if (selectEl) statusText = selectEl.value.toLowerCase();
                } 
                else if (appDB[pjtName]) {
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = appDB[pjtName];
                    const selectEl = tempDiv.querySelector('#statusSelect');
                    if (selectEl) {
                        const selectedOpt = selectEl.querySelector('option[selected]');
                        if(selectedOpt) statusText = selectedOpt.value.toLowerCase();
                        else statusText = selectEl.value.toLowerCase();
                    }
                }

                if(text.includes(query) || statusText.includes(query)) {
                    item.style.display = 'flex';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        window.formatNumber = function(inputEl) {
            let val = inputEl.value.replace(/[^0-9]/g, ''); 
            if(val) inputEl.value = Number(val).toLocaleString('ko-KR');
            else inputEl.value = '';
        }

        document.addEventListener('keydown', function(e) {
            const isMac = window.navigator.platform.match("Mac");
            const cmdKey = isMac ? e.metaKey : e.ctrlKey;
            
            if (cmdKey && e.keyCode === 83) {
                e.preventDefault(); 
                saveDataToCloud();   
            }
            
            if (cmdKey && e.keyCode === 90) {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag !== 'input' && activeTag !== 'textarea' && deletedNodeInfo) {
                    e.preventDefault();
                    undoDelete();
                }
            }
        }, false);

        // 🔥 최강의 PDF 출력 엔진 (프리미엄 컨설팅 펌 스타일 템플릿) 🔥
        window.executePrint = function() {
            try {
                // 1. 기본 정보
                const title = document.getElementById('pjtTitle')?.value || '제목 없음';
                const status = document.getElementById('statusSelect')?.value || '';
                const targetInputs = document.querySelectorAll('#sync-area .text-brand-cyan.w-full.mt-2 input[type="text"]');
                const target = targetInputs.length > 0 ? targetInputs[0].value : "";
