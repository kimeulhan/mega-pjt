        window.filterProjects = function(inputEl) {
            let query = inputEl;
            if(typeof inputEl === 'object' && inputEl !== null) query = inputEl.value || '';
            const normalizedQuery = query.toLowerCase().replace(/\s+/g, '');
            const items = document.querySelectorAll('.pjt-item-wrap');
            const currentPjt = document.body.getAttribute('data-current-pjt');
            
            items.forEach(item => {
                const pjtName = item.querySelector('.pjt-link').getAttribute('data-pjt-name');
                const text = pjtName.toLowerCase().replace(/\s+/g, '');
                let statusText = "진행중";
                
                if (pjtName === currentPjt) {
                    const selectEl = document.getElementById('statusSelect');
                    if (selectEl) statusText = selectEl.options[selectEl.selectedIndex].text.toLowerCase().replace(/\s+/g, '');
                } 
                else if (appDB[pjtName]) {
                    const valMatch = appDB[pjtName].match(/<option[^>]*selected[^>]*value=["']([^"']+)["']/i);
                    const textMatch = appDB[pjtName].match(/<option[^>]*selected[^>]*>([^<]+)<\/option>/i);
                    if (valMatch) statusText = valMatch[1].toLowerCase().replace(/\s+/g, '');
                    else if (textMatch) statusText = textMatch[1].toLowerCase().replace(/\s+/g, '');
                }

                if(text.includes(normalizedQuery) || statusText.includes(normalizedQuery)) item.style.display = 'flex';
                else item.style.display = 'none';
            });
        }

        window.executeSmartSearch = function(query) {
            const originalQuery = query.trim();
            query = originalQuery.toLowerCase().replace(/\s+/g, '');
            if (!query) return;

            commitCurrentState();
            document.getElementById('searchQueryBadge').innerText = `'${originalQuery}'`;
            const contentArea = document.getElementById('smartSearchResultContent');
            contentArea.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i><p>프로젝트 및 담당자 DB를 스캔 중입니다...</p></div>';

            const modal = document.getElementById('smartSearchModal');
            const inner = document.getElementById('smartSearchInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); inner.classList.remove('scale-95'); }, 10);

            setTimeout(() => {
                let matchedProjects = [];
                let matchedStakeholders = [];

                for (const pjtName in appDB) {
                    if (pjtName.startsWith('_') || pjtName === 'error') continue;

                    let pjtAdded = false;
                    const doc = parser.parseFromString(appDB[pjtName] || '', 'text/html');

                    let statusText = "진행중";
                    let originalStatusText = "진행 중";
                    const selectEl = doc.querySelector('#statusSelect');
                    if (selectEl) {
                        const selectedOpt = selectEl.querySelector('option[selected]');
                        originalStatusText = selectedOpt ? selectedOpt.value : selectEl.value;
                        statusText = originalStatusText.toLowerCase().replace(/\s+/g, '');
                    }

                    if (pjtName.toLowerCase().replace(/\s+/g, '').includes(query) || statusText.includes(query)) {
                        matchedProjects.push({ name: pjtName, reason: pjtName.toLowerCase().replace(/\s+/g, '').includes(query) ? "프로젝트명 일치" : `상태 일치 (${originalStatusText})` });
                        pjtAdded = true;
                    }

                    doc.querySelectorAll('.stakeholder-tile').forEach(tile => {
                        const inputs = tile.querySelectorAll('input[type="text"]');
                        if(inputs.length >= 3) {
                            const type = inputs[0].value || inputs[0].placeholder || "";
                            const company = inputs[1].value || inputs[1].placeholder || "";
                            const person = inputs[2].value || inputs[2].placeholder || "";
                            const deptSelect = tile.querySelector('select');
                            const dept = deptSelect ? deptSelect.value : "";
                            const insightTextarea = tile.querySelector('textarea');
                            const insight = insightTextarea ? insightTextarea.value : "";

                            if(`${type} ${company} ${person} ${dept} ${insight}`.toLowerCase().replace(/\s+/g, '').includes(query)) {
                                matchedStakeholders.push({
                                    pjtName: pjtName, type: type, company: company, person: person,
                                    dept: dept === '없음' || dept === '담당 부서 선택' ? '-' : dept
                                });
                                if(!pjtAdded) { matchedProjects.push({ name: pjtName, reason: "관련 담당자/업체 검색됨" }); pjtAdded = true; }
                            }
                        }
                    });
                }
                renderSearchResults(matchedProjects, matchedStakeholders);
            }, 50); 
        };

        function renderSearchResults(projects, stakeholders) {
            const contentArea = document.getElementById('smartSearchResultContent');
            if (projects.length === 0 && stakeholders.length === 0) {
                contentArea.innerHTML = '<div class="text-center py-10 text-slate-500"><i class="fas fa-search-minus text-4xl mb-3 opacity-50"></i><p>검색 결과가 없습니다.</p></div>';
                return;
            }

            let html = '';
            if (stakeholders.length > 0) {
                html += `<div><h4 class="text-sm font-bold text-brand-cyan mb-3 flex items-center"><i class="fas fa-users mr-2"></i>매칭된 이해관계자 / 업체 (${stakeholders.length}건)</h4><div class="space-y-2">`;
                stakeholders.forEach(sh => {
                    html += `
                        <div onclick="goToProjectFromSearch('${sh.pjtName.replace(/'/g, "\\'")}')" class="bg-slate-900/50 hover:bg-slate-800 border border-slate-700 hover:border-brand-cyan p-3 rounded-xl cursor-pointer transition-all group flex items-center justify-between">
                            <div>
                                <div class="flex items-center gap-2 mb-1"><span class="text-[10px] bg-brand-cyan/20 text-brand-cyan px-2 py-0.5 rounded font-bold">${sh.type || '업체'}</span><span class="text-xs text-slate-400"><i class="fas fa-folder-open mr-1"></i> ${sh.pjtName}</span></div>
                                <div class="text-sm font-bold text-white">${sh.company} <span class="text-slate-400 font-normal mx-1">|</span> ${sh.person} <span class="text-xs text-brand-blue ml-2"><i class="fas fa-network-wired mr-1"></i>${sh.dept}</span></div>
                            </div>
                            <i class="fas fa-chevron-right text-slate-600 group-hover:text-brand-cyan transition-colors"></i>
                        </div>`;
                });
                html += `</div></div>`;
            }

            if (projects.length > 0) {
                if(stakeholders.length > 0) html += `<div class="w-full h-px bg-slate-700 my-4"></div>`;
                html += `<div><h4 class="text-sm font-bold text-brand-blue mb-3 flex items-center"><i class="fas fa-project-diagram mr-2"></i>관련 프로젝트 목록 (${projects.length}건)</h4><div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
                projects.forEach(p => {
                    html += `
                        <div onclick="goToProjectFromSearch('${p.name.replace(/'/g, "\\'")}')" class="bg-slate-900/50 hover:bg-slate-800 border border-slate-700 hover:border-brand-blue p-4 rounded-xl cursor-pointer transition-all group flex items-center justify-between">
                            <div><div class="text-[15px] font-bold text-white mb-1">${p.name}</div><div class="text-[10px] text-slate-400"><i class="fas fa-check text-green-400 mr-1"></i>${p.reason}</div></div>
                            <div class="w-8 h-8 rounded-full bg-slate-800 group-hover:bg-brand-blue flex items-center justify-center transition-colors shrink-0"><i class="fas fa-external-link-alt text-slate-400 group-hover:text-white transition-colors text-xs"></i></div>
                        </div>`;
                });
                html += `</div></div>`;
            }
            contentArea.innerHTML = html;
        }

        window.goToProjectFromSearch = function(pjtName) {
            closeSmartSearchModal();
            const links = document.querySelectorAll('.pjt-link');
            let found = false;
            for (let link of links) {
                if (link.getAttribute('data-pjt-name') === pjtName) { 
                    loadProject(pjtName, link.parentElement);
                    found = true; 
                    break; 
                }
            }
            if(!found) loadProject(pjtName, null);
        }

        window.closeSmartSearchModal = function() {
            const modal = document.getElementById('smartSearchModal');
            const inner = document.getElementById('smartSearchInner');
            if(modal && inner) {
                modal.classList.add('opacity-0'); inner.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
            const input = document.getElementById('pjtSearch');
            if(input) { input.value = ''; filterProjects(''); }
        }

        window.executePrint = function() {
            try {
                const title = document.getElementById('pjtTitle')?.value || '제목 없음';
                const status = document.getElementById('statusSelect')?.value || '';
                const targetValue = document.getElementById('val-target')?.value || "";
                const now = new Date();
                const printDate = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

                let statusBg = '#64748b';
                if(status.includes('완료')) statusBg = '#16a34a';
                if(status.includes('진행')) statusBg = '#ca8a04';
                if(status.includes('이슈')) statusBg = '#dc2626';

                const previewImage = document.getElementById('previewImage');
                const previewImageSrc = previewImage && !previewImage.classList.contains('hidden') ? previewImage.src : null;
                
                const overviewTiles = document.querySelectorAll('#overview-container .clickable-tile');
                let overviewHTML = '';
                overviewTiles.forEach((tile, index) => {
                    const inputs = tile.querySelectorAll('input[type="text"]');
                    const label = inputs[0]?.value || inputs[0]?.placeholder || '항목명';
                    let val = '';
                    if (inputs.length > 1) val = inputs[1].value || inputs[1].placeholder || '';
                    else {
                        const textarea = tile.querySelector('textarea');
                        val = textarea ? textarea.value || textarea.placeholder || '' : '';
                    }
                    const borderStyle = index === overviewTiles.length - 1 ? '' : 'border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; margin-bottom: 8px;';
                    overviewHTML += `<div style="${borderStyle}"><span style="color: #64748b; font-size: 9.5pt; font-weight: bold; display: block; margin-bottom: 4px;">${label}</span><div style="font-size: 10pt; font-weight: 500; color: #334155; white-space: pre-wrap; line-height: 1.5;">${val}</div></div>`;
                });

                const tamTiles = document.querySelectorAll('#tam-container .clickable-tile');
                let tamHTML = '';
                tamTiles.forEach(tile => {
                    const name = tile.querySelector('input[type="text"]')?.value || '';
                    const amountInputs = tile.querySelectorAll('input[type="text"]');
                    const amount = amountInputs.length > 1 ? amountInputs[1].value : '';
                    if(name) tamHTML += `<div style="flex: 1; background: #fff; border: 1px solid #cbd5e1; padding: 12px; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"><div style="color: #64748b; font-size: 9pt; margin-bottom: 4px; font-weight: bold;">${name}</div><div style="font-size: 14pt; font-weight: 900; color: #0f172a; text-align: right;">${amount} <span style="font-size: 10pt; font-weight: normal; color: #64748b;">억원</span></div></div>`;
                });

                const valueTiles = document.querySelectorAll('#value-container .clickable-tile');
                let valueHTML = '';
                valueTiles.forEach(tile => {
                    const nameInput = tile.querySelector('input[type="text"]');
                    const descTextarea = tile.querySelector('textarea');
                    const name = nameInput ? (nameInput.value || nameInput.placeholder) : '';
                    const desc = descTextarea ? (descTextarea.value || descTextarea.placeholder) : '';
                    if(name && name !== '새로운 제안 가치') {
                        valueHTML += `<div style="margin-bottom: 12px; background: #f8fafc; padding: 10px; border-radius: 6px; border-left: 3px solid #3b82f6;"><strong style="color: #1d4ed8; display: block; font-size: 10.5pt; margin-bottom: 4px;">${name}</strong><div style="font-size: 9.5pt; color: #475569; line-height: 1.4; white-space: pre-wrap;">${desc}</div></div>`;
                    }
                });
                if(!valueHTML) valueHTML = '<p style="color: #888; font-style: italic; font-size: 10pt;">입력된 데이터 없음</p>';

                const stakeholderTiles = document.querySelectorAll('#stakeholder-container .clickable-tile');
                let shHTML = '';
                stakeholderTiles.forEach(tile => {
                    const typeInput = tile.querySelector('input[type="text"]');
                    const companyInput = tile.querySelectorAll('input[type="text"]')[1];
                    const personInput = tile.querySelectorAll('input[type="text"]')[2];
                    const deptSelect = tile.querySelector('select');
                    const insightTextarea = tile.querySelector('textarea');

                    const type = typeInput ? (typeInput.value || typeInput.placeholder) : '';
                    const company = companyInput ? (companyInput.value || companyInput.placeholder) : '';
                    const person = personInput ? (personInput.value || personInput.placeholder) : '';
                    const dept = deptSelect ? deptSelect.value : '-';
                    const insight = insightTextarea ? (insightTextarea.value || insightTextarea.placeholder) : '';

                    if(type || company) shHTML += `<tr style="border-bottom: 1px solid #e2e8f0; page-break-inside: avoid;"><td style="padding: 10px; font-size: 9.5pt; font-weight: 700; color: #334155; background: #f8fafc; border-right: 1px solid #e2e8f0; text-align: center;">${type}</td><td style="padding: 10px; font-size: 10pt; font-weight: 800; color: #0f172a; border-right: 1px solid #e2e8f0; text-align: center;">${company}</td><td style="padding: 10px; font-size: 9.5pt; color: #334155; border-right: 1px solid #e2e8f0; text-align: center;">${person}</td><td style="padding: 10px; font-size: 9.5pt; color: #0284c7; font-weight: 800; border-right: 1px solid #e2e8f0; text-align: center;">${dept !== '없음' && dept !== '담당 부서 선택' ? dept : '-'}</td><td style="padding: 10px; font-size: 9.5pt; line-height: 1.5; color: #475569; white-space: pre-wrap; text-align: left;">${insight}</td></tr>`;
                });
                if(!shHTML) shHTML = '<tr><td colspan="5" style="text-align: center; padding: 15px; color: #888; font-style: italic; font-size: 10pt;">입력된 데이터 없음</td></tr>';

                const historyTiles = document.querySelectorAll('#history-container > div');
                let historyHTML = '';
                historyTiles.forEach(tile => {
                    const date = tile.querySelector('input[type="date"]')?.value || '';
                    const content = tile.querySelector('textarea')?.value || '';
                    if(date && content) historyHTML += `<div style="margin-bottom: 12px; padding-left: 12px; border-left: 2px solid #cbd5e1; position: relative; page-break-inside: avoid;"><div style="position: absolute; left: -5px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;"></div><div style="font-weight: 800; font-size: 9.5pt; color: #0284c7; margin-bottom: 3px;">${date}</div><div style="font-size: 10pt; color: #334155; line-height: 1.5; white-space: pre-wrap;">${content}</div></div>`;
                });
                if(!historyHTML) historyHTML = '<p style="color: #888; font-style: italic; font-size: 10pt;">입력된 데이터 없음</p>';

                const riskTiles = document.querySelectorAll('#risk-container > div');
                let riskHTML = '';
                if(riskTiles && riskTiles.length > 0) {
                    riskTiles.forEach(tile => {
                        const textareas = tile.querySelectorAll('textarea');
                        const risk = textareas[0]?.value || '';
                        const strategy = textareas[1]?.value || '';
                        if(risk || strategy) {
                            riskHTML += `
                            <div style="margin-bottom: 12px; page-break-inside: avoid;">
                                <div style="background: #fef2f2; border-left: 4px solid #ef4444; padding: 12px; margin-bottom: 4px;">
                                    <strong style="color: #991b1b; display: block; margin-bottom: 4px;">Risk:</strong>
                                    <div style="font-size: 10.5pt; color: #450a0a; white-space: pre-wrap;">${risk}</div>
                                </div>
                                <div style="background: #f0fdf4; border-left: 4px solid #22c55e; padding: 12px;">
                                    <strong style="color: #166534; display: block; margin-bottom: 4px;">Strategy:</strong>
                                    <div style="font-size: 10.5pt; color: #052e16; white-space: pre-wrap;">${strategy}</div>
                                </div>
                            </div>`;
                        }
                    });
                }
                if(!riskHTML) {
                    riskHTML = '<p style="color: #888; font-style: italic; font-size: 10pt;">입력된 데이터 없음</p>';
                }

                document.getElementById('print-area').innerHTML = `
                    <div style="font-family: 'Pretendard', sans-serif; line-height: 1.5; color: #1e293b; font-size: 10pt; max-width: 100%; margin: 0 auto; padding: 20px;">
                        <div style="border-bottom: 3px solid #0f172a; padding-bottom: 15px; display: flex; justify-content: space-between; align-items: flex-end;">
                            <div>
                                <div style="font-size: 11pt; font-weight: 800; color: #3b82f6; margin-bottom: 5px;">전력솔루션영업부문</div>
                                <h1 style="font-size: 24pt; font-weight: 900; margin: 0; color: #0f172a; letter-spacing: -0.5px;">${title}</h1>
                            </div>
                            <div style="text-align: right;">
                                <div style="display: inline-block; padding: 6px 16px; background: ${statusBg}; color: white; font-weight: bold; border-radius: 20px; font-size: 11pt; margin-bottom: 8px;">${status}</div>
                                <div style="font-size: 9pt; color: #64748b;">Report Date: ${printDate}</div>
                            </div>
                        </div>
                        ${targetValue ? `<div style="background: #f0f9ff; border-left: 4px solid #0ea5e9; padding: 12px 16px; font-size: 12pt; border-radius: 0 8px 8px 0; margin: 20px 0; page-break-inside: avoid;"><strong style="color: #0284c7;">🎯 Target Goal:</strong> <span style="font-weight: 600; color: #0f172a;">${targetValue}</span></div>` : ''}
                        
                        <div style="display: table; width: 100%; margin-bottom: 30px;">
                            <div style="display: table-cell; width: 48%; vertical-align: top; padding-right: 2%;">
                                <h3 style="font-size: 13pt; font-weight: bold; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 12px;">📌 현장 조감도 및 개요</h3>
                                <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px;">${overviewHTML}</div>
                                <div style="border: 1px solid #e2e8f0; padding: 8px; text-align: center; border-radius: 8px; background: #fff;">${previewImageSrc ? `<img src="${previewImageSrc}" style="max-width: 100%; max-height: 200px; object-fit: contain;">` : `<div style="height: 100px; line-height: 100px; color: #94a3b8; font-size: 10pt;">이미지 없음</div>`}</div>
                            </div>
                            <div style="display: table-cell; width: 48%; vertical-align: top; padding-left: 2%;">
                                <div style="margin-bottom: 20px;">
                                    <h3 style="font-size: 13pt; font-weight: 800; color: #1e293b; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 12px;">💎 목표 매출</h3>
                                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">${tamHTML}</div>
                                </div>
                                <div style="margin-bottom: 20px; page-break-inside: avoid;">
                                    <h3 style="font-size: 13pt; font-weight: 800; color: #1e293b; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 12px;">🎯 핵심 제안 가치</h3>
                                    <div>${valueHTML}</div>
                                </div>
                            </div>
                        </div>

                        <div style="margin-bottom: 30px;">
                            <h3 style="font-size: 13pt; font-weight: bold; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 12px;">👥 의사결정권자 매핑</h3>
                            <table style="width: 100%; border-collapse: collapse; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px #e2e8f0;">
                                <thead>
                                    <tr style="background: #f1f5f9;">
                                        <th style="padding: 10px; border-bottom: 2px solid #cbd5e1; font-size: 10pt; font-weight: 800; text-align: center; width: 12%;">구분</th>
                                        <th style="padding: 10px; border-bottom: 2px solid #cbd5e1; font-size: 10pt; font-weight: 800; text-align: center; width: 18%;">업체명</th>
                                        <th style="padding: 10px; border-bottom: 2px solid #cbd5e1; font-size: 10pt; font-weight: 800; text-align: center; width: 16%;">담당자</th>
                                        <th style="padding: 10px; border-bottom: 2px solid #cbd5e1; font-size: 10pt; font-weight: 800; text-align: center; width: 14%;">부서</th>
                                        <th style="padding: 10px; border-bottom: 2px solid #cbd5e1; font-size: 10pt; font-weight: 800; text-align: left; width: 40%;">성향 및 Insight</th>
                                    </tr>
                                </thead>
                                <tbody>${shHTML}</tbody>
                            </table>
                        </div>

                        <div style="margin-bottom: 30px; page-break-inside: avoid;">
                            <h3 style="font-size: 13pt; font-weight: bold; color: #b91c1c; border-bottom: 2px solid #fca5a5; padding-bottom: 5px; margin-bottom: 12px;">🚨 Critical Risk & Strategy</h3>
                            ${riskHTML}
                        </div>

                        <h3 style="font-size: 13pt; font-weight: bold; color: #0f172a; border-bottom: 2px solid #cbd5e1; padding-bottom: 5px; margin-bottom: 12px;">📝 진행 현황</h3>
                        <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px;">${historyHTML}</div>
                    </div>`;
                setTimeout(() => { window.print(); }, 100);
            } catch (error) { console.error(error); }
        }

        document.addEventListener('keydown', function(e) {
            const isMac = window.navigator.platform.match("Mac");
            const cmdKey = isMac ? e.metaKey : e.ctrlKey;
            
            if (cmdKey && e.key === 's') { e.preventDefault(); triggerAutoSave(); }
            if (cmdKey && e.key === 'z') {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag !== 'input' && activeTag !== 'textarea' && deletedNodeInfo) { e.preventDefault(); undoDelete(); }
            }

            if (e.key === 'Escape') {
                const smartSearchModal = document.getElementById('smartSearchModal');
                if (smartSearchModal && !smartSearchModal.classList.contains('hidden')) closeSmartSearchModal();
                
                const detailModal = document.getElementById('detailModal');
                if (detailModal && !detailModal.classList.contains('hidden')) closeModal();
                
                const imageModal = document.getElementById('imageModal');
                if (imageModal && !imageModal.classList.contains('hidden')) closeImageModal();
                
                const trashModal = document.getElementById('trashModal');
                if (trashModal && !trashModal.classList.contains('hidden')) closeTrashModal();
            }
        }, false);
    </script>
</body>
</html>
