<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mega PJT 관리 시스템</title>
    
    <meta property="og:title" content="📊 Mega PJT 파이프라인 통합 대시보드">
    <meta property="og:description" content="전력솔루션영업부문 핵심 PJT 실시간 현황 및 의사결정권자 매핑 시스템입니다.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1200&auto=format&fit=crop">
    <meta property="og:type" content="website">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { slate: { 850: '#151e2e', 900: '#0f172a' }, brand: { blue: '#3b82f6', cyan: '#06b6d4', red: '#ef4444' } } }
            }
        }
    </script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        
        input, textarea, select { 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(59, 130, 246, 0.3); color: #fff; width: 100%; border-radius: 0.375rem; padding: 0.25rem 0.5rem; outline: none; transition: all 0.2s;
        }
        input:focus, textarea:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 5px rgba(59, 130, 246, 0.5); }
        
        /* 🔥 안내 문구(Placeholder) 15% 투명도 및 기울임꼴 적용 🔥 */
        ::-webkit-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        ::-moz-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        :-ms-input-placeholder { color: rgba(255, 255, 255, 0.15) !important; font-weight: 200 !important; font-style: italic !important; letter-spacing: -0.5px; }
        
        .clickable-tile { cursor: pointer; transition: all 0.2s ease; }
        .clickable-tile:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15); transform: translateY(-2px); }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* ==========================================================
           🔥 [최종 결전] 인쇄 엔진: 화면 숨김 + 전용 보고서 폼 표시 🔥
           ========================================================== */
        @media print {
            @page { size: A4 portrait; margin: 10mm 15mm; }
            
            /* 기존 화면 전체 100% 숨김 (충돌 원천 차단) */
            #main-wrapper, #sidebar, #detailModal, #trashModal, #imageModal { 
                display: none !important; 
            }
            
            /* 숨겨져 있던 인쇄용 A4 폼만 표시 */
            #print-area { 
                display: block !important; 
            }

            /* 배경 통제 */
            body, html {
                background: white !important;
                color: black !important;
                height: auto !important;
                overflow: visible !important;
            }
            
            /* 꼬리표 같은 링크 URL 출력 방지 */
            a[href]:after { content: none !important; }
        }

        /* 드래그 앤 드롭 효과 */
        .stakeholder-tile { cursor: grab; }
        .stakeholder-tile:active { cursor: grabbing; }
        .stakeholder-tile.drag-over { border: 2px dashed #3b82f6; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100" data-current-pjt="">

    <!-- 기존 메인 대시보드 뷰 (인쇄 시 숨겨짐) -->
    <div id="main-wrapper" class="flex h-screen w-full overflow-hidden">
        
        <aside id="sidebar" class="w-64 bg-slate-900 border-r border-slate-700 hidden md:flex flex-col shrink-0 z-20">
            <div class="h-16 flex items-center px-6 border-b border-slate-700">
                <i class="fas fa-bolt text-brand-blue text-xl mr-3"></i>
                <span class="font-extrabold text-[15px] tracking-wide text-white">전력솔루션영업부문</span>
            </div>
            <div class="p-4 flex-1 overflow-y-auto relative">
                <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Main Menu</div>
                <nav class="space-y-1">
                    <div class="space-y-1">
                        <button onclick="togglePjtMenu()" class="w-full flex justify-between items-center px-3 py-2.5 bg-brand-blue/10 text-brand-blue rounded-lg font-bold transition-colors">
                            <div class="flex items-center"><i class="fas fa-chart-pie w-5 mr-2"></i> PJT 대시보드</div>
                            <i id="pjtChevron" class="fas fa-chevron-down text-xs transition-transform duration-200 transform rotate-180"></i>
                        </button>
                        <div id="pjtSubMenu" class="pl-9 pr-2 py-2 space-y-3">
                            <div id="loadingSidebar" class="text-slate-500 text-xs py-4 text-center"><i class="fas fa-spinner fa-spin mr-1"></i> DB 연결 중...</div>
                        </div>
                    </div>
                </nav>
            </div>
        </aside>

        <main id="scroll-main" class="flex-1 flex flex-col h-screen overflow-hidden relative">
            <header class="h-16 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 flex items-center justify-between px-4 lg:px-6 shrink-0 z-10">
                <div class="flex items-center">
                    <button class="md:hidden text-slate-300 hover:text-white mr-4" onclick="document.getElementById('sidebar').classList.toggle('hidden')">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                    <h1 class="font-bold text-lg text-white hidden sm:block">Mega PJT 파이프라인 관리</h1>
                </div>
                
                <div class="flex gap-2 items-center">
                    <div class="hidden sm:flex items-center bg-slate-900/80 border border-slate-700 rounded-full px-3 py-1.5 mr-2 shadow-inner" title="현재 이 대시보드를 보고 있는 팀원 수입니다.">
                        <span class="relative flex h-2.5 w-2.5 mr-2">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                        </span>
                        <span class="text-xs font-bold text-slate-300">접속자: <span id="activeUsersCount" class="text-green-400 mx-0.5 text-sm font-extrabold">1</span>명</span>
                    </div>

                    <button id="saveBtn" onclick="saveDataToCloud()" class="bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white text-sm px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 shadow-lg transition-all hover:-translate-y-0.5 border border-green-500" title="단축키: Ctrl + S">
                        <i class="fas fa-save text-lg"></i> <span class="hidden sm:inline">저장</span>
                    </button>
                    <button onclick="executePrint()" class="bg-slate-700 hover:bg-slate-600 text-white text-sm px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 shadow-lg transition-all hover:-translate-y-0.5 border border-slate-500">
                        <i class="fas fa-print text-lg"></i> <span class="hidden sm:inline">출력</span>
                    </button>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-4 lg:p-8 bg-slate-850 relative">
                <div class="max-w-7xl mx-auto">
                    <div id="sync-area" class="transition-opacity duration-300 opacity-30">
                        
                        <div class="mb-8 flex flex-col md:flex-row justify-between items-start">
                            <div class="w-full">
                                <div class="flex items-center gap-3 mb-2">
                                    <select id="statusSelect" onchange="updateStatusColor(this)" class="w-48 text-xs font-bold bg-yellow-500/20 text-yellow-400 border border-yellow-500/50 rounded-full px-2 py-1 cursor-pointer transition-colors">
                                        <option value="완료">완료</option>
                                        <option value="진행 중" selected>진행 중</option>
                                        <option value="이슈 발생">이슈 발생</option>
                                    </select>
                                </div>
                                <input type="text" id="pjtTitle" value="" placeholder="데이터를 불러오는 중입니다..." onchange="renameFromTitle(this)" onkeydown="if(event.key==='Enter') this.blur();" class="text-3xl md:text-4xl font-extrabold text-white tracking-tight bg-transparent border-none w-full mb-2 h-12 px-0 hover:bg-white/5 transition-colors cursor-text rounded-md" title="클릭하여 프로젝트 이름 변경">
                                
                                <div class="flex items-center text-brand-cyan w-full mt-2">
                                    <i class="fas fa-bullseye mr-2 shrink-0 text-lg"></i>
                                    <input type="text" value="Target:" class="preserve-val text-brand-cyan text-base font-bold bg-transparent border-none p-0 focus:ring-0 shadow-none w-16 md:w-20">
                                    <input type="text" value="" placeholder="예: 가온 GP커넥터 + ACF 케이블 통합 솔루션 벤더 등록" class="text-slate-300 text-base md:text-lg w-full border-none bg-transparent hover:bg-white/5 transition-colors px-2 py-1 rounded-md">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
                            
                            <div class="flex flex-col gap-6">
                                <section class="glass-panel rounded-2xl p-5 shadow-2xl relative">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-image text-brand-blue shrink-0"></i>
                                            <input type="text" value="현장 조감도 및 개요" class="preserve-val text-lg font-bold text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full m-0 shadow-none hover:bg-white/5 px-2 rounded-md">
                                        </h2>
                                        <button onclick="addOverviewTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 세부항목 추가
                                        </button>
                                    </div>
                                    
                                    <div class="w-full h-48 bg-slate-800 rounded-xl border-2 border-dashed border-slate-600 flex flex-col items-center justify-center relative overflow-hidden group hover:border-brand-blue transition-colors">
                                        <div id="uploadPlaceholder" class="flex flex-col items-center justify-center z-10 p-4 w-full h-full cursor-pointer bg-slate-800/80 hover:bg-slate-800/90 transition-all" onclick="document.getElementById('imageUpload').click()">
                                            <i class="fas fa-camera text-3xl text-slate-400 mb-2 group-hover:text-brand-blue transition-colors"></i>
                                            <span class="text-xs text-slate-300 text-center">클릭하여 사진 첨부<br>(로컬 파일 첨부)</span>
                                        </div>
                                        
                                        <img id="previewImage" src="" alt="현장 조감도" class="absolute inset-0 w-full h-full object-cover hidden z-0 cursor-pointer" onclick="openImageModal()">
                                        
                                        <button id="changeImgBtn" onclick="document.getElementById('imageUpload').click()" class="absolute top-2 right-2 bg-slate-900/80 hover:bg-brand-blue text-white px-3 py-1.5 rounded-lg text-xs font-bold hidden z-20 transition-colors shadow-lg border border-slate-600">
                                            <i class="fas fa-sync-alt mr-1"></i> 변경
                                        </button>
                                        
                                        <div id="zoomHintIcon" class="absolute bottom-2 right-2 bg-black/60 text-white p-2 rounded-lg hidden z-10 pointer-events-none">
                                            <i class="fas fa-search-plus"></i>
                                        </div>

                                        <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="previewFile(event)">
                                    </div>

                                    <div id="overview-container" class="mt-4 grid grid-cols-2 gap-3">
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <input type="text" value="💰 총 투자 규모" class="preserve-val text-[11px] font-semibold text-brand-cyan mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1">
                                            <input type="text" value="" placeholder="예: 15조 원" class="text-lg font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 rounded-md px-1">
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <input type="text" value="📅 진행 기간" class="preserve-val text-[11px] font-semibold text-purple-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1">
                                            <input type="text" value="" placeholder="예: 2025.Q3 ~ 2027.Q4" class="text-[13px] font-bold text-white bg-transparent border-none p-0 focus:ring-0 w-full mt-1 hover:bg-white/5 rounded-md px-1">
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="col-span-2 clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <input type="text" value="🎯 타겟 시공 구역" placeholder="항목명 (예: 🎯 타겟 시공 구역)" class="preserve-val text-[11px] font-semibold text-blue-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full shadow-none hover:bg-white/5 rounded-md px-1">
                                            <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 클린룸 상층부 및 서브스테이션 배관/배선망 구축 구간" class="text-sm text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full resize-none overflow-hidden hover:bg-white/5 rounded-md px-1"></textarea>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                        </div>
                                    </div>
                                </section>

                                <section class="glass-panel rounded-2xl p-5 shadow-2xl">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-chart-pie text-brand-blue shrink-0"></i>
                                            <input type="text" value="목표 매출" class="preserve-val text-lg font-bold text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full m-0 shadow-none hover:bg-white/5 px-2 rounded-md">
                                        </h2>
                                        <button onclick="addTamTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 추가
                                        </button>
                                    </div>
                                    <div id="tam-container" class="grid grid-cols-2 gap-4">
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/50 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            <input type="text" value="" placeholder="항목 (예: 배관 자재)" class="text-sm font-semibold text-slate-300 mb-1 w-full bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded">
                                            <div class="flex items-center">
                                                <input type="text" value="" placeholder="예: 35" class="text-lg font-bold text-white w-full text-right bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><span class="text-sm text-slate-500 ml-1">억원</span>
                                            </div>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile bg-slate-800/50 p-3 rounded-lg border border-slate-700 relative group">
                                            <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            <input type="text" value="" placeholder="항목 (예: ACF 케이블)" class="text-sm font-semibold text-slate-300 mb-1 w-full bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded">
                                            <div class="flex items-center">
                                                <input type="text" value="" placeholder="예: 82" class="text-lg font-bold text-white w-full text-right bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><span class="text-sm text-slate-500 ml-1">억원</span>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                                
                                <section class="glass-panel rounded-2xl p-5 shadow-2xl relative">
                                    <div class="flex justify-between items-center mb-4 gap-4">
                                        <h2 class="text-lg font-bold text-slate-200 flex items-center gap-2 w-full">
                                            <i class="fas fa-shield-alt text-brand-blue shrink-0"></i>
                                            <input type="text" value="핵심 제안 가치" class="preserve-val text-lg font-bold text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full m-0 shadow-none hover:bg-white/5 px-2 rounded-md">
                                        </h2>
                                        <button onclick="addValueTile()" class="shrink-0 text-xs bg-brand-blue/20 hover:bg-brand-blue text-brand-blue hover:text-white px-3 py-1.5 rounded-lg border border-brand-blue/50 flex items-center gap-1 transition-colors relative z-10">
                                            <i class="fas fa-plus"></i> 추가
                                        </button>
                                    </div>
                                    <div id="value-container" class="space-y-4">
                                        <div onclick="openTileModal(this, event)" class="clickable-tile flex gap-4 items-start relative group p-3 -m-3 rounded-xl border border-transparent hover:bg-slate-800/30">
                                            <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <div class="w-8 h-8 rounded-full bg-brand-blue/20 flex items-center justify-center shrink-0 mt-1"><i class="fas fa-coins text-brand-blue text-xs pointer-events-none"></i></div>
                                            <div class="w-full pr-6 relative">
                                                <input type="text" value="" placeholder="가치명 (예: TCO 절감)" class="text-sm font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded-md">
                                                <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 무용접 원터치 체결(GP커넥터)로 시공 공기 70%, 현장 노무비 65% 혁신적 절감." class="text-xs text-slate-300 w-full resize-none border-none bg-transparent p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded-md"></textarea>
                                                <i class="fas fa-search-plus absolute bottom-0 right-0 text-brand-blue/50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            </div>
                                        </div>
                                        <div onclick="openTileModal(this, event)" class="clickable-tile flex gap-4 items-start relative group p-3 -m-3 rounded-xl border border-transparent hover:bg-slate-800/30">
                                            <button onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                                            <div class="w-8 h-8 rounded-full bg-green-500/20 flex items-center justify-center shrink-0 mt-1"><i class="fas fa-check-double text-green-400 text-xs pointer-events-none"></i></div>
                                            <div class="w-full pr-6 relative">
                                                <input type="text" value="" placeholder="가치명 (예: KEC 규정 완벽 대응)" class="text-sm font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded-md">
                                                <textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 진동 노출 구간 내 별도 접지(본딩) 생략 가능한 합법적 논리 적용." class="text-xs text-slate-300 w-full resize-none border-none bg-transparent p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded-md"></textarea>
                                                <i class="fas fa-search-plus absolute bottom-0 right-0 text-brand-blue/50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i>
                                            </div>
                                        </div>
                                    </div>
                                </section>
                            </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";

        // 🔥 [V2.0] 궁극의 별도 폼 인쇄 (Report Generator) 엔진 🔥
        function executePrint() {
            try {
                // 1. 기본 정보 추출
                const title = document.getElementById('pjtTitle')?.value || '제목 없음';
                const status = document.getElementById('statusSelect')?.value || '';
                const targetInputs = document.querySelectorAll('#sync-area .text-brand-cyan.w-full.mt-2 input[type="text"]');
                const target = targetInputs.length > 1 ? targetInputs[1].value : "";

                // 2. 개요 및 이미지 추출
                const previewImage = document.getElementById('previewImage');
                const previewImageSrc = previewImage && !previewImage.classList.contains('hidden') ? previewImage.src : null;
                
                const overviewTiles = document.querySelectorAll('#overview-container .clickable-tile');
                const investment = overviewTiles.length > 0 ? overviewTiles[0].querySelectorAll('input')[1]?.value || '' : '';
                const timeline = overviewTiles.length > 1 ? overviewTiles[1].querySelectorAll('input')[1]?.value || '' : '';
                const targetZone = overviewTiles.length > 2 ? overviewTiles[2].querySelector('textarea')?.value || '' : '';

                // 3. TAM 데이터 추출 
                const tamTiles = document.querySelectorAll('#tam-container .clickable-tile');
                let tamHTML = '';
                tamTiles.forEach(tile => {
                    const name = tile.querySelectorAll('input')[0]?.value || '';
                    const amount = tile.querySelectorAll('input')[1]?.value || '';
                    const unit = tile.querySelector('span')?.innerText || '';
                    if(name) {
                        tamHTML += `
                        <div style="background: #fff; border: 1px solid #e2e8f0; padding: 10px 12px; border-radius: 6px;">
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 4px; font-weight: bold;">${name}</div>
                            <div style="font-size: 16px; font-weight: 900; color: #0f172a;">${amount} <span style="font-size: 12px; font-weight: normal; color: #64748b;">${unit}</span></div>
                        </div>`;
                    }
                });
                if(!tamHTML) tamHTML = '<div style="color: #888; font-style: italic; font-size: 13px;">입력된 데이터 없음</div>';

                // 4. 핵심 제안 가치 추출
                const valueTiles = document.querySelectorAll('#value-container .clickable-tile');
                let valueHTML = '';
                valueTiles.forEach(tile => {
                    const name = tile.querySelector('input')?.value || '';
                    const desc = tile.querySelector('textarea')?.value || '';
                    if(name) {
                        valueHTML += `
                        <div style="margin-bottom: 16px; padding-left: 12px; border-left: 3px solid #3b82f6;">
                            <strong style="color: #1d4ed8; display: block; font-size: 14px; margin-bottom: 4px;">${name}</strong>
                            <div style="font-size: 13px; color: #334155; line-height: 1.5; white-space: pre-wrap;">${desc}</div>
                        </div>`;
                    }
                });
                if(!valueHTML) valueHTML = '<p style="color: #888; font-style: italic; font-size: 13px;">입력된 데이터 없음</p>';

                // 5. 의사결정권자 매핑 테이블 추출 
                const stakeholderTiles = document.querySelectorAll('#stakeholder-container .clickable-tile');
                let shHTML = '';
                stakeholderTiles.forEach(tile => {
                    const inputs = tile.querySelectorAll('input[type="text"]');
                    const type = inputs[0]?.value || '';
                    const company = inputs[1]?.value || '';
                    const person = inputs[2]?.value || '';
                    const dept = tile.querySelector('select')?.value || '없음';
                    const insight = tile.querySelector('textarea')?.value || '';
                    
                    if(type || company) {
                        shHTML += `

        function simulateActiveUsers() {

                setInterval(() => {
                    if(Math.random() > 0.5) {
                        currentCount = Math.max(1, currentCount + (Math.random() > 0.5 ? 1 : -1));
                        if(currentCount > 4) currentCount = 3;
                        countEl.innerText = currentCount;
                    }
                }, 15000); 
            }

        function sortHistory() {
            const container = document.getElementById('history-container');
            if (!container) return;
            const tiles = Array.from(container.children);
            tiles.sort((a, b) => {
                const inputA = a.querySelector('input[type="date"]');
                const inputB = b.querySelector('input[type="date"]');
                const dateA = inputA ? inputA.value : "";
                const dateB = inputB ? inputB.value : "";
                return dateB.localeCompare(dateA); 
            });
            tiles.forEach(tile => container.appendChild(tile));
        }

        window.onload = async function() { 
            const syncArea = document.getElementById('sync-area');
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-lg"></i> <span class="hidden sm:inline">DB 연결 중...</span>';

            simulateActiveUsers();

            try {
                const response = await fetch(WEB_APP_URL + "?t=" + new Date().getTime());
                if (!response.ok) throw new Error("네트워크 응답이 정상이 아닙니다.");
                const textData = await response.text();
                try {
                    const data = JSON.parse(textData);
                    if (data && !data.error && Object.keys(data).length > 0) {
                        appDB = data;
                        if (appDB['_CONFIG_ORDER_']) {
                            let validOrder = JSON.parse(appDB['_CONFIG_ORDER_']);
                            let hasGhost = false;
                            Object.keys(appDB).forEach(k => {
                                if (k !== '_CONFIG_ORDER_' && !k.startsWith('_DELETED_::') && !validOrder.includes(k)) {
                                    delete appDB[k]; hasGhost = true;
                                }
                            });
                            if (hasGhost) fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify(appDB) }).catch(e => console.log(e));
                        }
                    }
                } catch (parseError) { throw new Error("데이터 파싱 에러"); }
            } catch (e) {
                console.error("DB 로드 에러:", e);
                alert("🚨 DB 연결 실패. 빈 템플릿으로 시작합니다.");
            }

            renderSidebar();

            const firstPjtLink = document.querySelector('.pjt-link');
            if (firstPjtLink) loadProject(firstPjtLink.innerText, firstPjtLink);
            else loadProject('신규 프로젝트', null);

            btn.innerHTML = '<i class="fas fa-save text-lg"></i> <span class="hidden sm:inline">저장</span>';

            const content = document.getElementById('trashContent');

            for(let key in appDB) {
                if(key.startsWith('_DELETED_::')) {
                    hasItems = true;
                    const originalName = key.replace('_DELETED_::', '');
                    const safeName = originalName.replace(/'/g, "\\'");
                    content.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 mb-2">

                                <button onclick="permanentDeleteProject('${safeName}')" class="text-xs font-bold bg-brand-red/20 text-brand-red hover:bg-brand-red hover:text-white px-3 py-1.5 rounded transition-colors">영구삭제</button>

        function restoreProject(pjtName) {
            const trashKey = `_DELETED_::${pjtName}`;
            if(appDB[trashKey] !== undefined) {
                appDB[pjtName] = appDB[trashKey];
                delete appDB[trashKey];
                
                let order = [];
                if (appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']);
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && !k.startsWith('_DELETED_::'));
                
                if (!order.includes(pjtName)) {
                    order.push(pjtName);
                    appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                }
                renderSidebar();
                saveDataToCloud();
                openTrashModal();
                
                setTimeout(() => {
                    const links = document.querySelectorAll('.pjt-link');
                    for(let link of links) {
                        if(link.innerText === pjtName) { link.click(); break; }
                    }
                    closeTrashModal();
                }, 100);
            }

            const trashKey = `_DELETED_::${pjtName}`;
            delete appDB[trashKey];
            saveDataToCloud();
            openTrashModal();
        }

        function commitCurrentState() {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (!currentPjt || currentPjt === 'DELETED_TEMP') return;

            const syncArea = document.getElementById('sync-area');
            syncArea.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            syncArea.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            
            // 🔥 Select 박스의 현재 선택 값을 HTML 태그 속성에 명시적으로 기록 🔥
            syncArea.querySelectorAll('select').forEach(el => {
                const selectedValue = el.value;
                Array.from(el.options).forEach(opt => {
                    if (opt.value === selectedValue) {
                        opt.setAttribute('selected', 'selected');
                    } else {
                        opt.removeAttribute('selected');
                    }
                });
            });

            appDB[currentPjt] = syncArea.innerHTML;
        }

        async function saveDataToCloud() {
            const btn = document.getElementById('saveBtn');
            const originalContent = '<i class="fas fa-save text-lg"></i> <span class="hidden sm:inline">저장</span>';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-white text-lg"></i> <span class="hidden sm:inline">서버에 동기화 중...</span>';
            
            commitCurrentState();
            
            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(appDB)
                });
                btn.innerHTML = '<i class="fas fa-check text-green-400 text-lg"></i> <span class="hidden sm:inline text-green-400">저장 완료</span>';
                btn.classList.replace('border-slate-500', 'border-green-400');
            } catch (err) {
                alert('저장 중 통신 오류가 발생했습니다.');
            } finally {
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.classList.replace('border-green-400', 'border-slate-500');
                }, 2000);
            }
        }

                e.preventDefault(); saveDataToCloud();   
            }
        }, false);

        function renameProjectLogic(oldName, newName) {
            if (appDB[oldName] !== undefined) {
                appDB[newName] = appDB[oldName];
                delete appDB[oldName];
            } else {
                appDB[newName] = ""; 
            }

            if (appDB['_CONFIG_ORDER_']) {
                let order = JSON.parse(appDB['_CONFIG_ORDER_']);
                const idx = order.indexOf(oldName);
                if (idx !== -1) order[idx] = newName;
                else order.push(newName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            } else {

                    titleInput.value = newName;
                    titleInput.setAttribute('value', newName);

        function renameProject(oldName, btnElement) {

            newName = newName.trim();
            if (newName === oldName) return;
            
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        function renameFromTitle(inputEl) {
            const oldName = document.body.getAttribute('data-current-pjt');
            const newName = inputEl.value.trim();
            
            if(!newName || newName === oldName) {
                inputEl.value = oldName; 
                return; 
            }
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                inputEl.value = oldName;
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        let draggedItem = null;
        function dragStart(e) {
            if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'textarea' || e.target.tagName.toLowerCase() === 'select') {
                e.preventDefault();
                return;
            }
            draggedItem = e.currentTarget;
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', 'dragged'); 
            setTimeout(() => e.currentTarget.style.opacity = '0.4', 0);
        }
        function dragOver(e) {
            e.preventDefault();
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem && targetItem !== draggedItem) {
                targetItem.classList.add('drag-over');
            }
        }
        function drop(e) {
            e.preventDefault();
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem && targetItem !== draggedItem) {
                const container = targetItem.parentNode;
                const allItems = [...container.querySelectorAll('.stakeholder-tile')];
                const draggedIdx = allItems.indexOf(draggedItem);
                const targetIdx = allItems.indexOf(targetItem);
                
                if (draggedIdx < targetIdx) {
                    container.insertBefore(draggedItem, targetItem.nextSibling);
                } else {
                    container.insertBefore(draggedItem, targetItem);
                }
                saveDataToCloud(); 
            }
            if (draggedItem) draggedItem.style.opacity = '1';
            document.querySelectorAll('.stakeholder-tile').forEach(el => el.classList.remove('drag-over'));
        }
        document.addEventListener('dragend', (e) => {
            if(e.target.classList && e.target.classList.contains('stakeholder-tile')){
                e.target.style.opacity = '1';
                document.querySelectorAll('.stakeholder-tile').forEach(el => el.classList.remove('drag-over'));
            }
        });
        document.addEventListener('dragleave', (e) => {
            const targetItem = e.target.closest('.stakeholder-tile');
            if (targetItem) targetItem.classList.remove('drag-over');
        });

        function togglePjtMenu() {

        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 600;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const previewImage = document.getElementById('previewImage');
                    const placeholder = document.getElementById('uploadPlaceholder');
                    const changeBtn = document.getElementById('changeImgBtn');
                    const zoomHint = document.getElementById('zoomHintIcon');
                    
                    previewImage.src = dataUrl;
                    previewImage.setAttribute('src', dataUrl);
                    previewImage.classList.remove('hidden');
                    if(placeholder) placeholder.classList.add('hidden');
                    if(changeBtn) changeBtn.classList.remove('hidden');
                    if(zoomHint) zoomHint.classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

                bodyContent += `<div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700"><p class="text-xs text-purple-400 mb-1 font-bold tracking-wider">고객사 담당자</p><p class="text-lg font-bold text-white">${person}</p></div>`;
                if(contactDept && contactDept !== "없음" && contactDept !== "담당 부서 선택") {
                    bodyContent += `<div class="bg-slate-900/50 p-4 rounded-xl border border-brand-blue/30"><p class="text-xs text-brand-blue mb-1 font-bold tracking-wider">담당 부서</p><p class="text-lg font-bold text-white">${contactDept}</p></div>`;
                }
                bodyContent += `<div class="bg-slate-900/50 p-5 rounded-xl border border-slate-700"><p class="text-xs text-yellow-400 mb-2 font-bold tracking-wider">성향 및 Insight</p><p class="text-[15px] text-slate-200 leading-relaxed">${insight.replace(/\n/g, '<br>')}</p></div>`;
            }
            else if (tile.closest('#history-container')) {
                title = "진행 현황 상세";
                const date = inputs[0] ? inputs[0].value : "";
                const content = textareas[0] ? (textareas[0].value || textareas[0].placeholder) : "";
                
                bodyContent += `<div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700"><p class="text-xs text-brand-cyan mb-1 font-bold tracking-wider">기록 일자</p><p class="text-lg font-bold text-white">${date}</p></div>`;
                bodyContent += `<div class="bg-slate-900/50 p-5 rounded-xl border border-slate-700"><p class="text-xs text-yellow-400 mb-2 font-bold tracking-wider">진행 내용</p><p class="text-[15px] text-slate-200 leading-relaxed">${content.replace(/\n/g, '<br>')}</p></div>`;
            }
            else {
                if (inputs.length > 0 && inputs[0].value.trim() !== '') title = inputs[0].value;
                else if (inputs.length > 0 && inputs[0].placeholder) title = inputs[0].placeholder; 

                inputs.forEach((input, index) => {
                    if (index === 0) return;
                    const displayVal = input.value.trim() !== '' ? input.value : input.placeholder;
                    if (displayVal) {
                        bodyContent += `<div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700"><p class="text-xs text-brand-cyan mb-1 font-bold tracking-wider">세부 항목</p><p class="text-lg font-bold text-white">${displayVal}</p></div>`;
                    }
                });

                textareas.forEach((textarea) => {
                    const displayVal = textarea.value.trim() !== '' ? textarea.value : textarea.placeholder;
                    if (displayVal) {
                        bodyContent += `<div class="bg-slate-900/50 p-5 rounded-xl border border-slate-700"><p class="text-xs text-brand-cyan mb-2 font-bold tracking-wider">상세 설명 및 Insight</p><p class="text-[15px] text-slate-200 leading-relaxed">${displayVal.replace(/\n/g, '<br>')}</p></div>`;
                    }
                });
            }
            bodyContent += '</div>';

            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalContent').innerHTML = bodyContent;
            
            const modal = document.getElementById('detailModal');
            const modalInner = document.getElementById('modalInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); modalInner.classList.remove('scale-95'); }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            const modalInner = document.getElementById('modalInner');
            modal.classList.add('opacity-0'); modalInner.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        document.getElementById('detailModal').addEventListener('click', function(e) { if(e.target === this) closeModal(); });

        function addOverviewTile() {
            const container = document.getElementById('overview-container');
            const newTile = document.createElement('div');
            newTile.setAttribute('onclick', 'openTileModal(this, event)');
            newTile.className = 'col-span-2 clickable-tile bg-slate-800/60 p-3 rounded-lg border border-slate-700 relative group';
            newTile.innerHTML = `<button onclick="this.parentElement.remove()" class="no-print absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button><i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i><input type="text" placeholder="📌 추가 항목명 (예: 주요 시공 환경)" class="text-[11px] font-semibold text-blue-400 mb-1 block uppercase tracking-wider bg-transparent border-none p-0 focus:ring-0 w-full"><textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="세부 내용을 입력하세요." class="text-sm text-slate-200 bg-transparent border-none p-0 focus:ring-0 w-full resize-none overflow-hidden"></textarea>`;
            container.appendChild(newTile);
        }

        function addTamTile() {
            const container = document.getElementById('tam-container');
            const newTile = document.createElement('div');
            newTile.setAttribute('onclick', 'openTileModal(this, event)');
            newTile.className = 'clickable-tile bg-slate-800/50 p-3 rounded-lg border border-slate-700 relative group';
            newTile.innerHTML = `<button onclick="this.parentElement.remove()" class="no-print absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button><i class="fas fa-search-plus absolute bottom-2 right-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i><input type="text" placeholder="항목 (예: GP 커넥터)" class="text-sm font-semibold text-slate-300 mb-1 w-full bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><div class="flex items-center"><input type="text" placeholder="예: 15" class="text-lg font-bold text-white w-full text-right bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded"><span class="text-sm text-slate-500 ml-1">억원</span></div>`;
            container.appendChild(newTile);
        }

        function addValueTile() {
            const container = document.getElementById('value-container');
            const newTile = document.createElement('div');
            newTile.setAttribute('onclick', 'openTileModal(this, event)');
            newTile.className = 'clickable-tile flex gap-4 items-start relative group p-3 -m-3 rounded-xl border border-transparent hover:bg-slate-800/30';
            newTile.innerHTML = `<button onclick="this.parentElement.remove()" class="no-print absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button><div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center shrink-0 mt-1"><i class="fas fa-star text-slate-400 text-xs pointer-events-none"></i></div><div class="w-full pr-6 relative"><input type="text" placeholder="가치명 (예: 납기 리스크 최소화)" class="text-sm font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded-md"><textarea rows="2" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'" placeholder="예: 지스틸 직배송 연계를 통한 납기 지연 방지 전략." class="text-xs text-slate-300 w-full resize-none border-none bg-transparent p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded-md"></textarea><i class="fas fa-search-plus absolute bottom-0 right-0 text-brand-blue/50 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-xs"></i></div>`;
            container.appendChild(newTile);
        }

        function addStakeholderTile() {
            const container = document.getElementById('stakeholder-container');
            const colors = ['text-yellow-500', 'text-green-400', 'text-pink-400', 'text-orange-400', 'text-brand-cyan', 'text-indigo-400', 'text-rose-400'];
            const tileCount = container.children.length;
            const colorClass = colors[tileCount % colors.length];

            const newTile = document.createElement('div');
            newTile.setAttribute('draggable', 'true');
            newTile.setAttribute('ondragstart', 'dragStart(event)');
            newTile.setAttribute('ondragover', 'dragOver(event)');
            newTile.setAttribute('ondrop', 'drop(event)');
            newTile.setAttribute('onclick', 'openTileModal(this, event)');
            newTile.className = 'clickable-tile stakeholder-tile bg-slate-800 rounded-xl p-4 border border-slate-700 relative group';
            newTile.innerHTML = `
                <button onclick="this.parentElement.remove()" class="no-print absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                <i class="fas fa-grip-vertical absolute top-3 left-2 text-slate-600 opacity-0 group-hover:opacity-100 transition-opacity text-xs cursor-grab"></i>
                <i class="fas fa-search-plus absolute bottom-3 right-3 text-slate-500 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-sm"></i>
                <div class="pl-3">
                    <div class="flex justify-between items-center mb-2 gap-2 pr-8">
                        <input type="text" placeholder="구분 (예: 시공사)" class="text-xs font-semibold ${colorClass} bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 px-1 rounded">
                        <select class="dept-select text-[11px] font-medium bg-slate-800/50 text-slate-400 border border-slate-700 rounded px-2 py-1 focus:ring-0 cursor-pointer w-auto shrink-0 outline-none hover:bg-slate-700 hover:text-slate-300 transition-colors">
                            <option value="없음">담당 부서 선택</option>
                            <option value="건설">건설</option>
                            <option value="국내 플랜트">국내 플랜트</option>
                            <option value="해외 플랜트">해외 플랜트</option>
                            <option value="배선">배선</option>
                            <option value="배관">배관</option>
                        </select>
                    </div>
                    <input type="text" placeholder="업체명 (예: 대명GEC)" class="text-lg font-bold text-white mb-1 bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 px-1 rounded">
                    <div class="flex items-center mb-2">
                        <i class="fas fa-user-tie text-slate-500 mr-2 text-xs pointer-events-none"></i>
                        <input type="text" placeholder="고객사 담당자 (예: OOO 소장)" class="text-sm text-slate-300 bg-transparent border-none p-0 focus:ring-0 w-full hover:bg-white/5 px-1 rounded">
                    </div>
                    <textarea class="text-xs text-slate-400 w-full resize-none bg-transparent border-none p-0 focus:ring-0 overflow-hidden hover:bg-white/5 px-1 rounded" style="height: 2.6rem; line-height: 1.3rem;" placeholder="성향 및 Insight (예: 노무비 절감이 최대 KPI)"></textarea>
                </div>
            `;
            container.appendChild(newTile);
        }

        function addHistoryTile() {
            const container = document.getElementById('history-container');
            const today = new Date().toISOString().split('T')[0];
            const newTile = document.createElement('div');
            newTile.setAttribute('onclick', 'openTileModal(this, event)');
            newTile.className = 'flex gap-3 relative group bg-slate-800/40 p-3 rounded-xl border border-slate-700/50 hover:border-slate-600 transition-colors cursor-pointer clickable-tile';
            
            newTile.innerHTML = `
                <button onclick="this.parentElement.remove(); event.stopPropagation();" class="no-print absolute top-2 right-2 text-slate-500 hover:text-brand-red hidden group-hover:block z-10"><i class="fas fa-times"></i></button>
                <i class="fas fa-search-plus absolute bottom-2 right-2 text-brand-cyan opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-sm z-10"></i>
                <div class="w-2 h-2 rounded-full bg-brand-cyan shrink-0 mt-2"></div>
                <div class="w-full pr-6">
                    <input type="date" value="${today}" onchange="sortHistory()" class="text-xs font-bold text-brand-cyan bg-transparent border-none p-0 focus:ring-0 w-[120px] mb-1 hover:bg-white/5 rounded px-1 cursor-text pointer-events-auto">
                    <textarea class="text-sm text-slate-200 w-full resize-none bg-transparent border-none p-0 focus:ring-0 hover:bg-white/5 px-1 rounded pointer-events-auto cursor-text overflow-hidden h-[2.8rem] leading-[1.4rem]" placeholder="진행 내용을 입력하세요... (길게 적어도 2줄만 보이며 돋보기를 누르면 전체가 보입니다)"></textarea>
                </div>
            `;
            container.insertBefore(newTile, container.firstChild);
            sortHistory();
        }

        function addAttachmentTile() {
            const container = document.getElementById('attachment-container');
            const newTile = document.createElement('div');
            newTile.className = 'flex items-center gap-2 bg-slate-800/50 p-2 rounded-lg border border-slate-700 relative group';
            newTile.innerHTML = `
                <i class="fas fa-paperclip text-purple-400 ml-2 shrink-0"></i>
                <input type="text" placeholder="파일명 / 설명 (예: 회의록)" class="text-sm font-bold text-slate-200 bg-transparent border-none p-1 focus:ring-0 w-1/3 hover:bg-white/5 rounded">
                <input type="text" placeholder="여기에 Teams / OneDrive 공유 링크(URL)를 붙여넣으세요" class="text-sm text-blue-400 bg-transparent border-none p-1 focus:ring-0 w-full hover:bg-white/5 rounded">
                <button onclick="const url = this.previousElementSibling.value; if(url) window.open(url.startsWith('http') ? url : 'https://'+url, '_blank');" class="text-slate-400 hover:text-blue-400 px-2 shrink-0 cursor-pointer" title="링크 열기"><i class="fas fa-external-link-alt"></i></button>
                <button onclick="this.parentElement.remove()" class="no-print text-slate-500 hover:text-brand-red px-2 hidden group-hover:block shrink-0"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(newTile);
        }
    </script>
</body>
</html>
