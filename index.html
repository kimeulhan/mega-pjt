    <!-- 핵심 로직 스크립트 -->
    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxlrYrOJzxA9CX_r0L3OSXPACq7nI1IqGTqX34PYgQbCuRUaInepbJMG9If5HgX5TPUTQ/exec";
        const LOCAL_DB_KEY = "megaPjtAppDB_v1"; // 로컬 스토리지 DB 키
        
        let appDB = {};
        let updateTimes = {}; 
        let deletedNodeInfo = null;
        let toastTimeout = null;
        let draggedItem = null;
        
        const parser = new DOMParser();

        // 🔥 Dual-DB 로드 시스템 (클라우드 실패 시 로컬 스토리지 즉각 전환) 🔥
        window.onload = async function() { 
            const syncArea = document.getElementById('sync-area');
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-sm"></i> <span class="hidden sm:inline">연결 중</span>';
            
            let isCloudSuccess = false;

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000); // 4초 컷으로 빠른 전환
                const url = WEB_APP_URL + "?t=" + new Date().getTime();
                
                const response = await fetch(url, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP 에러: ${response.status}`);
                
                const textData = await response.text();
                if (textData && textData.trim().startsWith('<')) throw new Error("AUTH_ERROR"); // 권한 거부 시
                
                if (textData) {
                    const data = JSON.parse(textData);
                    if (data && !data.error) {
                        appDB = data;
                        isCloudSuccess = true;
                        localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(appDB)); // 클라우드 DB를 로컬에 동기화
                    }
                }
            } catch (e) { 
                console.warn("Cloud DB 로드 실패, Local Storage로 대체합니다.", e);
            }

            // 클라우드 실패 시 브라우저 내장 오프라인 DB(Local Storage)에서 데이터 구출
            if (!isCloudSuccess) {
                const localData = localStorage.getItem(LOCAL_DB_KEY);
                if (localData) {
                    try {
                        appDB = JSON.parse(localData);
                    } catch (e) {
                        console.error("로컬 데이터 파싱 에러");
                    }
                }
            }

            // 데이터 구조 처리 (공통)
            if (appDB['_UPDATED_TIMES_']) {
                try { updateTimes = JSON.parse(appDB['_UPDATED_TIMES_']); } catch(e) {}
            }
            if (appDB['_CONFIG_ORDER_']) {
                try {
                    let validOrder = JSON.parse(appDB['_CONFIG_ORDER_']);
                    for (let key in appDB) { 
                        if (key !== '_CONFIG_ORDER_' && key !== '_UPDATED_TIMES_' && !key.startsWith('_DELETED_::') && !validOrder.includes(key)) {
                            delete appDB[key]; 
                        }
                    }
                } catch(e) {}
            }
            
            renderSidebar();
            const firstLink = document.querySelector('.pjt-link');
            if (firstLink) loadProject(firstLink.innerText, firstLink);
            else loadProject('신규 프로젝트', null);
            
            syncArea.style.opacity = '1';
            
            if (isCloudSuccess) {
                btn.innerHTML = '<i class="fas fa-save text-sm"></i> <span class="hidden sm:inline">저장</span>';
            } else {
                // 오프라인 로컬 모드 UI 표시
                btn.innerHTML = '<i class="fas fa-hdd text-sm text-yellow-400"></i> <span class="hidden sm:inline text-yellow-400">로컬 모드</span>';
                setTimeout(() => {
                    const toast = document.getElementById('undoToast');
                    toast.innerHTML = `<i class="fas fa-wifi text-yellow-400"></i><span class="text-sm font-medium ml-2">보안망에 의해 클라우드 연결이 차단되어 오프라인 모드로 동작합니다.</span><button onclick="closeUndoToast()" class="text-slate-400 hover:text-white ml-4 pointer-events-auto cursor-pointer"><i class="fas fa-times"></i></button>`;
                    toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
                    setTimeout(() => closeUndoToast(), 5000);
                }, 1000);
            }
        };

        function renderSidebar() {

                </div>`;

            let order = [];
            try { 
                if(appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']); 
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && !k.startsWith('_DELETED_::')); 
            } catch(e) { 
                order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && !k.startsWith('_DELETED_::')); 
            }
            if (order.length === 0 && !appDB.hasOwnProperty('_CONFIG_ORDER_')) order = ['삼성전자 평택 5공장', 'SK하이닉스 용인 클러스터', '삼성전자 기흥 NRD-K'];
            
            let menuHTML = '';
            order.forEach(pjtName => {
                if(pjtName === '_CONFIG_ORDER_' || pjtName === '_UPDATED_TIMES_' || pjtName.startsWith('_DELETED_::')) return;
                const safeName = pjtName.replace(/'/g, "\\'");
                menuHTML += `<div class="flex justify-between items-center group pjt-item-wrap"><a href="#" onclick="loadProject('${safeName}', this); event.preventDefault();" class="pjt-link block text-sm text-slate-400 hover:text-white transition-colors relative before:content-[''] before:absolute before:-left-4 before:top-1.5 before:w-2 before:h-2 before:bg-slate-600 before:rounded-full w-full truncate pr-2">${pjtName}</a><div class="hidden group-hover:flex items-center gap-2 shrink-0 bg-slate-900 pl-2"><button onclick="moveProjectUp(this); event.stopPropagation();" class="text-slate-500 hover:text-white"><i class="fas fa-arrow-up text-[10px]"></i></button><button onclick="moveProjectDown(this); event.stopPropagation();" class="text-slate-500 hover:text-white"><i class="fas fa-arrow-down text-[10px]"></i></button><button onclick="renameProject('${safeName}', this); event.stopPropagation();" class="text-slate-500 hover:text-brand-cyan"><i class="fas fa-edit text-[10px]"></i></button><button onclick="deleteProject('${safeName}', this); event.stopPropagation();" class="text-slate-500 hover:text-brand-red"><i class="fas fa-trash text-[10px]"></i></button></div></div>`;
            });
            menu.innerHTML = menuHTML + addBtnHTML;
        }

        function togglePjtMenu() {
            const menu = document.getElementById('pjtSubMenu');
            const chevron = document.getElementById('pjtChevron');
            menu.classList.toggle('hidden');
            chevron.classList.toggle('rotate-180');
        }

        function moveProjectUp(btnElement) {
            const currentItem = btnElement.closest('.pjt-item-wrap');
            const prevItem = currentItem.previousElementSibling;
            if (prevItem && prevItem.classList.contains('pjt-item-wrap')) {
                currentItem.parentNode.insertBefore(currentItem, prevItem);
                const links = document.querySelectorAll('.pjt-link');
                const order = Array.from(links).map(link => link.innerText);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                saveDataToCloud(); 
            }
        }

        function moveProjectDown(btnElement) {
            const currentItem = btnElement.closest('.pjt-item-wrap');
            const nextItem = currentItem.nextElementSibling;
            if (nextItem && nextItem.classList.contains('pjt-item-wrap')) {
                currentItem.parentNode.insertBefore(nextItem, currentItem);
                const links = document.querySelectorAll('.pjt-link');
                const order = Array.from(links).map(link => link.innerText);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                saveDataToCloud(); 
            }
        }

        function renameProjectLogic(oldName, newName) {
            if (appDB[oldName] !== undefined) {
                appDB[newName] = appDB[oldName];
                delete appDB[oldName];
            } else {
                appDB[newName] = ""; 
            }
            
            if (updateTimes[oldName]) {
                updateTimes[newName] = updateTimes[oldName];
                delete updateTimes[oldName];
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
            }

            if (appDB['_CONFIG_ORDER_']) {
                let order = JSON.parse(appDB['_CONFIG_ORDER_']);
                const idx = order.indexOf(oldName);
                if (idx !== -1) order[idx] = newName;
                else order.push(newName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            } else {
                let order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && !k.startsWith('_DELETED_::'));
                if(!order.includes(newName)) order.push(newName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            }

            renderSidebar();

            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (currentPjt === oldName) {
                document.body.setAttribute('data-current-pjt', newName);
                const titleInput = document.getElementById('pjtTitle');
                if(titleInput) {
                    titleInput.value = newName;
                    titleInput.setAttribute('value', newName);
                }
                commitCurrentState();
            }
            
            const activeName = (currentPjt === oldName) ? newName : currentPjt;
            document.querySelectorAll('.pjt-link').forEach(link => {
                if(link.innerText === activeName) {
                    link.classList.remove('text-slate-400');
                    link.classList.add('text-white', 'font-semibold');
                    link.className = link.className.replace('before:bg-slate-600', 'before:bg-brand-blue');
                }
            });

            saveDataToCloud();
        }

        function renameProject(oldName, btnElement) {
            let newName = prompt("새로운 프로젝트 이름을 입력하세요:", oldName);
            if (!newName) return;
            newName = newName.trim();
            if (newName === oldName) return;
            
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        function renameFromTitle(inputEl) {
            const oldName = document.body.getAttribute('data-current-pjt');
            const newName = inputEl.value.trim();
            
            if(!newName || newName === oldName) {
                inputEl.value = oldName; 
                return; 
            }
            if(appDB.hasOwnProperty(newName)) {
                alert("이미 존재하는 프로젝트 이름입니다.");
                inputEl.value = oldName;
                return;
            }
            renameProjectLogic(oldName, newName);
        }

        function deleteProject(pjtName, btnElement) {
            if(!confirm(`'${pjtName}' 프로젝트를 삭제하시겠습니까?\n(휴지통으로 이동되며 나중에 복구할 수 있습니다)`)) return;

            const trashKey = `_DELETED_::${pjtName}`;
            appDB[trashKey] = appDB[pjtName] || "";
            delete appDB[pjtName]; 

            if (appDB['_CONFIG_ORDER_']) {
                let order = JSON.parse(appDB['_CONFIG_ORDER_']);
                order = order.filter(name => name !== pjtName);
                appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
            }

            const currentPjt = document.body.getAttribute('data-current-pjt');
            if(currentPjt === pjtName) {
                document.body.setAttribute('data-current-pjt', 'DELETED_TEMP');
            }
            
            renderSidebar();
            
            const firstAvailable = document.querySelector('.pjt-link');
            if(firstAvailable) firstAvailable.click();
            else loadProject('신규 프로젝트', null); 
            
            saveDataToCloud();
        }

        function openTrashModal() {
            const content = document.getElementById('trashContent');
            content.innerHTML = '';
            let hasItems = false;
            for(let key in appDB) {
                if(key.startsWith('_DELETED_::')) {
                    hasItems = true;
                    const originalName = key.replace('_DELETED_::', '');
                    const safeName = originalName.replace(/'/g, "\\'");
                    content.innerHTML += `
                        <div class="flex justify-between items-center bg-slate-900 p-3 rounded-lg border border-slate-700 mb-2">
                            <span class="text-sm text-slate-300 font-semibold truncate pr-4">${originalName}</span>
                            <div class="flex gap-2 shrink-0">
                                <button onclick="restoreProject('${safeName}')" class="text-xs font-bold bg-green-500/20 text-green-400 hover:bg-green-500 hover:text-white px-3 py-1.5 rounded transition-colors"><i class="fas fa-undo-alt mr-1"></i>복구</button>
                                <button onclick="permanentDeleteProject('${safeName}')" class="text-xs font-bold bg-brand-red/20 text-brand-red hover:bg-brand-red hover:text-white px-3 py-1.5 rounded transition-colors">영구삭제</button>
                            </div>
                        </div>
                    `;
                }
            }
            if(!hasItems) content.innerHTML = '<div class="text-center text-slate-500 text-sm py-8"><i class="fas fa-folder-open text-3xl mb-3 block opacity-50"></i>휴지통이 비어있습니다.</div>';
            
            const modal = document.getElementById('trashModal');
            const inner = document.getElementById('trashModalInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); inner.classList.remove('scale-95'); }, 10);
        }

        function closeTrashModal() {
            const modal = document.getElementById('trashModal');
            const inner = document.getElementById('trashModalInner');
            modal.classList.add('opacity-0'); inner.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function restoreProject(pjtName) {
            const trashKey = `_DELETED_::${pjtName}`;
            if(appDB[trashKey] !== undefined) {
                appDB[pjtName] = appDB[trashKey];
                delete appDB[trashKey];
                
                let order = [];
                if (appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']);
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && !k.startsWith('_DELETED_::'));
                
                if (!order.includes(pjtName)) {
                    order.push(pjtName);
                    appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                }
                renderSidebar();
                saveDataToCloud();
                openTrashModal();
                
                setTimeout(() => {
                    const links = document.querySelectorAll('.pjt-link');
                    for(let link of links) {
                        if(link.innerText === pjtName) { link.click(); break; }
                    }
                    closeTrashModal();
                }, 100);
            }
        }

        function permanentDeleteProject(pjtName) {
            if(!confirm(`'${pjtName}' 프로젝트를 영구 삭제하시겠습니까?\\n이 작업은 되돌릴 수 없습니다.`)) return;
            const trashKey = `_DELETED_::${pjtName}`;
            delete appDB[trashKey];
            saveDataToCloud();
            openTrashModal();
        }

        window.deleteElement = function(btn, event) {
            if(event) event.stopPropagation();
            const target = btn.parentElement;
            target.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            target.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            target.querySelectorAll('select').forEach(el => {
                const selectedValue = el.value;
                Array.from(el.options).forEach(opt => {
                    if (opt.value === selectedValue) opt.setAttribute('selected', 'selected');
                    else opt.removeAttribute('selected');
                });
            });
            deletedNodeInfo = { node: target, parent: target.parentNode, nextSibling: target.nextSibling };
            target.remove();
            showUndoToast();
        }

        function showUndoToast() {
            const toast = document.getElementById('undoToast');
            // 실행 취소 내용 복구
            toast.innerHTML = `<i class="fas fa-info-circle text-brand-blue"></i><span class="text-sm font-medium ml-2">항목이 삭제되었습니다.</span><button onclick="undoDelete()" class="text-brand-cyan text-sm font-bold hover:text-brand-blue transition-colors focus:outline-none ml-4 pointer-events-auto cursor-pointer">실행 취소</button><button onclick="closeUndoToast()" class="text-slate-400 hover:text-white ml-2 pointer-events-auto cursor-pointer"><i class="fas fa-times"></i></button>`;
            toast.classList.remove('translate-y-24', 'opacity-0', 'pointer-events-none');
            if(toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { closeUndoToast(); }, 5000); 
        }

        window.closeUndoToast = function() {
            const toast = document.getElementById('undoToast');
            toast.classList.add('translate-y-24', 'opacity-0', 'pointer-events-none');
        }

        window.undoDelete = function() {
            if(deletedNodeInfo && deletedNodeInfo.parent) {
                if(deletedNodeInfo.nextSibling) deletedNodeInfo.parent.insertBefore(deletedNodeInfo.node, deletedNodeInfo.nextSibling);
                else deletedNodeInfo.parent.appendChild(deletedNodeInfo.node);
                closeUndoToast();
                deletedNodeInfo = null; 
            }
        }

        window.toggleDept = function(btn, event) {

        function sortHistory() {
            const container = document.getElementById('history-container');
            if (!container) return;
            const tiles = Array.from(container.children);
            tiles.sort((a, b) => {
                const dateA = a.querySelector('input[type="date"]')?.value || "";
                const dateB = b.querySelector('input[type="date"]')?.value || "";
                return dateB.localeCompare(dateA); 
            });
            tiles.forEach(tile => container.appendChild(tile));
        }

        function addNewProject() {
            let defaultName = "신규 프로젝트";
            let counter = 1;
            while(appDB.hasOwnProperty(defaultName) || appDB.hasOwnProperty(`_DELETED_::${defaultName}`)) {
                defaultName = `신규 프로젝트 ${counter}`;
                counter++;
            }
            
            let pjtName = prompt("새로운 프로젝트 이름을 입력하세요:", defaultName);
            if (pjtName) {
                pjtName = pjtName.trim();
                if(appDB.hasOwnProperty(pjtName) || appDB.hasOwnProperty(`_DELETED_::${pjtName}`)) {
                    alert("이미 존재하거나 휴지통에 있는 프로젝트 이름입니다.");
                    return;
                }
                appDB[pjtName] = ""; 
                
                let order = [];
                if (appDB['_CONFIG_ORDER_']) order = JSON.parse(appDB['_CONFIG_ORDER_']);
                else order = Object.keys(appDB).filter(k => k !== '_CONFIG_ORDER_' && k !== '_UPDATED_TIMES_' && !k.startsWith('_DELETED_::'));
                
                if (!order.includes(pjtName)) {
                    order.push(pjtName);
                    appDB['_CONFIG_ORDER_'] = JSON.stringify(order);
                }

                renderSidebar();
                const links = document.querySelectorAll('.pjt-link');
                if(links.length > 0) loadProject(pjtName, links[links.length - 1]);
                saveDataToCloud();
            }
        }

        function commitCurrentState() {
            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (!currentPjt || currentPjt === 'DELETED_TEMP') return;
            const syncArea = document.getElementById('sync-area');
            syncArea.querySelectorAll('input').forEach(el => el.setAttribute('value', el.value));
            syncArea.querySelectorAll('textarea').forEach(el => el.textContent = el.value);
            syncArea.querySelectorAll('select').forEach(el => {
                Array.from(el.options).forEach(opt => { if (opt.value === el.value) opt.setAttribute('selected', 'selected'); else opt.removeAttribute('selected'); });
            });
            appDB[currentPjt] = syncArea.innerHTML;
        }

        // 🔥 듀얼 DB 시스템 클라우드 + 로컬스토리지 저장 로직 🔥
        async function saveDataToCloud() {
            const btn = document.getElementById('saveBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin text-sm"></i> <span class="hidden sm:inline">저장 중</span>';
            commitCurrentState();
            
            const currentPjt = document.body.getAttribute('data-current-pjt');
            if (currentPjt && currentPjt !== 'DELETED_TEMP') {
                const now = new Date();
                const timeStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
                updateTimes[currentPjt] = timeStr;
                appDB['_UPDATED_TIMES_'] = JSON.stringify(updateTimes);
                const timeTextEl = document.getElementById('lastModText');
                if(timeTextEl) timeTextEl.innerText = `최종 수정: ${timeStr}`;
            }

            // 1. 클라우드 실패를 대비해 브라우저(Local DB)에 무조건 먼저 저장
            try {
                localStorage.setItem(LOCAL_DB_KEY, JSON.stringify(appDB));
            } catch(e) { console.error("로컬 스토리지 저장 실패", e); }

            // 2. 클라우드 DB 저장 시도
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 6000); // 클라우드 대기 6초
                
                const response = await fetch(WEB_APP_URL, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, 
                    body: JSON.stringify(appDB),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error("네트워크 연결 오류");
                
                btn.innerHTML = '<i class="fas fa-check text-green-400 text-sm"></i> <span class="hidden sm:inline">완료</span>';
                btn.classList.replace('border-green-500', 'border-green-400');
            } catch (err) { 
                console.warn("클라우드 저장 실패, 오프라인 로컬 DB에만 저장됨:", err);
                btn.innerHTML = '<i class="fas fa-hdd text-yellow-400 text-sm"></i> <span class="hidden sm:inline text-yellow-400">로컬 저장됨</span>';
            }
            setTimeout(() => { btn.innerHTML = '<i class="fas fa-save text-sm"></i> <span class="hidden sm:inline">저장</span>'; btn.classList.replace('border-green-400', 'border-green-500'); }, 2500);
        }

        function previewFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; const MAX_HEIGHT = 600;
                    let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
                    else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    const previewImage = document.getElementById('previewImage');
                    const placeholder = document.getElementById('uploadPlaceholder');
                    const changeBtn = document.getElementById('changeImgBtn');
                    const zoomHint = document.getElementById('zoomHintIcon');
                    
                    previewImage.src = dataUrl;
                    previewImage.setAttribute('src', dataUrl);
                    previewImage.classList.remove('hidden');
                    if(placeholder) placeholder.classList.add('hidden');
                    if(changeBtn) changeBtn.classList.remove('hidden');
                    if(zoomHint) zoomHint.classList.remove('hidden');
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        window.filterProjects = function(inputEl) {
            let query = inputEl;
            if(typeof inputEl === 'object' && inputEl !== null) query = inputEl.value || '';
            const normalizedQuery = query.toLowerCase().replace(/\s+/g, '');
            const items = document.querySelectorAll('.pjt-item-wrap');
            const currentPjt = document.body.getAttribute('data-current-pjt');
            
            items.forEach(item => {
                const pjtName = item.querySelector('.pjt-link').innerText;
                const text = pjtName.toLowerCase().replace(/\s+/g, '');
                let statusText = "진행중";
                
                if (pjtName === currentPjt) {
                    const selectEl = document.getElementById('statusSelect');
                    if (selectEl) statusText = selectEl.options[selectEl.selectedIndex].text.toLowerCase().replace(/\s+/g, '');
                } 
                else if (appDB[pjtName]) {
                    const valMatch = appDB[pjtName].match(/<option[^>]*selected[^>]*value=["']([^"']+)["']/i);
                    const textMatch = appDB[pjtName].match(/<option[^>]*selected[^>]*>([^<]+)<\/option>/i);
                    if (valMatch) statusText = valMatch[1].toLowerCase().replace(/\s+/g, '');
                    else if (textMatch) statusText = textMatch[1].toLowerCase().replace(/\s+/g, '');
                }

                if(text.includes(normalizedQuery) || statusText.includes(normalizedQuery)) item.style.display = 'flex';
                else item.style.display = 'none';
            });
        }

        window.executeSmartSearch = function(query) {
            const originalQuery = query.trim();
            query = originalQuery.toLowerCase().replace(/\s+/g, '');
            if (!query) return;

            commitCurrentState();
            document.getElementById('searchQueryBadge').innerText = `'${originalQuery}'`;
            const contentArea = document.getElementById('smartSearchResultContent');
            contentArea.innerHTML = '<div class="text-center py-8 text-slate-400"><i class="fas fa-circle-notch fa-spin text-2xl mb-2"></i><p>프로젝트 및 담당자 DB를 스캔 중입니다...</p></div>';

            const modal = document.getElementById('smartSearchModal');
            const inner = document.getElementById('smartSearchInner');
            modal.classList.remove('hidden');
            setTimeout(() => { modal.classList.remove('opacity-0'); inner.classList.remove('scale-95'); }, 10);

            setTimeout(() => {
                let matchedProjects = [];
                let matchedStakeholders = [];

                for (const pjtName in appDB) {
                    if (pjtName.startsWith('_') || pjtName === 'error') continue;

                    let pjtAdded = false;
                    const doc = parser.parseFromString(appDB[pjtName] || '', 'text/html');

                    let statusText = "진행중";
                    let originalStatusText = "진행 중";
                    const selectEl = doc.querySelector('#statusSelect');
                    if (selectEl) {
                        const selectedOpt = selectEl.querySelector('option[selected]');
                        originalStatusText = selectedOpt ? selectedOpt.value : selectEl.value;
                        statusText = originalStatusText.toLowerCase().replace(/\s+/g, '');
                    }

                    if (pjtName.toLowerCase().replace(/\s+/g, '').includes(query) || statusText.includes(query)) {
                        matchedProjects.push({ name: pjtName, reason: pjtName.toLowerCase().replace(/\s+/g, '').includes(query) ? "프로젝트명 일치" : `상태 일치 (${originalStatusText})` });
                        pjtAdded = true;
                    }

                    doc.querySelectorAll('.stakeholder-tile').forEach(tile => {
                        const inputs = tile.querySelectorAll('input[type="text"]');
                        if(inputs.length >= 3) {
                            const type = inputs[0].value || inputs[0].placeholder || "";
                            const company = inputs[1].value || inputs[1].placeholder || "";
                            const person = inputs[2].value || inputs[2].placeholder || "";
                            const deptSelect = tile.querySelector('select');
                            const dept = deptSelect ? deptSelect.value : "";
                            const insightTextarea = tile.querySelector('textarea');
                            const insight = insightTextarea ? insightTextarea.value : "";

                            if(`${type} ${company} ${person} ${dept} ${insight}`.toLowerCase().replace(/\s+/g, '').includes(query)) {
                                matchedStakeholders.push({
                                    pjtName: pjtName, type: type, company: company, person: person,
                                    dept: dept === '없음' || dept === '담당 부서 선택' ? '-' : dept
                                });
                                if(!pjtAdded) { matchedProjects.push({ name: pjtName, reason: "관련 담당자/업체 검색됨" }); pjtAdded = true; }
                            }
                        }
                    });
                }
                renderSearchResults(matchedProjects, matchedStakeholders);
            }, 50); 
        };

                    html += `
                        <div onclick="goToProjectFromSearch('${p.name.replace(/'/g, "\\'")}')" class="bg-slate-900/50 hover:bg-slate-800 border border-slate-700 hover:border-brand-blue p-4 rounded-xl cursor-pointer transition-all group flex items-center justify-between">
                            <div><div class="text-[15px] font-bold text-white mb-1">${p.name}</div><div class="text-[10px] text-slate-400"><i class="fas fa-check text-green-400 mr-1"></i>${p.reason}</div></div>
                            <div class="w-8 h-8 rounded-full bg-slate-800 group-hover:bg-brand-blue flex items-center justify-center transition-colors shrink-0"><i class="fas fa-external-link-alt text-slate-400 group-hover:text-white transition-colors text-xs"></i></div>
                        </div>`;
                });
                html += `</div></div>`;
            }
            contentArea.innerHTML = html;
        }

        window.goToProjectFromSearch = function(pjtName) {
            closeSmartSearchModal();
            const links = document.querySelectorAll('.pjt-link');
            let found = false;
            for (let link of links) {
                if (link.innerText === pjtName) { link.click(); found = true; break; }
            }
            if(!found) loadProject(pjtName, null);
        }

        window.closeSmartSearchModal = function() {
            const modal = document.getElementById('smartSearchModal');
            const inner = document.getElementById('smartSearchInner');
            if(modal && inner) {
                modal.classList.add('opacity-0'); inner.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
            const input = document.getElementById('pjtSearch');
            if(input) { input.value = ''; filterProjects(''); }
        }

        document.addEventListener('keydown', function(e) {
            const isMac = window.navigator.platform.match("Mac");
            const cmdKey = isMac ? e.metaKey : e.ctrlKey;
            
            if (cmdKey && e.key === 's') { e.preventDefault(); saveDataToCloud(); }
            if (cmdKey && e.key === 'z') {
                const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
                if (activeTag !== 'input' && activeTag !== 'textarea' && deletedNodeInfo) { e.preventDefault(); undoDelete(); }
            }

            if (e.key === 'Escape') {
                const smartSearchModal = document.getElementById('smartSearchModal');
                if (smartSearchModal && !smartSearchModal.classList.contains('hidden')) closeSmartSearchModal();
                
                const detailModal = document.getElementById('detailModal');
                if (detailModal && !detailModal.classList.contains('hidden')) closeModal();
                
                const imageModal = document.getElementById('imageModal');
                if (imageModal && !imageModal.classList.contains('hidden')) closeImageModal();
                
                const trashModal = document.getElementById('trashModal');
                if (trashModal && !trashModal.classList.contains('hidden')) closeTrashModal();
            }
        }, false);
    </script>
</body>
</html>
